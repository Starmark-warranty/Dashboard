<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ax Progress · รายชิ้นในลอต</title>
<!-- =====================================================================
  Lot Parts · รายชิ้นในลอต        ·   VERSION 2.1
  CHANGELOG  (ใหม่สุดอยู่บนสุด ห้ามลบของเก่า)
  2.1  2026-09-08  FIX  ห่ออุปกรณ์ถูกนับเป็น "ยังไม่ตัด" ทำให้ค้างที่ 98% ตลอดไป
                   แถวที่ Finish Length หรือ Finish Width เป็น 0 คือห่อ
                   ตรวจกับของจริงแล้วเป็น Accessory_Pack กับ Fitting_Pack ล้วน ๆ
                   มันไม่เคยถูกตัด ช่อง Part จึงไม่มีวันติ๊ก
                   ลอต INNOPD_L_FL3_BF308A_309A ยังไม่ติ๊ก 14 แถว
                   แต่ 12 แถวเป็นห่อ เหลือชิ้นที่ต้องตัดจริงแค่ 2
                   · แถบล่างนับแยก ต้องตัด / ตัดแล้ว / ยังไม่ตัด / ห่ออุปกรณ์
                     % คิดจากชิ้นที่ต้องตัดเท่านั้น
                   · นับแบบเดียวกับ StarSync และหน้า Cutting Center ที่แยก
                     total_parts กับ total_all อยู่แล้ว ไม่งั้นสองหน้าจะขึ้น
                     ตัวเลขไม่เท่ากัน แล้วไม่มีใครรู้ว่าอันไหนถูก
                   FEAT ปุ่มกรองแถว ทั้งหมด / ยังไม่ตัด / ห่ออุปกรณ์ ที่แถบล่าง
                   กดปุ่มเดียวได้รายการชิ้นที่ยังค้างจริง ๆ
                   CHANGE แถวห่อแสดงเป็นสีจาง · ของจริงในโปรแกรมไม่ได้ทำ
                   แต่นี่คือจุดที่อ่านผิดกันมาแล้วว่าทำไมไม่ติ๊กสักที
  2.0  2026-09-08  CHANGE ทำหน้าตาให้เหมือนโปรแกรม Ax Progress ของจริง
                   1.x เป็นธีมมืดแบบ dashboard ซึ่งคนละภาษากับโปรแกรมที่
                   หน้างานใช้อยู่ทุกวัน · คนเปิดมาแล้วต้องแปลว่าอะไรคืออะไรใหม่
                   ทั้งที่เป็นข้อมูลชุดเดียวกัน · เอาให้เหมือนก่อน ค่อยคุยเรื่องอื่น
                   · ธีมสว่างแบบ DevExpress Office 2007 Blue ตามที่โปรแกรมใช้
                   · หัวตารางซ้อนสองชั้น · แถบ "State" คร่อมช่องติ๊กเหมือนของจริง
                     คำนวณช่วงคร่อมจากคอลัมน์ที่เปิดอยู่จริง ไม่ได้ fix ไว้
                     เพราะผู้ใช้สลับลำดับคอลัมน์เองได้ ถ้า fix ไว้แถบจะเพี้ยน
                   · ช่องติ๊กเป็นกล่องสี่เหลี่ยมจริง พื้นหลังคอลัมน์เขียวอ่อน
                     เหมือนแถบ State ในโปรแกรม
                   · แถวกรองใต้หัวตาราง มีไอคอนกรวยเหมือนของจริง
                   · แถบล่างขวาขึ้น Total ตามด้วยจำนวนแถว เหมือนมุมล่างของโปรแกรม
                   · คอลัมน์ # ทางซ้ายตรึงไว้ ไม่เลื่อนตามแนวนอน
                   FEAT รายการลอตซ่อนลอตที่ตัดจบแล้วเป็นค่าเริ่มต้น
                   ตัดจบแล้วไม่ได้แปลว่าจบงาน อาจยังไม่ส่งหรือยังอยู่ในคลัง
                   ข้อมูลจึงยังโหลดได้ตามปกติ แค่ไม่เกะกะตอนไล่หาลอตที่ทำอยู่
                   มีปุ่มสลับให้เห็นทั้งหมดเมื่อต้องการ
                   FEAT เปิดหน้ามาเจอลอตที่มีข้อมูลจริงเลย
                   ถามจาก lot_part ว่าลอตไหนถูกดึงล่าสุด แล้วเปิดตัวนั้นให้
                   ของเดิมเปิดมาเจอจอเปล่าถ้าไม่เคยเลือกลอตไว้
                   ยังไม่ได้ทดสอบกับของจริง
  1.6  2026-09-08  FIX  เลือกแหล่งข้อมูลเป็นราย lot + ปุ่มสั่งดึงจาก AX
  1.5  2026-09-08  FEAT ชื่อคอลัมน์ถอดมาจากนิยามกริดใน AxProgress.exe
  1.4  2026-09-08  FIX  COLS_VER · ชุดคอลัมน์ที่เพิ่มใหม่ไม่เคยโผล่
  1.3  2026-09-08  CHANGE เปิดเป็นแท็บของตัวเอง
  1.2  2026-09-08  FIX  ตรวจกับโครงจริงบน Supabase · imported_at ไม่ใช่ created_at
  1.1  2026-09-08  FEAT คอลัมน์ครบตามไฟล์ export + สถานะครบ 6 ช่อง
  1.0  2026-09-08  FEAT หน้าแรก
===================================================================== -->
<style>
/* ── สีชุด DevExpress Office 2007 Blue · ตามที่โปรแกรมตั้งไว้ ──
   ห้ามใส่ค่าสีดิบนอกบล็อกนี้ */
:root{
  --pg:#eef3fa;            /* พื้นหลังหน้า */
  --panel:#f4f8fd;         /* แถบเครื่องมือ */
  --panel2:#e2edf8;
  --line:#a6c9e2;          /* เส้นขอบหลัก */
  --line2:#cfdff0;         /* เส้นตารางบาง */
  --hd1:#f0f7fd;           /* หัวตาราง บน */
  --hd2:#c9dff2;           /* หัวตาราง ล่าง */
  --band1:#dceafa;         /* แถบ band บน */
  --band2:#b8d4ee;         /* แถบ band ล่าง */
  --flt:#f7fbff;           /* แถวกรอง */
  --row:#ffffff;
  --row2:#f6faff;
  --hov:#e3f0fb;
  --sel:#b8d6f0;
  --stbg:#dcf0cc;          /* พื้นคอลัมน์ State เขียวอ่อน */
  --stbg2:#cfe9ba;
  --tx:#1f1f1f;
  --mu:#5a6b7c;
  --mu2:#8fa3b5;
  --blue:#1c5fa8;
  --btn1:#fdfeff;
  --btn2:#dbe9f7;
  --btnh:#fff3cd;
  --btnhb:#e0a33e;
  --warn:#8a6d1f;
  --warnbg:#fff8e1;
  --warnbd:#e8d08a;
  --err:#a11;
  --mono:'Consolas','Courier New',monospace;
  --sans:'Segoe UI',Tahoma,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--pg);color:var(--tx);font-size:12px;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}

/* ── แถบเครื่องมือด้านบน · ล้อแถบ Home ของโปรแกรม ─────────────── */
.ribbon{background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
  border-bottom:1px solid var(--line);padding:6px 10px;flex:0 0 auto;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fld{display:flex;align-items:center;gap:5px}
.fld > label{color:var(--mu);white-space:nowrap;font-size:12px}
.ro{background:#fff;border:1px solid var(--line);border-radius:2px;padding:3px 7px;
  min-height:24px;display:flex;align-items:center;color:var(--tx);
  max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ro.empty{color:var(--mu2)}

/* ปุ่มแบบ ribbon */
.btn{padding:4px 10px;min-height:26px;border:1px solid var(--line);border-radius:3px;
  background:linear-gradient(180deg,var(--btn1) 0%,var(--btn2) 100%);
  color:var(--tx);cursor:pointer;font-size:12px;font-family:inherit;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{background:var(--btnh);border-color:var(--btnhb)}
.btn:disabled{opacity:.5;cursor:not-allowed;background:var(--btn2)}
.btn.on{background:var(--btnh);border-color:var(--btnhb);font-weight:700}

/* กล่องค้นหาลอต · ทำให้ดูเหมือน combo box ของโปรแกรม */
.lotw{position:relative;width:min(360px,52vw)}
.lotw input{width:100%;min-height:26px;background:#fff;border:1px solid var(--line);
  border-radius:2px;padding:3px 26px 3px 7px;font-size:12px;font-family:var(--mono)}
.lotw input:focus{outline:none;border-color:var(--blue)}
.lotw .cbtn{position:absolute;right:1px;top:1px;bottom:1px;width:20px;border:0;
  background:linear-gradient(180deg,var(--btn1) 0%,var(--btn2) 100%);
  border-left:1px solid var(--line);cursor:pointer;color:var(--mu);font-size:9px}
.lotw .cbtn:hover{background:var(--btnh)}
.sug{position:absolute;left:0;right:0;top:calc(100% + 2px);background:#fff;
  border:1px solid var(--line);max-height:340px;overflow-y:auto;z-index:60;display:none;
  box-shadow:0 6px 18px rgba(0,0,0,.22)}
.sug.on{display:block}
.sug-hd{padding:5px 8px;background:var(--panel2);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;position:sticky;top:0}
.sug-i{padding:4px 8px;cursor:pointer;border-bottom:1px solid var(--line2);
  display:flex;align-items:center;gap:8px}
.sug-i:hover,.sug-i.a{background:var(--sel)}
.sug-l{font-family:var(--mono);color:var(--blue);font-weight:700;flex:0 0 auto}
.sug-p{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sug-n{font-family:var(--mono);color:var(--mu2);flex:0 0 auto;font-size:11px}
.sug-i.fin .sug-l{color:var(--mu)}
.hi{background:#ffe9a8}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.dot.go{background:#2e9e3f}.dot.fin{background:#9aa}.dot.no{background:#d0a13a}

/* ── แถบเตือน ─────────────────────────────────────────────────── */
.note{background:var(--warnbg);border-bottom:1px solid var(--warnbd);color:var(--warn);
  padding:5px 10px;flex:0 0 auto;display:flex;gap:8px;align-items:center;font-size:12px}

/* ── ตาราง ───────────────────────────────────────────────────── */
.wrap{flex:1 1 auto;overflow:auto;background:var(--row);
  border-top:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}

/* หัวตารางสามชั้น: band / ชื่อคอลัมน์ / แถวกรอง */
thead th{background:linear-gradient(180deg,var(--hd1) 0%,var(--hd2) 100%);
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  color:var(--tx);font-weight:400;font-size:12px;text-align:left;padding:0;
  white-space:nowrap;user-select:none}
thead tr.band th{background:linear-gradient(180deg,var(--band1) 0%,var(--band2) 100%);
  text-align:center;font-weight:700;position:sticky;top:0;z-index:32;height:20px}
thead tr.cols th{position:sticky;top:20px;z-index:31}
thead tr.flt  th{position:sticky;top:43px;z-index:30;background:var(--flt);
  padding:2px 3px;border-bottom:1px solid var(--line)}
.th-in{display:flex;align-items:center;gap:4px;padding:4px 6px;cursor:pointer;position:relative;height:23px}
.th-in:hover{background:var(--hov)}
.th-in.num{justify-content:flex-end}
.th-s{font-size:9px;color:var(--blue)}
.rz{position:absolute;right:-3px;top:0;width:7px;height:100%;cursor:col-resize;z-index:5}
.rz:hover{background:var(--blue)}
.fbox{display:flex;align-items:center;gap:3px;background:#fff;
  border:1px solid var(--line2);border-radius:2px;padding:1px 3px}
.fbox .fi{color:var(--mu2);font-size:9px;flex:0 0 auto}
.fbox input{width:100%;min-width:40px;border:0;outline:0;font-size:11px;
  font-family:var(--mono);background:transparent;color:var(--tx);padding:1px 0}

tbody td{padding:2px 6px;border-right:1px solid var(--line2);
  border-bottom:1px solid var(--line2);height:21px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
tbody tr{background:var(--row)}
tbody tr:nth-child(even){background:var(--row2)}
tbody tr:hover td{background:var(--hov)}
td.mono{font-family:var(--mono)}
td.num{font-family:var(--mono);text-align:right}
/* แถวห่ออุปกรณ์ · ไม่มีขนาดจึงไม่ต้องตัด ช่อง Part ไม่มีวันติ๊ก */
tbody tr.pk td{color:var(--mu)}
tbody tr.pk td.st{background:#eceff2}
tbody tr.pk:nth-child(even) td.st{background:#e4e8ec}

/* คอลัมน์ลำดับแถว ตรึงซ้าย เหมือนแถบ indicator ของโปรแกรม */
td.idx,thead th.idx{position:sticky;left:0;z-index:20}
thead th.idx{z-index:35}
td.idx{background:linear-gradient(180deg,var(--hd1) 0%,var(--hd2) 100%);
  font-family:var(--mono);color:var(--mu);text-align:right;
  border-right:1px solid var(--line)}
tbody tr:hover td.idx{background:var(--band2)}

/* ช่องติ๊กในแถบ State */
td.st{background:var(--stbg);text-align:center}
tbody tr:nth-child(even) td.st{background:var(--stbg2)}
tbody tr:hover td.st{background:var(--stbg2)}
.cbx{display:inline-block;width:13px;height:13px;line-height:11px;font-size:10px;
  border:1px solid #7a8fa0;background:#fff;color:#1a6b1a;text-align:center;
  border-radius:2px;vertical-align:middle}
.cbx.n{color:transparent}

/* ── แถบสถานะล่าง ────────────────────────────────────────────── */
.status{flex:0 0 auto;background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
  border-top:1px solid var(--line);padding:4px 10px;display:flex;gap:12px;
  align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mu)}
.status .n{font-family:var(--mono);color:var(--tx);font-weight:700}
.status .n.bad{color:#b3401f}
.status .n.mu{color:var(--mu2)}
.status .btn{padding:2px 8px;min-height:22px}
.status .tot{margin-left:auto;display:flex;align-items:center;gap:10px}
.pbar{width:130px;height:11px;border:1px solid var(--line);background:#fff;overflow:hidden}
.pbar>i{display:block;height:100%;background:linear-gradient(180deg,#8fd07a,#4fa03a)}

/* ── สถานะกลางจอ ─────────────────────────────────────────────── */
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--mu);text-align:center;padding:24px;background:var(--row)}
.mid .big{font-size:34px;opacity:.3}
.mid .t{font-size:14px;color:var(--tx)}
.mid .s{font-size:12px;max-width:520px;line-height:1.7}
.mid code{font-family:var(--mono);background:var(--panel2);padding:1px 4px}
.mid .e{font-family:var(--mono);font-size:11px;color:var(--err);word-break:break-all}
.spin{width:22px;height:22px;border:3px solid var(--line2);border-top-color:var(--blue);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── กล่องซ้อน ───────────────────────────────────────────────── */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:400;
  justify-content:center;align-items:flex-start;padding:24px 12px;overflow-y:auto}
.ov.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:4px;
  width:min(620px,96vw);margin:auto;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.modal h3{font-size:13px;font-weight:700;padding:7px 12px;
  background:linear-gradient(180deg,var(--band1) 0%,var(--band2) 100%);
  border-bottom:1px solid var(--line)}
.modal .bd{padding:12px}
.modal .sub{color:var(--mu);line-height:1.6;margin-bottom:10px}
.pre{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.cl{max-height:50vh;overflow-y:auto;border:1px solid var(--line);background:#fff}
.cl-i{display:flex;align-items:center;gap:8px;padding:3px 8px;min-height:32px;
  border-bottom:1px solid var(--line2);cursor:grab}
.cl-i:last-child{border-bottom:0}
.cl-i:hover{background:var(--hov)}
.cl-i.drag{opacity:.35}
.cl-i.over{border-top:2px solid var(--blue)}
.cl-i .gp{color:var(--mu2);cursor:grab}
.cl-i input[type=checkbox]{width:14px;height:14px;cursor:pointer;flex:0 0 auto}
.cl-nm{flex:1;min-width:0}
.cl-nm .a{color:var(--tx)}
.cl-nm .b{font-family:var(--mono);font-size:10px;color:var(--mu2)}
.cl-i.off .cl-nm .a{color:var(--mu2)}
.cl-i .mv button{background:linear-gradient(180deg,var(--btn1),var(--btn2));
  border:1px solid var(--line);width:24px;height:22px;cursor:pointer;font-size:9px}
.cl-i .mv button:hover{background:var(--btnh)}
.br{display:flex;gap:6px;justify-content:flex-end;margin-top:11px}
.f2{margin-bottom:8px}
.f2 label{display:block;color:var(--mu);margin-bottom:2px}
.f2 input{width:100%;min-height:26px;background:#fff;border:1px solid var(--line);
  padding:4px 7px;font-size:12px;font-family:var(--mono)}
select.sel{background:#fff;border:1px solid var(--line);border-radius:2px;
  padding:3px 6px;min-height:26px;font-size:12px;font-family:inherit;cursor:pointer}
</style>
</head>
<body>

<div id="app">

  <!-- แถบเครื่องมือ · ล้อหน้า Home ของโปรแกรม -->
  <div class="ribbon">
    <div class="fld">
      <label>Lot Id</label>
      <div class="lotw">
        <input type="text" id="q" autocomplete="off" spellcheck="false" placeholder="พิมพ์รหัส lot หรือชื่อโครงการ">
        <button class="cbtn" data-act="drop" title="เลือกจากรายการ">▼</button>
        <div class="sug" id="sug"></div>
      </div>
    </div>
    <div class="fld"><label>Name</label><div class="ro empty" id="fName">—</div></div>
    <div class="fld"><label>หมวดงาน</label><div class="ro empty" id="fCat">—</div></div>

    <button class="btn" data-act="reload" title="ดึงข้อมูลใหม่">⟳ ReLoad</button>
    <button class="btn" data-act="cols">▦ คอลัมน์</button>
    <button class="btn" data-act="csv">⤓ Export</button>
    <select class="sel" id="tbl" title="แหล่งข้อมูล"></select>
    <button class="btn" data-act="cfg" title="ตั้งค่าการเชื่อมต่อ">⚙</button>
  </div>

  <!-- แถบเตือน -->
  <div class="note" id="note" style="display:none"><span>⚠</span><span id="noteTx"></span></div>

  <!-- ตาราง / สถานะ -->
  <div class="wrap" id="wrap" style="display:none"><table id="grid"></table></div>
  <div class="mid" id="mid"></div>

  <!-- แถบสถานะล่าง -->
  <div class="status" id="status"></div>
</div>

<!-- ── จัดคอลัมน์ ─────────────────────────────────────────────── -->
<div class="ov" id="ovCols">
  <div class="modal">
    <h3>จัดคอลัมน์</h3>
    <div class="bd">
      <div class="sub">ติ๊กเพื่อเปิดปิด · ลากหรือกดลูกศรเพื่อสลับลำดับ ·
        รายการนี้อ่านจากโครงตารางใน Supabase โดยตรง</div>
      <div class="pre" id="pre"></div>
      <div class="cl" id="cl"></div>
      <div class="br">
        <button class="btn" data-act="colreset">คืนค่าเริ่มต้น</button>
        <button class="btn" data-act="colclose">ตกลง</button>
      </div>
    </div>
  </div>
</div>

<!-- ── ตั้งค่าการเชื่อมต่อ ─────────────────────────────────────── -->
<div class="ov" id="ovCfg">
  <div class="modal" style="width:min(520px,96vw)">
    <h3>การเชื่อมต่อ Supabase</h3>
    <div class="bd">
      <div class="sub">ใช้ค่าเดียวกับหน้าหลัก (<code>cc_supa_url</code> / <code>cc_supa_key</code>)</div>
      <div class="f2"><label>Project URL</label><input type="text" id="cfgUrl" placeholder="https://xxxx.supabase.co"></div>
      <div class="f2"><label>Publishable key</label><input type="text" id="cfgKey" placeholder="sb_publishable_..."></div>
      <div class="br">
        <button class="btn" data-act="cfgclose">ยกเลิก</button>
        <button class="btn" data-act="cfgsave">บันทึกแล้วโหลดใหม่</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

/* ══════════════════════════════════════════════════════════════
   ตัวช่วยพื้นฐาน
   ══════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);

/* ค่าที่มาจากผู้ใช้หรือฐานข้อมูลต้องผ่านตัวนี้ก่อนต่อเป็นสตริง HTML */
function esc(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* มีอักษรไทยไหม · ฟอนต์ mono ไม่มีตัวอักษรไทย ฝืนใช้แล้วตกบรรทัดเพี้ยน */
const RE_TH = /[\u0E00-\u0E7F]/;
const isTh  = v => RE_TH.test(String(v == null ? '' : v));

/* เวลา · ตัดสตริงตรง ๆ ไม่ผ่าน new Date()
   StarSync เขียนเวลาท้องถิ่นลงไปดิบ ๆ ถ้าแปลง timezone อีกทีจะไม่ตรงกับหน้าหลัก */
const fmtTime = v => String(v || '').replace('T',' ').slice(0,19);
const nf2 = new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat('en-US');

function hms(s){
  s = Math.max(0, parseInt(s,10) || 0);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h + ':' + String(m).padStart(2,'0') + ':' + String(x).padStart(2,'0');
}

/* ══════════════════════════════════════════════════════════════
   S = แหล่งความจริงเดียวของสถานะ · แก้ S แล้วเรียก render()
   ══════════════════════════════════════════════════════════════ */
const S = {
  url:'', key:'',
  schema:{},          // { ชื่อตาราง: [ชื่อคอลัมน์] }
  table:'lot_part',
  pin:false,          // ผู้ใช้เลือกตารางเองแล้ว อย่าสลับให้อัตโนมัติ
  cols:[],            // [{k,on,w}]
  lots:[], lot:'', rows:[], prog:null,
  showFin:false,      // แสดงลอตที่ตัดจบแล้วในรายการด้วยไหม
  filters:{}, sort:{k:'',dir:0},
  view:'all',         // ตัวกรองแถว: all | todo | pack
  busy:'', err:'', needReq:false,
  sugOn:false, sugIdx:-1, sugList:[]
};

/* ชื่อหัวคอลัมน์ · ถอดมาจากนิยามกริดในตัว AxProgress.exe ทั้งหมด */
const LBL = {
  st_part:'Part', st_pack:'Pack', st_pick:'Pick', st_wh:'Wh',
  st_delivery:'Delivery', st_site:'Site', st_wh_rec:'Wh Rec', st_wh_issue:'Wh Issue',
  rec_id:'Rec Id', lot:'Lot Id', proj_id:'Proj Id', proj_name:'Proj Name',
  order_number:'OrderNumber', build:'Build', floor:'Floor', room:'Room',
  room_category:'หมวดงาน', shelf_no:'Shelf No',
  product_article:'Product Article', product_name:'Product Name',
  item_fg:'Item Fg', item_part:'Item Part', part_name:'Part Name',
  code_part:'Code Part', code_pack:'Code Pack', material_code:'Material Code',
  finish_length:'Finish Length', finish_width:'Finish Width',
  part_seq_total:'Part Seq Total', product_seq_total:'Product Seq Total',
  pack_seq_total:'Pack Seq Total', item_id:'Item Id', delay_no:'Delay No',
  synced_at:'ดึงจาก AX เมื่อ',
  id:'ID', part_date:'เวลาที่ยิง', duration_sec:'เวลาสะสม', computer:'เครื่อง',
  app_user:'ผู้ใช้', barcode:'Barcode', check_part:'Part', imported_at:'นำเข้าเมื่อ',
  total_parts:'ชิ้นที่ต้องตัด', checked_parts:'ตัดแล้ว',
  total_all:'ทุกแถว', checked_all:'ยิงแล้วทุกแถว', updated_at:'อัปเดตเมื่อ'
};
const lbl = k => LBL[k] || k;

const DATES = new Set(['part_date','imported_at','synced_at','updated_at']);
const NUMS  = new Set(['finish_length','finish_width','duration_sec','id','rec_id',
  'total_parts','checked_parts','total_all','checked_all','delay_no']);
/* ช่องติ๊กในแถบ State · โปรแกรมโชว์ 6 ช่องแรก อีกสองซ่อนไว้ */
const TICKS = new Set(['st_part','st_pack','st_pick','st_wh','st_delivery','st_site',
                       'st_wh_rec','st_wh_issue','check_part']);

const stKey = () => (S.schema[S.table] || []).includes('st_part') ? 'st_part'
                  : ((S.schema[S.table] || []).includes('check_part') ? 'check_part' : '');
const isDone = r => { const k = stKey(); if(!k) return false;
                      const v = r[k]; return v === true || Number(v) === 1; };
/* ตารางที่ดูอยู่มีครบทุกชิ้นในลอตไหม (ไม่ใช่แค่ชิ้นที่ยิงแล้ว) */
const hasFull = () => (S.schema[S.table] || []).includes('st_part');

/* แถวนี้เป็น "ชิ้นที่ต้องตัด" หรือเป็น "ห่อ"
   แถวที่ไม่มีขนาด (Finish Length หรือ Finish Width เป็น 0) คือห่ออุปกรณ์
   ตรวจกับของจริงแล้ว แถวพวกนั้นคือ Accessory_Pack กับ Fitting_Pack ล้วน ๆ
   มันไม่เคยถูกตัด ช่อง Part จึงไม่มีวันติ๊ก ถ้านับรวมเป็น "ยังไม่ตัด"
   ลอตที่ตัดครบแล้วจะค้างอยู่ที่ 98% ตลอดกาล ซึ่งอ่านแล้วเข้าใจผิด
   StarSync กับหน้า Cutting Center แยกสองอย่างนี้อยู่แล้ว (total_parts กับ total_all)
   หน้านี้ต้องนับให้ตรงกัน ไม่งั้นสองหน้าจะขึ้นตัวเลขไม่เท่ากัน */
function isPiece(r){
  if(!('finish_length' in r) && !('finish_width' in r)) return true;
  return Number(r.finish_length) > 0 && Number(r.finish_width) > 0;
}

const PRESETS = {
  'เหมือน Ax Progress':[
    'st_part','st_pack','st_pick','st_wh','st_delivery','st_site','check_part',
    'shelf_no','product_article','product_name','item_fg','part_name','code_pack',
    'material_code','finish_length','finish_width','product_seq_total','pack_seq_total',
    'item_id','delay_no'],
  'กริดเต็มทุกช่อง':[
    'st_part','st_pack','st_pick','st_wh','st_delivery','st_site',
    'st_wh_rec','st_wh_issue','check_part',
    'rec_id','lot','proj_id','proj_name','order_number','build','floor','room',
    'room_category','shelf_no','product_article','product_name','item_fg','item_part',
    'part_name','code_pack','code_part','material_code','finish_length','finish_width',
    'part_seq_total','product_seq_total','pack_seq_total','item_id','barcode','delay_no'],
  'ที่ตั้ง':['st_part','check_part','build','floor','room','room_category','shelf_no',
            'part_name','finish_length','finish_width'],
  'ย่อสั้น':['st_part','check_part','shelf_no','part_name','finish_length','finish_width']
};
const DEF_ON = new Set([
  'st_part','st_pack','st_pick','st_wh','st_delivery','st_site',
  'shelf_no','product_article','product_name','item_fg','part_name','code_pack',
  'material_code','finish_length','finish_width','product_seq_total','pack_seq_total',
  'item_id','delay_no',
  'check_part','part_date','computer','code_part']);

/* ══════════════════════════════════════════════════════════════
   ชั้นคุยกับฐานข้อมูล · ที่อื่นห้ามเรียก fetch ตรง
   ══════════════════════════════════════════════════════════════ */
const db = {
  head(){ return { apikey:S.key, Authorization:'Bearer ' + S.key }; },
  base(){ return S.url.replace(/\/+$/,'') + '/rest/v1/'; },

  async get(path){
    const r = await fetch(this.base() + path, { headers:this.head() });
    if(!r.ok){
      const t = await r.text().catch(()=> '');
      throw new Error('HTTP ' + r.status + ' · ' + t.slice(0,240));
    }
    return r.json();
  },

  /* ถามโครงจาก PostgREST · รองรับทั้ง swagger 2 และ openapi 3
     ทำแบบนี้แทน hardcode เพราะเพิ่มคอลัมน์ทีหลังแล้วมันจะโผล่เอง */
  async schema(){
    const r = await fetch(this.base(), { headers:this.head() });
    if(!r.ok) throw new Error('อ่านโครงตารางไม่ได้ · HTTP ' + r.status);
    const j = await r.json();
    const defs = j.definitions || (j.components && j.components.schemas) || {};
    const out = {};
    for(const t in defs){ const p = defs[t] && defs[t].properties; if(p) out[t] = Object.keys(p); }
    return out;
  },

  lots(){
    return this.get('lot_progress?select=lot,proj_name,proj_id,total_parts,' +
                    'checked_parts,total_all,checked_all&order=lot.asc&limit=8000');
  },

  /* ลอตที่ StarSync เพิ่งดึงรายชิ้นมาล่าสุด · ใช้เป็นลอตเริ่มต้นตอนเปิดหน้า */
  async latestPartsLot(){
    const j = await this.get('lot_part?select=lot&order=synced_at.desc&limit=1');
    return j[0] ? j[0].lot : '';
  },

  /* แถวของลอตหนึ่ง · PostgREST คืนสูงสุด 1000 แถวต่อครั้ง ต้องไล่หน้า
     ต้องสั่ง order ทุกครั้ง ไม่งั้นการไล่หน้าไม่รับประกันว่าแถวจะไม่ซ้ำหรือหาย */
  async rowsOfLot(table, lot){
    const cols = S.schema[table] || [];
    const ord  = cols.includes('shelf_no')  ? 'shelf_no.asc,code_pack.asc,code_part.asc'
               : cols.includes('part_date') ? 'part_date.asc'
               : cols.includes('rec_id')    ? 'rec_id.asc' : 'lot.asc';
    const out = [], PAGE = 1000;
    for(let off = 0; off < 30000; off += PAGE){
      const page = await this.get(table + '?select=*&lot=eq.' + encodeURIComponent(lot) +
                                  '&order=' + ord + '&limit=' + PAGE + '&offset=' + off);
      out.push(...page);
      if(page.length < PAGE) break;
    }
    return out;
  },

  peek(table){ return this.get(table + '?select=*&limit=1000'); }
};

function loadCfg(){
  S.url = localStorage.getItem('cc_supa_url') || '';
  S.key = localStorage.getItem('cc_supa_key') || '';
}

/* ══════════════════════════════════════════════════════════════
   คอลัมน์ · จำการจัดไว้แยกตามตาราง
   ══════════════════════════════════════════════════════════════ */
const colKey = () => 'lp_cols_' + S.table;
/* บวกเลขนี้ทุกครั้งที่แก้ DEF_ON หรือ PRESETS
   ถ้าไม่บวก คนที่เคยจัดคอลัมน์เองไว้จะไม่มีวันเห็นคอลัมน์ที่เพิ่มใหม่ */
const COLS_VER = 6;

function buildCols(){
  const all = S.schema[S.table] || [];
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(colKey()) || 'null'); } catch(e){}
  if(saved && saved.v !== COLS_VER) saved = null;
  const list = (saved && Array.isArray(saved.c)) ? saved.c : null;

  const seen = new Set(), out = [];
  if(list){
    list.forEach(c => {
      if(c && c.k && all.includes(c.k) && !seen.has(c.k)){
        seen.add(c.k); out.push({ k:c.k, on:!!c.on, w:c.w || 0 });
      }
    });
  }
  /* คอลัมน์ใหม่ที่เพิ่งโผล่ ต่อท้ายและปิดไว้ก่อนถ้าเคยจัดเอง
     ไม่งั้นวันไหน StarSync เพิ่มคอลัมน์ ตารางจะกว้างขึ้นเองโดยไม่ได้สั่ง */
  all.forEach(k => { if(!seen.has(k)) out.push({ k, on: list ? false : DEF_ON.has(k), w:0 }); });
  S.cols = out;
}
function saveCols(){
  try { localStorage.setItem(colKey(), JSON.stringify({ v:COLS_VER, c:S.cols })); } catch(e){}
}
const onCols = () => S.cols.filter(c => c.on);

/* ══════════════════════════════════════════════════════════════
   กรอง + เรียง (ฝั่งหน้าจอ · ลอตหนึ่งไม่เกินไม่กี่พันแถว พอไหว)
   ══════════════════════════════════════════════════════════════ */
function viewRows(){
  let rs = S.rows;
  /* กรองหยาบก่อน ตัดแถวออกได้เยอะสุด */
  if(S.view === 'todo')      rs = rs.filter(r => isPiece(r) && !isDone(r));
  else if(S.view === 'pack') rs = rs.filter(r => !isPiece(r));
  const fk = Object.keys(S.filters).filter(k => S.filters[k]);
  if(fk.length){
    rs = rs.filter(r => fk.every(k => {
      const raw = r[k];
      /* ช่องติ๊กพิมพ์กรองเป็นตัวเลขหรือคำก็ได้ · เทียบกับ True/False เหมือนไฟล์ export */
      const txt = TICKS.has(k) ? (raw === true || Number(raw) === 1 ? 'true 1' : 'false 0')
                               : String(raw == null ? '' : raw);
      return txt.toLowerCase().includes(S.filters[k].toLowerCase());
    }));
  }
  if(S.sort.k && S.sort.dir){
    const k = S.sort.k, d = S.sort.dir;
    rs = rs.slice().sort((a,b) => {
      const x = a[k], y = b[k];
      if(x == null && y == null) return 0;
      if(x == null) return 1;      /* ค่าว่างไปท้ายเสมอ ไม่ว่าจะเรียงทางไหน */
      if(y == null) return -1;
      const nx = Number(x), ny = Number(y);
      if(!isNaN(nx) && !isNaN(ny) && x !== '' && y !== '') return (nx - ny) * d;
      return String(x).localeCompare(String(y), 'th') * d;
    });
  }
  return rs;
}

/* ══════════════════════════════════════════════════════════════
   วาดหน้าจอ
   ══════════════════════════════════════════════════════════════ */
function render(){
  renderHead();
  renderNote();
  renderGrid();
  renderStatus();
}

/* ช่อง Name / หมวดงาน บนแถบเครื่องมือ · ล้อของโปรแกรม */
function renderHead(){
  const r0 = S.rows[0] || {};
  const name = r0.proj_name || (S.prog && S.prog.proj_name) || '';
  const cat  = r0.room_category || '';
  $('fName').textContent = name || '—';
  $('fName').className = 'ro' + (name ? '' : ' empty');
  $('fCat').textContent = cat || '—';
  $('fCat').className = 'ro' + (cat ? '' : ' empty');
  if(S.lot && $('q').value !== S.lot) $('q').value = S.lot;
}

function renderNote(){
  const el = $('note');
  if(!S.lot || !S.needReq){ el.style.display = 'none'; return; }
  $('noteTx').innerHTML =
    'ลอตนี้ยังไม่ได้ดึงรายชิ้นจาก AX · ที่เห็นอยู่คือเฉพาะชิ้นที่ยิงไปแล้ว (จาก ' +
    esc(S.table) + ') · StarSync กำลังไล่เติมให้ครบทุกลอตอยู่ อีกสักพักจะขึ้นเอง';
  el.style.display = 'flex';
}

/* จัดกลุ่มคอลัมน์ที่เปิดอยู่เป็นช่วง ๆ ตามแถบ band
   ทำแบบนี้แทนการ fix ช่วงไว้ เพราะผู้ใช้สลับลำดับคอลัมน์เองได้
   ถ้า fix ไว้แล้วเขาย้าย Shelf No ไปแทรกกลางช่องติ๊ก แถบจะคร่อมผิด */
function bandsOf(cols){
  const out = [];
  cols.forEach(c => {
    const b = TICKS.has(c.k) ? 'State' : '';
    const last = out[out.length - 1];
    if(last && last.name === b) last.span++;
    else out.push({ name:b, span:1 });
  });
  return out;
}

function renderGrid(){
  const mid = $('mid'), wrap = $('wrap');
  const show = (html) => { wrap.style.display='none'; mid.style.display='flex'; mid.innerHTML=html; };

  if(!S.url || !S.key)
    return show('<div class="big">⚙</div><div class="t">ยังไม่ได้ตั้งค่า Supabase</div>' +
      '<div class="s">ปกติหน้านี้หยิบค่าจากหน้าหลักให้เอง ถ้าเปิดไฟล์นี้ตรง ๆ ให้กดปุ่ม ⚙ มุมขวาบน</div>');
  if(S.err)
    return show('<div class="big">⚠</div><div class="t">ดึงข้อมูลไม่สำเร็จ</div>' +
      '<div class="s e">' + esc(S.err) + '</div>');
  if(S.busy)
    return show('<div class="spin"></div><div class="t">' + esc(S.busy) + '</div>');
  if(!S.lot)
    return show('<div class="big">▦</div><div class="t">เลือกลอตก่อน</div>' +
      '<div class="s">พิมพ์รหัส lot หรือชื่อโครงการในช่อง Lot Id ด้านบน · มีทั้งหมด <b>' +
      nf0.format(S.lots.length) + '</b> ลอต</div>');
  if(!S.rows.length)
    return show('<div class="big">▢</div><div class="t">ลอตนี้ยังไม่มีแถว</div>' +
      '<div class="s">รหัส <code>' + esc(S.lot) + '</code> ไม่มีทั้งใน lot_part และ check_part</div>');

  const cols = onCols();
  if(!cols.length)
    return show('<div class="big">▦</div><div class="t">ยังไม่ได้เปิดคอลัมน์ไหนเลย</div>' +
      '<div class="s">กดปุ่ม “คอลัมน์” แล้วติ๊กที่อยากเห็น</div>');

  mid.style.display = 'none'; wrap.style.display = 'block';
  const rs = viewRows();

  /* ── ชั้นที่ 1: แถบ band ── */
  let h = '<thead><tr class="band"><th class="idx"></th>';
  bandsOf(cols).forEach(b => {
    h += '<th colspan="' + b.span + '">' + esc(b.name || '\u00A0') + '</th>';
  });

  /* ── ชั้นที่ 2: ชื่อคอลัมน์ ── */
  h += '</tr><tr class="cols"><th class="idx"><div class="th-in num">#</div></th>';
  cols.forEach(c => {
    const ar  = S.sort.k === c.k ? (S.sort.dir === 1 ? '▲' : '▼') : '';
    const w   = c.w ? ' style="width:' + c.w + 'px"' : '';
    const cls = NUMS.has(c.k) ? ' num' : '';
    h += '<th' + w + '><div class="th-in' + cls + '" data-act="sort" data-k="' + esc(c.k) + '">' +
         '<span>' + esc(lbl(c.k)) + '</span><span class="th-s">' + ar + '</span>' +
         '<span class="rz" data-act="rz" data-k="' + esc(c.k) + '"></span></div></th>';
  });

  /* ── ชั้นที่ 3: แถวกรอง ── */
  h += '</tr><tr class="flt"><th class="idx"></th>';
  cols.forEach(c => {
    h += '<th><div class="fbox"><span class="fi">▼</span>' +
         '<input type="text" data-fk="' + esc(c.k) + '" value="' + esc(S.filters[c.k] || '') + '"></div></th>';
  });
  h += '</tr></thead><tbody>';

  rs.forEach((r, i) => {
    /* แถวห่อทำให้จางลงนิดหน่อย · ของจริงในโปรแกรมไม่ได้ทำ
       แต่นี่คือจุดที่คนอ่านผิดมาแล้ว ว่าทำไมมันไม่ติ๊กสักที */
    h += '<tr' + (isPiece(r) ? '' : ' class="pk"') + '><td class="idx">' + (i + 1) + '</td>';
    cols.forEach(c => h += cell(r, c.k));
    h += '</tr>';
  });
  h += '</tbody>';
  $('grid').innerHTML = h;
}

/* หนึ่งช่องในตาราง */
function cell(r, k){
  const v = r[k];

  if(TICKS.has(k)){
    /* lot_part เก็บเป็น boolean · check_part เก็บเป็น smallint 0/1 · รับทั้งสองแบบ */
    const y = v === true || Number(v) === 1;
    return '<td class="st"><span class="cbx' + (y ? '' : ' n') + '" title="' +
           (y ? 'ติ๊กแล้ว' : 'ยังไม่ติ๊ก') + '">✔</span></td>';
  }
  if(DATES.has(k))       return '<td class="mono">' + esc(fmtTime(v)) + '</td>';
  if(k === 'duration_sec')
    return '<td class="num" title="' + esc(v == null ? '' : v) + ' วินาที">' + esc(hms(v)) + '</td>';
  if(k === 'finish_length' || k === 'finish_width'){
    const n = Number(v);
    return '<td class="num">' + (v == null || isNaN(n) ? '' : nf2.format(n)) + '</td>';
  }
  if(NUMS.has(k)){
    const n = Number(v);
    return '<td class="num">' + (v == null || isNaN(n) ? esc(v) : nf0.format(n)) + '</td>';
  }
  /* ข้อความไทยห้ามใช้ฟอนต์ mono · ฟอนต์ไม่มีตัวอักษรไทย จะตกบรรทัดเพี้ยน */
  const cls = isTh(v) ? '' : ' class="mono"';
  return '<td' + cls + ' title="' + esc(v) + '">' + esc(v) + '</td>';
}

/* แถบสถานะล่าง · ล้อมุมล่างของโปรแกรมที่ขึ้น Total
   นับแยก "ชิ้นที่ต้องตัด" กับ "ห่ออุปกรณ์" เพราะห่อไม่มีวันถูกตัด
   ถ้าเอามารวมกัน ลอตที่ตัดครบแล้วจะค้างที่ 98% ตลอดไป */
function renderStatus(){
  if(!S.lot){ $('status').innerHTML = ''; return; }
  const rs    = viewRows();
  const full  = hasFull();
  const piece = S.rows.filter(isPiece);
  const pack  = S.rows.length - piece.length;
  const done  = stKey() ? piece.filter(isDone).length : piece.length;
  const todo  = piece.length - done;
  const pct   = piece.length ? Math.round(done / piece.length * 100) : 0;
  const nf    = Object.keys(S.filters).filter(k => S.filters[k]).length;

  const vb = (v, txt, n, cls) =>
    '<button class="btn' + (S.view === v ? ' on' : '') + '" data-act="view" data-v="' + v + '">' +
    esc(txt) + ' <span class="n' + (cls ? ' ' + cls : '') + '">' + nf0.format(n) + '</span></button>';

  let h = vb('all',  'ทั้งหมด',   S.rows.length, '') +
          vb('todo', 'ยังไม่ตัด', todo, 'bad') +
          (pack ? vb('pack', 'ห่ออุปกรณ์', pack, 'mu') : '');

  h += '<span style="margin-left:6px">ต้องตัด <span class="n">' + nf0.format(piece.length) +
       '</span> · ตัดแล้ว <span class="n">' + nf0.format(done) + '</span></span>' +
       '<div class="pbar"><i style="width:' + pct + '%"></i></div>' +
       '<span class="n">' + pct + '%</span>';

  if(pack) h += '<span style="color:var(--mu2)">ห่อ ' + nf0.format(pack) +
                ' แถวไม่นับ · ไม่มีขนาดจึงไม่ต้องตัด</span>';
  if(!full) h += '<span style="color:var(--warn)">ตารางนี้ไม่มีชิ้นที่ยังไม่ตัด</span>';
  if(nf)    h += '<span>กรอง ' + nf + ' คอลัมน์ <button class="btn" data-act="fltclear">ล้าง</button></span>';

  h += '<span class="tot">' + (rs.length !== S.rows.length
        ? '<span>แสดง <span class="n">' + nf0.format(rs.length) + '</span></span>' : '') +
       '<span>Total <span class="n">' + nf0.format(S.rows.length) + '</span></span></span>';
  $('status').innerHTML = h;
}

/* ══════════════════════════════════════════════════════════════
   รายการเลือกลอต
   ══════════════════════════════════════════════════════════════ */
function mark(text, q){
  const t = String(text || '');
  if(!q) return esc(t);
  const i = t.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return esc(t);
  return esc(t.slice(0,i)) + '<span class="hi">' + esc(t.slice(i, i+q.length)) + '</span>' +
         esc(t.slice(i+q.length));
}
/* ลอตนี้ตัดจบแล้วหรือยัง · ใช้ยอดจาก AX ไม่ใช่จำนวนแถวที่โหลดมา */
const isFinished = l => (l.total_parts > 0 && l.checked_parts >= l.total_parts);

function suggest(){
  const q = $('q').value.trim();
  let list = S.lots;
  /* ตัดจบแล้วไม่ได้แปลว่าจบงาน อาจยังไม่ส่งหรืออยู่ในคลัง ข้อมูลจึงยังเปิดดูได้
     แค่ซ่อนจากรายการ เพราะตอนไล่หาลอตที่ทำอยู่ มันเกะกะ */
  if(!S.showFin) list = list.filter(l => !isFinished(l));
  if(q){
    const lq = q.toLowerCase();
    list = list.filter(l => String(l.lot||'').toLowerCase().includes(lq) ||
                            String(l.proj_name||'').toLowerCase().includes(lq));
  }
  S.sugList = list.slice(0, 40);
  S.sugIdx  = -1;

  const hidden = S.showFin ? 0 : S.lots.filter(isFinished).length;
  let h = '<div class="sug-hd"><span>' + nf0.format(S.sugList.length) + ' ลอต</span>' +
          '<button class="btn" data-act="fin" style="margin-left:auto">' +
          (S.showFin ? '☑' : '☐') + ' รวมลอตที่ตัดจบแล้ว' +
          (hidden ? ' (' + nf0.format(hidden) + ')' : '') + '</button></div>';

  if(!S.sugList.length){
    h += '<div class="sug-i"><span class="sug-p">ไม่พบลอตที่ตรง</span></div>';
  } else {
    h += S.sugList.map((l, i) => {
      const fin = isFinished(l);
      const pct = l.total_parts > 0 ? Math.round(l.checked_parts / l.total_parts * 100) : 0;
      return '<div class="sug-i' + (fin ? ' fin' : '') + '" data-act="pick" data-i="' + i + '">' +
        '<span class="dot ' + (fin ? 'fin' : (pct > 0 ? 'go' : 'no')) + '"></span>' +
        '<span class="sug-l">' + mark(l.lot, q) + '</span>' +
        '<span class="sug-p">' + mark(l.proj_name || '', q) + '</span>' +
        '<span class="sug-n">' + nf0.format(l.checked_parts||0) + '/' +
          nf0.format(l.total_parts||0) + ' · ' + pct + '%</span></div>';
    }).join('');
  }
  $('sug').innerHTML = h;
  $('sug').classList.add('on'); S.sugOn = true;
}
function hideSug(){ $('sug').classList.remove('on'); S.sugOn = false; }
function highlightSug(){
  const items = [...$('sug').querySelectorAll('.sug-i')];
  items.forEach((n,i) => n.classList.toggle('a', i === S.sugIdx));
  if(items[S.sugIdx]) items[S.sugIdx].scrollIntoView({ block:'nearest' });
}

/* ══════════════════════════════════════════════════════════════
   โหลดข้อมูล
   ══════════════════════════════════════════════════════════════ */
async function boot(){
  loadCfg();
  if(!S.url || !S.key){ render(); return; }

  S.busy = 'กำลังอ่านโครงตาราง'; S.err = ''; render();
  try { S.schema = await db.schema(); }
  catch(e){
    S.schema = {};
    try {
      const one = await db.get('check_part?select=*&limit=1');
      if(one[0]) S.schema['check_part'] = Object.keys(one[0]);
      else throw new Error('check_part ยังไม่มีข้อมูลสักแถว จึงเดาคอลัมน์ไม่ได้');
    } catch(e2){ S.err = e2.message; render(); return; }
  }
  if(S.schema['lot_part'])        S.table = 'lot_part';
  else if(S.schema['check_part']) S.table = 'check_part';
  else { const f = Object.keys(S.schema)[0]; if(f) S.table = f; }
  fillTables();
  buildCols();

  S.busy = 'กำลังอ่านรายชื่อลอต'; render();
  try { S.lots = await db.lots(); } catch(e){ S.lots = []; }

  S.busy = ''; render();

  /* เปิดมาให้เจอข้อมูลจริงเลย ไม่ใช่จอเปล่า
     ลำดับ: ลอตใน URL > ลอตที่เปิดไว้ล่าสุด > ลอตที่ StarSync เพิ่งดึงมา */
  let want = new URLSearchParams(location.search).get('lot') ||
             localStorage.getItem('lp_last_lot') || '';
  if(!want && S.schema['lot_part']){
    try { want = await db.latestPartsLot(); } catch(e){}
  }
  if(want) selectLot(want);
}

function fillTables(){
  const names = Object.keys(S.schema).sort();
  $('tbl').innerHTML = names.map(n =>
    '<option value="' + esc(n) + '"' + (n === S.table ? ' selected' : '') + '>' +
    esc(n) + '</option>').join('');
}

async function selectLot(lot){
  S.lot = lot;
  $('q').value = lot;
  hideSug();
  try { localStorage.setItem('lp_last_lot', lot); } catch(e){}

  /* ชื่อแท็บและ URL เปลี่ยนตามลอต · เปิดหลายลอตพร้อมกันแล้วยังแยกออก
     replaceState ไม่ใช่ pushState ไม่งั้นทุกครั้งที่เปลี่ยนลอตจะกองในประวัติ
     จนกดปุ่ม back ออกจากหน้านี้ไม่ได้ */
  document.title = lot + ' · Ax Progress';
  try { history.replaceState(null, '', location.pathname + '?lot=' + encodeURIComponent(lot)); } catch(e){}

  S.prog = S.lots.find(l => l.lot === lot) || null;
  S.filters = {}; S.sort = { k:'', dir:0 }; S.view = 'all';
  S.busy = 'กำลังดึงรายชิ้นของลอต ' + lot; S.err = ''; S.rows = []; S.needReq = false;
  render();

  try {
    /* เลือกแหล่งข้อมูลเป็นราย lot ไม่ใช่เลือกทีเดียวตอนเปิดหน้า
       StarSync ทยอยเติม lot_part ทีละลอต บางลอตจึงยังไม่มี
       ถ้าตัดสินทีเดียวตอนเปิด ทั้งหน้าจะถอยไปใช้ check_part ทั้งที่ลอตอื่นใช้ได้ */
    if(!S.pin && S.schema['lot_part']){
      S.table = 'lot_part'; buildCols();
      S.rows = await db.rowsOfLot('lot_part', lot);
      if(!S.rows.length && S.schema['check_part']){
        S.table = 'check_part'; buildCols();
        S.rows = await db.rowsOfLot('check_part', lot);
        S.needReq = true;
      }
    } else {
      const hasLot = (S.schema[S.table] || []).includes('lot');
      S.rows = hasLot ? await db.rowsOfLot(S.table, lot) : await db.peek(S.table);
    }
  } catch(e){ S.err = e.message; }

  S.busy = '';
  fillTables();
  render();
}

/* ══════════════════════════════════════════════════════════════
   กล่องจัดคอลัมน์
   ══════════════════════════════════════════════════════════════ */
function renderColList(){
  $('pre').innerHTML = Object.keys(PRESETS).map(n =>
    '<button class="btn" data-act="preset" data-n="' + esc(n) + '">' + esc(n) + '</button>').join('') +
    '<button class="btn" data-act="preset" data-n="__all">ทั้งหมด</button>' +
    '<button class="btn" data-act="preset" data-n="__none">ไม่เอาเลย</button>';

  $('cl').innerHTML = S.cols.map((c, i) =>
    '<div class="cl-i' + (c.on ? '' : ' off') + '" draggable="true" data-i="' + i + '">' +
      '<span class="gp">⠿</span>' +
      '<input type="checkbox" data-act="coltog" data-i="' + i + '"' + (c.on ? ' checked' : '') + '>' +
      '<span class="cl-nm"><span class="a">' + esc(lbl(c.k)) + '</span> ' +
        '<span class="b">' + esc(c.k) + '</span></span>' +
      '<span class="mv"><button data-act="colup" data-i="' + i + '">▲</button>' +
      '<button data-act="coldn" data-i="' + i + '">▼</button></span></div>').join('');
}

function applyPreset(n){
  if(n === '__all')       S.cols.forEach(c => c.on = true);
  else if(n === '__none') S.cols.forEach(c => c.on = false);
  else {
    const want = PRESETS[n] || [];
    S.cols.forEach(c => c.on = want.includes(c.k));
    S.cols.sort((a,b) => {
      const ia = want.indexOf(a.k), ib = want.indexOf(b.k);
      if(ia < 0 && ib < 0) return 0;
      if(ia < 0) return 1;
      if(ib < 0) return -1;
      return ia - ib;
    });
  }
  saveCols(); renderColList(); render();
}

/* ══════════════════════════════════════════════════════════════
   ส่งออก CSV · ใส่ BOM ให้ Excel อ่านภาษาไทยออก
   ══════════════════════════════════════════════════════════════ */
function toCsv(){
  const cols = onCols();
  if(!cols.length) return;
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
  const lines = [cols.map(c => q(lbl(c.k))).join(',')];
  viewRows().forEach(r => lines.push(cols.map(c => {
    const v = r[c.k];
    if(DATES.has(c.k)) return q(fmtTime(v));
    /* ช่องติ๊กเขียน True/False ให้เหมือนไฟล์ export ของโปรแกรม
       จะได้เอาสองไฟล์มาวางเทียบกันได้ตรง ๆ */
    if(TICKS.has(c.k)) return q(v === true || Number(v) === 1 ? 'True' : 'False');
    return q(v);
  }).join(',')));
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'AxProgress_' + (S.lot || S.table).replace(/[^\w\-]/g,'_') + '_' +
               new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* ══════════════════════════════════════════════════════════════
   ปุ่มทุกตัวเดินผ่านจุดเดียว · ไม่ใส่ onclick กระจาย
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if(S.sugOn && !ev.target.closest('.lotw')) hideSug();
  if(!t) return;
  const act = t.dataset.act;

  if(act === 'drop'){ $('q').focus(); suggest(); return; }
  if(act === 'fin'){ ev.stopPropagation(); S.showFin = !S.showFin; suggest(); return; }
  if(act === 'pick'){ const l = S.sugList[+t.dataset.i]; if(l) selectLot(l.lot); return; }

  if(act === 'view'){ S.view = t.dataset.v; render(); return; }

  if(act === 'sort'){
    const k = t.dataset.k;
    if(S.sort.k !== k) S.sort = { k, dir:1 };
    else S.sort.dir = S.sort.dir === 1 ? -1 : (S.sort.dir === -1 ? 0 : 1);
    if(!S.sort.dir) S.sort.k = '';
    render(); return;
  }

  if(act === 'cols'){ renderColList(); $('ovCols').classList.add('open'); return; }
  if(act === 'colclose'){ $('ovCols').classList.remove('open'); return; }
  if(act === 'preset'){ applyPreset(t.dataset.n); return; }
  if(act === 'coltog'){ const c = S.cols[+t.dataset.i];
    if(c){ c.on = !c.on; saveCols(); renderColList(); render(); } return; }
  if(act === 'colup' || act === 'coldn'){
    const i = +t.dataset.i, j = act === 'colup' ? i-1 : i+1;
    if(j < 0 || j >= S.cols.length) return;
    [S.cols[i], S.cols[j]] = [S.cols[j], S.cols[i]];
    saveCols(); renderColList(); render(); return;
  }
  if(act === 'colreset'){
    try { localStorage.removeItem(colKey()); } catch(e){}
    buildCols(); renderColList(); render(); return;
  }

  if(act === 'csv'){ toCsv(); return; }
  if(act === 'reload'){ if(S.lot) selectLot(S.lot); else boot(); return; }
  if(act === 'fltclear'){ S.filters = {}; render(); return; }

  if(act === 'cfg'){ $('cfgUrl').value = S.url; $('cfgKey').value = S.key;
    $('ovCfg').classList.add('open'); return; }
  if(act === 'cfgclose'){ $('ovCfg').classList.remove('open'); return; }
  if(act === 'cfgsave'){
    try {
      localStorage.setItem('cc_supa_url', $('cfgUrl').value.trim().replace(/\/+$/,''));
      localStorage.setItem('cc_supa_key', $('cfgKey').value.trim());
    } catch(e){}
    $('ovCfg').classList.remove('open'); boot(); return;
  }
});

$('tbl').addEventListener('change', () => {
  S.table = $('tbl').value;
  S.pin = true;   /* เลือกเองแล้ว อย่าไปสลับให้อัตโนมัติอีก */
  buildCols();
  S.rows = []; S.filters = {}; S.sort = { k:'', dir:0 };
  if(S.lot) selectLot(S.lot); else render();
});

/* ช่องกรองรายคอลัมน์
   หน่วงก่อนวาดใหม่ แล้วคืนโฟกัสกับตำแหน่งเคอร์เซอร์ให้หลังวาดเสร็จ
   ไม่งั้นช่องที่กำลังพิมพ์อยู่จะโดนลบทิ้งทุกตัวอักษร */
let fltTimer = null;
document.addEventListener('input', ev => {
  const el = ev.target;
  if(el.id === 'q'){ suggest(); return; }
  if(!el.dataset || !el.dataset.fk) return;
  const k = el.dataset.fk, pos = el.selectionStart;
  S.filters[k] = el.value;
  clearTimeout(fltTimer);
  fltTimer = setTimeout(() => {
    render();
    const again = document.querySelector('[data-fk="' + CSS.escape(k) + '"]');
    if(again){ again.focus(); try { again.setSelectionRange(pos, pos); } catch(e){} }
  }, 220);
});

$('q').addEventListener('focus', suggest);
$('q').addEventListener('keydown', ev => {
  if(!S.sugOn) return;
  if(ev.key === 'ArrowDown'){ ev.preventDefault(); S.sugIdx = Math.min(S.sugIdx+1, S.sugList.length-1); highlightSug(); }
  else if(ev.key === 'ArrowUp'){ ev.preventDefault(); S.sugIdx = Math.max(S.sugIdx-1, 0); highlightSug(); }
  else if(ev.key === 'Enter'){
    ev.preventDefault();
    const l = S.sugList[S.sugIdx >= 0 ? S.sugIdx : 0];
    if(l) selectLot(l.lot);
    else if($('q').value.trim()) selectLot($('q').value.trim());   /* พิมพ์รหัสเองก็ได้ */
  }
  else if(ev.key === 'Escape') hideSug();
});
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape') ['ovCols','ovCfg'].forEach(id => $(id).classList.remove('open'));
});

/* ── ลากปรับความกว้างคอลัมน์ ────────────────────────────────── */
let rz = null;
document.addEventListener('mousedown', ev => {
  const h = ev.target.closest('[data-act="rz"]');
  if(!h) return;
  ev.preventDefault(); ev.stopPropagation();
  const th = h.closest('th');
  rz = { k:h.dataset.k, x:ev.clientX, w:th.getBoundingClientRect().width, th };
});
document.addEventListener('mousemove', ev => {
  if(!rz) return;
  rz.now = Math.max(40, Math.round(rz.w + ev.clientX - rz.x));
  rz.th.style.width = rz.now + 'px';
});
document.addEventListener('mouseup', () => {
  if(!rz) return;
  if(rz.now){ const c = S.cols.find(c => c.k === rz.k); if(c){ c.w = rz.now; saveCols(); } }
  rz = null;
});

/* ── ลากสลับลำดับในกล่องจัดคอลัมน์ ──────────────────────────── */
let dragI = -1;
$('cl').addEventListener('dragstart', ev => {
  const it = ev.target.closest('.cl-i'); if(!it) return;
  dragI = +it.dataset.i; it.classList.add('drag');
  ev.dataTransfer.effectAllowed = 'move';
});
$('cl').addEventListener('dragover', ev => {
  ev.preventDefault();
  const it = ev.target.closest('.cl-i'); if(!it) return;
  [...$('cl').children].forEach(n => n.classList.remove('over'));
  it.classList.add('over');
});
$('cl').addEventListener('drop', ev => {
  ev.preventDefault();
  const it = ev.target.closest('.cl-i'); if(!it || dragI < 0) return;
  const [m] = S.cols.splice(dragI, 1);
  S.cols.splice(+it.dataset.i, 0, m);
  dragI = -1; saveCols(); renderColList(); render();
});
$('cl').addEventListener('dragend', () => {
  dragI = -1;
  [...$('cl').children].forEach(n => n.classList.remove('drag','over'));
});

   จึงอ่าน cc_supa_url / cc_supa_key จาก localStorage ได้ตรง ๆ
   ══════════════════════════════════════════════════════════════ */
boot();
</script>
