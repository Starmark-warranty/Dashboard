                   ' value="' + esc(cur) + '"></th>';
          }
          /* ตัวเลือกสร้างจากแถวที่ผ่านตัวกรองอื่นทั้งหมด ยกเว้นตัวมันเอง
             จะได้ไม่เหลือตัวเลือกเดียวจนกลับไปเลือกอย่างอื่นไม่ได้ */
          const seen = new Map();
          dashFiltered(k).forEach(r => {
            const lb = dColLabel(r, k);
            if(lb && !seen.has(lb)) seen.set(lb, dColSort(r, k));
          });
          const opts = [...seen.keys()].sort((a,b) => {
            const x = seen.get(a), y = seen.get(b);
            return x < y ? -1 : x > y ? 1 : 0;
          });
          /* ค่าที่เลือกค้างอยู่ต้องมีในรายการเสมอ แม้ตัวกรองอื่นจะทำให้มันไม่เหลือแถว
             ไม่งั้นช่องจะเด้งกลับเป็น "ทั้งหมด" เอง แล้วผลบนจอไม่ตรงกับที่เห็นในช่อง */
          if(cur && opts.indexOf(cur) < 0) opts.unshift(cur);
          return '<th><select class="dcs" data-dcol="' + k + '">' +
            '<option value="">ทั้งหมด</option>' +
            opts.map(o => '<option value="' + esc(o) + '"' +
                          (o === cur ? ' selected' : '') + '>' + esc(o) + '</option>').join('') +
            '</select></th>';
        }).join('') +
        '<th></th><th></th><th></th>' +
      '</tr></thead><tbody>' +
      (shown.length ? shown.map(r => {
        const t = Number(r.total_all) || 0, c = cutOf(r);
        const p = t ? Math.round(c / t * 100) : 0;
        /* ป้ายติดทั้งตอนมีเลขและตอนไม่มี · ตอนไม่มีสำคัญกว่า
           เพราะต้องแยกให้ออกระหว่าง "ยังไม่ได้คิด" กับ "คิดแล้วแต่ยันไม่ได้" */
        const lvv = lvTx(r.amount_lv);
        const lv  = lvv ? '<span class="lvp ' + esc(r.amount_lv) + '" title="' +
                          esc(lvTip(r.amount_lv)) + '">' + esc(lvv) + '</span>' : '';
        return '<tr data-act="dlot" data-lot="' + esc(r.lot) + '">' +
          '<td class="mono">' + esc(r.lot) + '</td>' +
          '<td>' + esc(dayTh(r.end_date)) + '</td>' +
          '<td class="mono">' + esc(weekTx(r.end_date)) + '</td>' +
          '<td class="mono">' + esc(r.prod_pool || '') + '</td>' +
          '<td class="mono">' + esc(r.shelf || '') + '</td>' +
          '<td class="rm" title="' + esc(r.lot_remark || '') + '">' + esc(r.lot_remark || '') + '</td>' +
          '<td class="pd" title="' + esc(r.pd_remark || '') + '">' + esc(r.pd_remark || '') + '</td>' +
          '<td><div class="pgw' + (t && c >= t ? ' done' : '') + '">' +
            '<div class="pb"><i style="width:' + p + '%"></i></div>' +
            '<span class="pn">' + (t ? p + '%' : '—') + '</span></div></td>' +
          '<td class="num">' + (r.amount == null ? (lv || '—') : baht(r.amount) + ' ' + lv) + '</td>' +
          /* ปุ่มอยู่ในแถวเดียวกัน กดปุ่ม = ดูวัตถุดิบ กดที่อื่นในแถว = ไปดูรายชิ้น
             v5.0 ลอตที่มีวัตถุดิบอยู่แล้วขึ้นเขียวพร้อมจำนวน · ตัวที่ยังไม่มีขึ้นจาง
             จะได้กวาดตาเห็นทั้งตารางว่าอันไหนพร้อมดูเลย อันไหนต้องรอดึง */
          '<td>' + (function(){
            const n = d.rmHave[r.lot];
            return '<button class="rmbtn' + (n ? ' has' : '') + '" data-act="rmlot"' +
              ' data-lot="' + esc(r.lot) + '" title="' +
              (n ? 'มีวัตถุดิบ ' + n + ' รายการ กดเพื่อดู' : 'ยังไม่เคยดึง กดเพื่อสั่งดึงจาก AX') +
              '">▤ ' + (n ? '<span class="rn">' + n + '</span>' : 'ดึง') + '</button>';
          })() + '</td>' +
        '</tr>';
      }).join('') : '<tr><td colspan="10" style="color:var(--mu2)">ไม่มีลอตในเงื่อนไขนี้</td></tr>') +
      '</tbody></table></div></div>';
}

/* ป้ายความแม่นของตัวเลขเงิน · คนอ่านต้องรู้ว่าเลขนี้ยันได้แค่ไหน */
function lvTx(v){
  return v === 'room'      ? 'ตรงห้อง'
       : v === 'build'     ? 'ตรงตึก'
       : v === 'item'      ? 'ใบขายใบเดียว'
       : v === 'mixed'     ? 'ปนกัน'
       : v === 'ambiguous' ? 'ยันไม่ได้' : '';
}
function lvTip(v){
  return v === 'room'      ? 'จับคู่ใบขายได้ถึงระดับเลขห้อง แม่นที่สุด'
       : v === 'build'     ? 'จับคู่ได้ถึงระดับตึก ใบขายไม่ได้ระบุห้อง'
       : v === 'item'      ? 'ใบขายไม่มีสถานที่ให้ยัน แต่รหัสนี้มีใบขายใบเดียว จึงไม่มีทางหยิบผิดใบ'
       : v === 'mixed'     ? 'ลอตเดียวจับคู่ได้หลายระดับปนกัน'
       : v === 'ambiguous' ? 'รหัสสินค้าเป็นของมาตรฐานที่ขายทั้งโรงงาน และใบขายไม่มีสถานที่ให้ยัน ' +
                             'จึงไม่รู้ว่าใบไหนเป็นของลอตนี้ · เว้นว่างไว้ ดีกว่าใส่เลขที่ผิด' : '';
}

/* โหลดข้อมูลของแท็บนี้ · เรียกตอนกดเข้าครั้งแรกและตอนกดรีเฟรช */
async function loadDash(force){
  const d = S.dash;
  if(d.loaded && !force) return;
  if(!S.url || !S.key){ d.err = 'ยังไม่ได้ตั้งค่าการเชื่อมต่อ'; render(); return; }
  d.busy = 'กำลังอ่านข้อมูลภาพรวม'; d.err = ''; render();
  try {
    d.rows = await db.dashRows();
    d.loaded = true;
    /* ปุ่มวัตถุดิบต้องบอกได้ว่าลอตไหนมีของอยู่แล้ว · ล้มก็ไม่เป็นไร
       ปุ่มจะขึ้นเป็นแบบยังไม่มี ซึ่งกดแล้วก็ยังใช้งานได้ตามปกติ */
    try { (await db.rmHave()).forEach(x => { d.rmHave[x.lot] = x.n; }); } catch(e2){}
  } catch(e){
    d.err = 'อ่าน lot_progress ไม่สำเร็จ · ' + e.message;
  }
  d.busy = ''; render();
}

/* Export ของแท็บนี้ · เอาทุกแถวที่ผ่านตัวกรอง ไม่ได้ตัดที่ 300 เหมือนบนจอ */
function toCsvDash(){
  const rows = dashFiltered();
  if(!rows.length) return;
  const cols = ['lot','end_date','week','prod_pool','shelf','lot_remark','pd_remark','proj_name',
                'total_all','checked_all','checked_pack','checked_pick','checked_wh',
                'amount','amount_lv','amount_lines'];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
  const lines = [cols.map(c => q(c === 'week' ? 'สัปดาห์' : lbl(c))).join(',')];
  /* week ไม่ได้อยู่ในฐาน คิดจาก end_date ตอนส่งออก จะได้เอาไปกรองใน Excel ต่อได้ */
  rows.forEach(r => lines.push(cols.map(c =>
    q(c === 'week' ? weekTx(r.end_date) : r[c])).join(',')));
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'AxProgress_BI_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* ── วัตถุดิบจาก AX ────────────────────────────────────────────────
   lot_rm มีเฉพาะลอตที่เคยมีคนกดดู · ไม่มีแถว ≠ ไม่มีวัตถุดิบ
   แปลว่ายังไม่เคยดึง ซึ่งเป็นคนละเรื่องกัน หน้าจอต้องแยกให้ออก
   ไม่งั้นคนดูจะสรุปว่าลอตนี้ไม่ต้องเบิกอะไร แล้วไปยืนรอของที่ไม่มีใครสั่ง */
async function loadRm(lot, force){
  const R = S.rm;
  if(R.lot === lot && R.loaded && !force) return;
  R.lot = lot; R.rows = []; R.loaded = false; R.err = ''; R.busy = 'กำลังอ่านวัตถุดิบ';
  R.onhand = {}; R.onhandLoaded = false; R.onhandErr = ''; R.onhandAt = '';   /* v5.1 ยอดของลอตก่อนใช้กับลอตนี้ไม่ได้ */
  renderRm();
  try {
    R.rows = await db.rmRows(lot);
    R.loaded = true;
    /* v4.5 ไม่มีแถวได้สองความหมาย ต้องแยกให้ออกทุกครั้งที่เปิด ไม่ใช่แค่ตอนเพิ่งกดดึง
         ยังไม่เคยขอ      -> ไม่มีแถวในตารางคำขอ = ขึ้นปุ่มให้กดดึง
         ขอแล้ว AX ไม่มีให้ -> คำขอปิดแล้วแต่ได้ 0 แถว = ต้องบอกว่าไม่มีจริง ๆ
       ของเดิมดูจากตัวแปรในหน่วยความจำอย่างเดียว ปิดหน้าต่างแล้วเปิดใหม่
       ข้อความจะหายไป กลายเป็นชวนให้กดดึงซ้ำทั้งที่ดึงไปแล้วและไม่มีจริง */
    if(!R.rows.length){
      try {
        const st = await db.rmReqState(lot);
        if(st.length && st[0].done_at && !st[0].rows_synced){
          R.err = st[0].error || 'ลอตนี้ไม่มีรายการวัตถุดิบใน AX';
        }
      } catch(e){ /* อ่านสถานะคำขอไม่ได้ ก็ถือว่ายังไม่เคยดึง */ }
    }
  } catch(e){ R.err = 'อ่าน lot_rm ไม่สำเร็จ · ' + e.message; }
  R.busy = '';
  renderRm();
  if(R.rows.length){ void loadRmNames(); void loadRmOnhand(); }
}

/* ชื่อกับหน่วยมาจากคลังอุปกรณ์คนละโปรเจกต์ · ล้มก็ไม่เป็นไร
   ตารางยังใช้ได้ด้วยรหัสล้วน แค่บอกให้รู้ว่าชื่อหายเพราะอะไร */
async function loadRmNames(){
  const R = S.rm;
  const ids = [...new Set(R.rows.map(r => r.item_id).filter(Boolean))]
                .filter(id => !(id in R.names));
  if(!ids.length) return;
  try {
    const got = await db.fitNames(ids);
    ids.forEach(id => { R.names[id] = got[id] || null; });   /* null = ค้นแล้วไม่เจอ */
    R.nameErr = '';
  } catch(e){ R.nameErr = 'อ่านชื่อจากคลังอุปกรณ์ไม่ได้ · ' + e.message; }
  renderRm();
}

/* ยอดคงเหลือของลอตนี้ · v5.1
   ไม่กรองรหัสที่เคยอ่านแล้วออกเหมือน loadRmNames ตั้งใจ
   เพราะยอดขยับตลอด ของที่อ่านมาเมื่อสิบนาทีก่อนอาจไม่ใช่ของจริงแล้ว
   ล้มก็ไม่เป็นไร ตารางยังใช้ได้ครบทุกคอลัมน์เดิม แค่ไม่มีสามคอลัมน์ใหม่ */
async function loadRmOnhand(){
  const R = S.rm, lot = R.lot;
  const ids = [...new Set(R.rows.map(r => r.item_id).filter(Boolean))];
  if(!ids.length) return;
  try {
    const got = await db.fitOnhand(ids);
    if(S.rm.lot !== lot) return;          /* เปลี่ยนลอตระหว่างรอ ทิ้งผลไปเลย */
    R.onhand = got;
    /* เวลาที่ยอดถูกเขียนล่าสุด เอาตัวที่ใหม่ที่สุดในชุดนี้มาโชว์
       ทุกแถวที่ StarSync เขียนรอบเดียวกันจะมีเวลาเท่ากันอยู่แล้ว */
    R.onhandAt = Object.values(got).reduce(
      (mx, x) => (x.updated_at > mx ? x.updated_at : mx), '');
    R.onhandLoaded = true;
    R.onhandErr = '';
  } catch(e){ R.onhandErr = 'อ่านยอดคงเหลือไม่ได้ · ' + e.message; }
  renderRm();
}

/* สั่ง StarSync ไปดึงวัตถุดิบของลอตนี้ แล้วนั่งรอ
   กลไกเดียวกับ askForLot ทุกอย่าง รวมถึงการยอมแพ้ที่ 5 นาที */
async function askRm(){
  const R = S.rm, lot = R.lot;
  if(!lot || R.asking) return;
  R.asking = true; R.msg = 'ส่งคำขอแล้ว รอ StarSync มาเก็บไปทำ'; R.err = '';
  renderRm();
  try { await db.rmRequest(lot); }
  catch(e){
    R.asking = false; R.msg = '';
    R.err = 'ส่งคำขอไม่สำเร็จ · ' + e.message;
    renderRm(); return;
  }
  const t0 = Date.now();
  while(Date.now() - t0 < 300000){
    await new Promise(r => setTimeout(r, 5000));
    if(S.rm.lot !== lot){ R.asking = false; return; }   /* เปลี่ยนลอตระหว่างรอ ก็เลิกรอ */
    R.msg = 'กำลังรอ StarSync · ' + Math.round((Date.now() - t0) / 1000) + ' วินาที';
    renderRm();
    try {
      const st = await db.rmReqState(lot);
      if(st.length && st[0].done_at){
        R.asking = false; R.msg = '';
        /* ปิดคำขอแล้วแต่ไม่มีแถว = ลอตนี้ไม่มีวัตถุดิบใน AX จริง ๆ
           ต่างจาก "ยังไม่เคยดึง" · ข้อความจาก StarSync บอกเหตุผลไว้ให้แล้ว
           v4.5 ต้องเซ็ตหลัง loadRm ไม่ใช่ก่อน · loadRm ล้าง R.err ตอนเริ่มเสมอ
           ของเดิมข้อความจึงถูกลบทิ้งทุกครั้ง แล้วจอกลับไปขึ้นว่ายังไม่เคยดึง
           ซึ่งชวนให้กดซ้ำวนไปเรื่อย ๆ ทั้งที่ดึงแล้วและ AX ไม่มีให้ */
        const why = st[0].rows_synced ? '' : (st[0].error || 'ลอตนี้ไม่มีรายการวัตถุดิบใน AX');
        await loadRm(lot, true);
        if(why){ R.err = why; renderRm(); }
        return;
      }
    } catch(e){ /* เน็ตสะดุดระหว่างรอ ไม่ใช่เหตุให้เลิกรอ */ }
  }
  R.asking = false;
  R.msg = '';
  R.err = 'รอเกิน 5 นาทีแล้วยังไม่มา · StarSync อาจไม่ได้รันอยู่';
  renderRm();
}

/* v5.5 แผ่นที่ต้องตัด หรืออุปกรณ์
   ไม่ได้ดูจากคลังต้นทาง เพราะ RM01 มีทั้งแผ่นและของอื่นปนกัน
   เช่นรหัส 81019000 อยู่ RM01 เหมือนกันแต่เป็นเอจ ABS ไม่ใช่แผ่น
   ดูจากรูปรหัสแทน · สองตัวอักษร ตามด้วยสองตัวเลข และยาว 22 หรือ 25 ตัว
   ตรวจกับ lot_rm ทั้งตารางแล้ว เข้าเงื่อนไข 54 รหัส เป็น ME PE PB MD PW MV FJ
   ทั้งหมดมาจาก RM01 กับ PD01 ไม่มีของจาก RM02 หลุดเข้ามาสักตัว
   ถ้าวันหน้า AX เพิ่มรหัสแผ่นรูปแบบใหม่ มันจะไปโผล่ฝั่งอุปกรณ์ ไม่ได้หายไปไหน
   ซึ่งสังเกตเห็นได้ทันทีเพราะสองกลุ่มอยู่บนจอเดียวกัน */
function isBoardCode(id){
  const s = String(id || '');
  return /^[A-Z]{2}\d{2}/.test(s) && (s.length === 22 || s.length === 25);
}

function renderRm(){
  const box = $('rmBody'), R = S.rm;
  if(!R.lot){ box.innerHTML = '<div class="sub">ยังไม่ได้เลือกลอต</div>'; return; }

  /* ── ส่วนบน · ของจริงจาก AX ── */
  let ax;
  if(R.busy){
    ax = '<div class="sub"><span class="spin sm"></span> ' + esc(R.busy) + '</div>';
  } else if(R.asking){
    ax = '<div class="sub"><span class="spin sm"></span> ' + esc(R.msg) + '</div>';
  } else if(R.rows.length){
    const nf3 = v => (v == null ? '' : nf2.format(Number(v) || 0));
    const miss = R.rows.filter(r => (Number(r.bom_qty) || 0) > (Number(r.issue_qty) || 0)).length;
    const nm = id => (R.names[id] && R.names[id].product_name) || '';
    const un = r => r.unit || (R.names[r.item_id] && R.names[r.item_id].unit) || '';
    const got = R.rows.filter(r => nm(r.item_id)).length;
    /* v5.5 แยกสองกลุ่ม · เรียงลำดับเดิมภายในกลุ่ม ไม่ได้จัดเรียงใหม่
       คนที่ชินลำดับเดิมจะยังหาของเจอที่เดิมในกลุ่มของมัน */
    const boards = R.rows.filter(r => isBoardCode(r.item_id));
    const parts  = R.rows.filter(r => !isBoardCode(r.item_id));
    /* v5.1 นับรายการที่ของในคลังไม่พอกับที่ยังต้องเบิก
       นับเฉพาะตอนอ่านยอดมาได้แล้ว ไม่งั้นจะขึ้นว่าขาดทุกรายการตอนยังโหลดไม่เสร็จ */
    const ohReady = R.onhandLoaded;
    const short = !ohReady ? 0 : R.rows.filter(r => {
      const lf = (Number(r.bom_qty) || 0) - (Number(r.issue_qty) || 0);
      if(lf <= 0) return false;
      const o = R.onhand[r.item_id];
      return (o ? (Number(o.qty_avail) || 0) : 0) < lf;
    }).length;
    ax =
      '<div class="sub">' + nf0.format(R.rows.length) + ' รายการ · ' +
        (miss ? 'ยังเบิกไม่ครบ ' + nf0.format(miss) + ' รายการ' : 'เบิกครบทุกรายการแล้ว') +
        ' · ดึงเมื่อ ' + esc(fmtLocal(R.rows[0] && R.rows[0].synced_at)) +
        (R.nameErr ? ' · ' + esc(R.nameErr)
                   : (got < R.rows.length ? ' · ไม่พบชื่อในคลังอุปกรณ์ ' +
                      nf0.format(R.rows.length - got) + ' รหัส' : '')) +
        /* v5.1 บรรทัดยอดคลัง · แยกออกมาให้เห็นชัดว่าของไม่พอกี่รายการ
           และยอดที่ใช้ตัดสินนั้นถูกเขียนเมื่อไหร่ ไม่ใช่ของสด ณ วินาทีนี้ */
        (R.onhandErr
          ? '</div><div class="sub" style="color:var(--warn)">' + esc(R.onhandErr) +
            ' · สามคอลัมน์ขวาจึงยังไม่มีตัวเลข'
          : (ohReady
              ? '</div><div class="sub">' +
                (short ? '<b style="color:var(--bad)">ของในคลังไม่พอ ' + nf0.format(short) +
                         ' รายการ</b>' : '<b style="color:var(--ok)">ของในคลังพอทุกรายการ</b>') +
                ' · ยอดคลังอัปเดตเมื่อ ' + esc(fmtLocal(R.onhandAt))
              : '')) +
      '</div>' +
      '<div class="dwrap rmtab"><table class="dtab"><thead><tr>' +
        '<th>รหัส</th><th>ชื่อ</th><th style="text-align:right">ต้องใช้</th>' +
        '<th style="text-align:right">เบิกแล้ว</th><th style="text-align:right">ขาด</th>' +
        '<th style="text-align:right">ในคลัง</th><th style="text-align:right">ว่างอยู่</th>' +
        '<th style="text-align:right">พอไหม</th>' +
        '<th>หน่วย</th><th>คลัง</th><th>ต้องการ</th>' +
      '</tr></thead><tbody>' +
      /* v5.5 แบ่งเป็นสองกลุ่ม แผ่นก่อน อุปกรณ์ทีหลัง · แถวหน้าตาเหมือนเดิมทุกช่อง
         สร้างแถวด้วยฟังก์ชันตัวเดียวแล้วเรียกสองครั้ง ไม่ได้ก๊อปโค้ดสองชุด
         ถ้าแก้หน้าตาแถวทีหลัง จะได้ไม่ต้องจำว่ามีอีกที่หนึ่งที่ต้องแก้ตาม */
      (function(){
        const rowHtml = r => {
        const need = Number(r.bom_qty) || 0, iss = Number(r.issue_qty) || 0;
        const left = need - iss;
        /* v5.1 ยอดคงเหลือ · ไม่มีแถวในคลัง = ไม่มีของ ไม่ใช่ไม่รู้
           fitting_onhand เก็บเฉพาะรหัสที่เคยมีของ รหัสที่ไม่เคยมีจึงไม่มีแถว
           แสดงเป็น 0 สีจาง จะได้แยกออกจาก 0 ที่มาจากของหมดจริง */
        const oh   = R.onhand[r.item_id] || null;
        const have = oh ? (Number(oh.qty) || 0)       : 0;
        const free = oh ? (Number(oh.qty_avail) || 0) : 0;
        const dim  = oh ? '' : ' style="color:var(--mu2)"';
        /* พอไหม = ของว่าง ลบ ของที่ยังต้องเบิก
           เบิกครบแล้วไม่ต้องตอบ ไม่มีใครต้องไปหยิบอะไรอีก */
        const gap  = free - left;
        let ok;
        if(left <= 0)      ok = '<td class="num" style="color:var(--mu2)">—</td>';
        else if(gap >= 0)  ok = '<td class="num" style="color:var(--ok);font-weight:600">พอ</td>';
        else               ok = '<td class="num" style="color:var(--bad);font-weight:600">ขาด ' +
                                nf3(-gap) + '</td>';
        return '<tr>' +
          '<td class="mono">' + esc(r.item_id || '') + '</td>' +
          '<td class="nm" title="' + esc(nm(r.item_id)) + '">' +
            (nm(r.item_id) ? esc(nm(r.item_id))
                           : '<span style="color:var(--mu2)">ไม่พบในคลังอุปกรณ์</span>') + '</td>' +
          '<td class="num">' + nf3(need) + '</td>' +
          '<td class="num">' + nf3(iss) + '</td>' +
          '<td class="num"' + (left > 0 ? ' style="color:var(--bad);font-weight:600"' : '') + '>' +
            (left > 0 ? nf3(left) : '—') + '</td>' +
          '<td class="num"' + dim + '>' + nf3(have) + '</td>' +
          '<td class="num"' + dim + '>' + nf3(free) + '</td>' +
          ok +
          '<td class="mono">' + esc(un(r)) + '</td>' +
          '<td class="mono">' + esc([r.from_loc, r.to_loc].filter(Boolean).join(' → ')) + '</td>' +
          '<td>' + esc(dayTh(r.delivery_date)) + '</td>' +
        '</tr>';
        };

        /* สรุปของแต่ละกลุ่ม · ยังเบิกไม่ครบกี่รายการ และของในคลังไม่พอกี่รายการ
           ตอบคำถาม "แผ่นพร้อมตัดหรือยัง" กับ "ติดที่อุปกรณ์ตัวไหน" แยกกันคนละบรรทัด */
        const grpHead = (title, list) => {
          const noIssue = list.filter(r => (Number(r.bom_qty)||0) > (Number(r.issue_qty)||0)).length;
          const noStock = !ohReady ? -1 : list.filter(r => {
            const lf = (Number(r.bom_qty)||0) - (Number(r.issue_qty)||0);
            if(lf <= 0) return false;
            const o = R.onhand[r.item_id];
            return (o ? (Number(o.qty_avail) || 0) : 0) < lf;
          }).length;
          let tail;
          if(!noIssue)          tail = '<b style="color:var(--ok)">เบิกครบแล้ว</b>';
          else if(noStock < 0)  tail = 'ยังเบิกไม่ครบ ' + nf0.format(noIssue) + ' รายการ';
          else if(noStock === 0) tail = 'ยังเบิกไม่ครบ ' + nf0.format(noIssue) + ' รายการ · ' +
                                        '<b style="color:var(--ok)">ของในคลังพอทุกตัว</b>';
          else                  tail = 'ยังเบิกไม่ครบ ' + nf0.format(noIssue) + ' รายการ · ' +
                                       '<b style="color:var(--bad)">ของในคลังไม่พอ ' +
                                       nf0.format(noStock) + ' รายการ</b>';
          return '<tr class="rmgrp"><td colspan="11">' + esc(title) +
                 ' <span class="n">' + nf0.format(list.length) + ' รายการ</span>' +
                 ' <span class="s">' + tail + '</span></td></tr>';
        };

        let out = '';
        if(boards.length) out += grpHead('แผ่นที่ต้องตัด', boards) + boards.map(rowHtml).join('');
        if(parts.length)  out += grpHead('อุปกรณ์',        parts)  + parts.map(rowHtml).join('');
        return out;
      })() +
      '</tbody></table></div>' +
      '<div style="margin-top:8px"><button class="btn" data-act="rmask">⤓ ดึงใหม่จาก AX</button></div>';
  } else {
    ax = '<div class="sub">' +
         (R.err ? esc(R.err) + '<br>' : '') +
         'ยังไม่เคยดึงวัตถุดิบของลอตนี้จาก AX · ระบบดึงเฉพาะลอตที่มีคนกดดู ' +
         'เพื่อไม่ให้เก็บของที่ไม่มีใครใช้</div>' +
         '<div style="margin-top:8px"><button class="btn pri" data-act="rmask">⤓ ดึงจาก AX</button></div>';
  }

  box.innerHTML = ax;
}

/* เปิดหน้าต่างวัตถุดิบของลอตที่ระบุ
   v4.4 รับชื่อลอตเข้ามา ไม่ได้อ่านจาก S.lot อีกแล้ว
   เพราะเรียกจากตารางในแท็บ BI ซึ่งลอตนั้นยังไม่ได้เปิดดูรายชิ้น
   ถ้ายังผูกกับ S.lot จะเปิดของลอตที่ค้างอยู่ในแท็บรายชิ้นแทน ซึ่งผิดตัวเงียบ ๆ */
function openRm(lot){
  if(!lot) return;
  if(S.rm.lot !== lot){
    S.rm = { lot, rows:[], loaded:false, busy:'', err:'', asking:false, msg:'',
             names:S.rm.names, nameErr:'',   /* ชื่อที่ค้นมาแล้วใช้ต่อได้ ไม่ต้องถามคลังซ้ำ */
             onhand:{}, onhandLoaded:false, onhandErr:'', onhandAt:'' };   /* v5.1 ยอดต้องอ่านใหม่เสมอ */
  }
  $('rmLotTx').textContent = lot;
  $('ovRm').classList.add('open');
  renderRm();
  loadRm(lot, false);
}

/* ══════════════════════════════════════════════════════════════
   วาดหน้าจอ
   ══════════════════════════════════════════════════════════════ */
function render(){
  /* v4.0 สลับแท็บที่จุดเดียว · ตัววาดของอีกฝั่งไม่ต้องรู้ว่ามีแท็บอยู่
     ไม่วาดกริดตอนอยู่แท็บภาพรวม ลอตใหญ่สามพันแถววาดทิ้งเปล่า ๆ ทุกครั้งไม่ไหว */
  const app = $('app');
  if(app) app.dataset.tab = S.tab;
  $('viewParts').style.display = S.tab === 'parts' ? '' : 'none';
  $('viewDash').style.display  = S.tab === 'dash'  ? '' : 'none';
  $('tbParts').className = 'tb' + (S.tab === 'parts' ? ' on' : '');
  $('tbDash').className  = 'tb' + (S.tab === 'dash'  ? ' on' : '');

  /* v5.3 ป้ายสัปดาห์ · เขียนทุกครั้งที่วาดจอ ไม่ใช่ครั้งเดียวตอนเปิด
     เครื่องหน้าไลน์เปิดค้างข้ามคืน ถ้าเขียนครั้งเดียวจะค้างเป็นสัปดาห์เก่า */
  const wkEl = $('wkNow');
  if(wkEl){
    const mon = thisWeekKey();
    wkEl.innerHTML = '<span class="w">' + esc(weekTx(mon)) + '</span>' +
                     '<span class="d">' + esc(weekSpanTh(mon)) + '</span>';
  }

  renderHead();
  renderNote();
  if(S.tab === 'dash'){ renderDash(); return; }
  renderGrid();
  renderSide();
  renderStatus();
}

/* ช่อง Name / หมวดงาน บนแถบเครื่องมือ · ล้อของโปรแกรม */
function renderHead(){
  const r0 = S.rows[0] || {};
  const name = r0.proj_name || (S.prog && S.prog.proj_name) || '';
  const cat  = r0.room_category || '';
  $('fName').textContent = name || '—';
  $('fName').className = 'ro' + (name ? '' : ' empty');
  $('fCat').textContent = cat || '—';
  $('fCat').className = 'ro' + (cat ? '' : ' empty');
  const qb = $('q');
  qb.className = 'lotbtn' + (S.lot ? '' : ' empty');
  $('qtx').textContent = S.lot || 'เลือกลอต';

  /* v3.6 ป้ายบอกอายุของข้อมูล · ข้อความไทย ห้ามใส่ฟอนต์ mono
     เวลาเต็มไปอยู่ใน title แทน คนที่อยากรู้วินาทีก็ชี้เมาส์เอา
     v3.7 เป็นปุ่มแล้ว · กดสั่งดึงเดี๋ยวนั้นได้ ระหว่างดึงกดซ้ำไม่ได้
     เพราะคำขอใบเดิมถูก merge ทับอยู่แล้ว กดกี่ทีก็ได้ผลเท่ากัน */
  const sy = $('fSync');
  sy.className = 'ro' + (S.synced || S.asking ? '' : ' empty');
  sy.disabled  = !S.lot || S.asking;
  if(S.asking)      sy.innerHTML   = '<span class="spin sm"></span> กำลังดึง';
  else              sy.textContent = S.synced ? agoTx(S.synced) : '—';
  sy.title = S.asking ? 'กำลังรอ StarSync ดึงข้อมูลให้'
           : S.synced ? new Date(S.synced).toLocaleString('th-TH') + ' · กดเพื่อดึงใหม่เดี๋ยวนี้'
                      : 'กดเพื่อสั่งดึงของสดจาก AX ทันที';
}

function renderNote(){
  const el = $('note');
  /* v3.6 เดิมผูกกับ needReq อย่างเดียว แถบจึงเงียบสนิทเวลากดดึงลอตที่มีของอยู่แล้ว
     คนกดไม่รู้ว่ามันทำงานอยู่หรือกดไม่ติด · ให้โผล่ตอนกำลังดึงด้วย
     v3.7 แยกเป็นสามกรณี · ของเดิมมีสองทาง ข้อความ "รอเกิน 5 นาที
     StarSync อาจไม่ได้รันอยู่" จึงไม่มีวันโผล่ เพราะตอนนั้น asking เป็น false
     ไปแล้ว และลอตที่มีของอยู่ needReq ก็ false แถบเลยหายไปพร้อมข้อความ */
  if(!S.lot || (!S.needReq && !S.asking && !S.askMsg)){ el.style.display = 'none'; return; }
  let h;
  if(S.asking)
    h = '<span class="spin sm"></span> <b>กำลังดึงรายชิ้นของลอตนี้จาก AX</b> · ' + esc(S.askMsg);
  else if(S.needReq)
    h = '<b>ลอตนี้ยังไม่มีรายชิ้นใน lot_part</b> ' +
        '<button class="btn pri" data-act="ask" style="margin-left:8px">⤓ ดึงจาก AX</button>';
  else
    h = esc(S.askMsg);          /* ดึงไม่สำเร็จ แต่ของเดิมยังอยู่บนจอครบ */
  $('noteTx').innerHTML = h;
  el.style.display = 'flex';
}

/* จัดกลุ่มคอลัมน์ที่เปิดอยู่เป็นช่วง ๆ ตามแถบ band
   ทำแบบนี้แทนการ fix ช่วงไว้ เพราะผู้ใช้สลับลำดับคอลัมน์เองได้
   ถ้า fix ไว้แล้วเขาย้าย Shelf No ไปแทรกกลางช่องติ๊ก แถบจะคร่อมผิด */
function bandsOf(cols){
  const out = [];
  cols.forEach(c => {
    const b = TICKS.has(c.k) ? 'State' : '';
    const last = out[out.length - 1];
    if(last && last.name === b) last.span++;
    else out.push({ name:b, span:1 });
  });
  return out;
}

function renderGrid(){
  const mid = $('mid'), wrap = $('wrap');
  const show = (html) => { wrap.style.display='none'; mid.style.display='flex'; mid.innerHTML=html; };

  if(!S.url || !S.key)
    return show('<div class="big">⚙</div><div class="t">ยังไม่ได้ตั้งค่า Supabase</div>' +
      '<div class="s">ปกติหน้านี้หยิบค่าจากหน้าหลักให้เอง ถ้าเปิดไฟล์นี้ตรง ๆ ให้กดปุ่ม ⚙ มุมขวาบน</div>');
  if(S.err)
    return show('<div class="big">⚠</div><div class="t">ดึงข้อมูลไม่สำเร็จ</div>' +
      '<div class="s e">' + esc(S.err) + '</div>');
  if(S.busy)
    return show('<div class="spin"></div><div class="t">' + esc(S.busy) + '</div>');
  if(!S.lot)
    return show('<div class="big">▦</div><div class="t">เลือกลอตก่อน</div>' +
      '<div class="s">พิมพ์รหัส lot หรือชื่อโครงการในช่อง Lot Id ด้านบน · มีทั้งหมด <b>' +
      nf0.format(S.lots.length) + '</b> ลอต</div>');
  if(!S.rows.length){
    /* ไม่มีทั้งสองตารางจริง ๆ ถึงจะขึ้นจอเปล่า · ไม่บล็อกรอแบบ v3.0 */
    return show('<div class="big">▢</div><div class="t">ลอตนี้ยังไม่มีข้อมูลสักแถว</div>' +
      '<div class="s">รหัส <code>' + esc(S.lot) + '</code> ยังไม่มีรายชิ้นใน lot_part' +
      (S.asking ? '<br><br><span class="spin sm"></span> ' + esc(S.askMsg) : '') + '</div>' +
      (S.asking ? '' : '<div class="s"><button class="btn pri" data-act="ask">⤓ ดึงจาก AX</button></div>'));
  }

  const cols = onCols();
  if(!cols.length)
    return show('<div class="big">▦</div><div class="t">ยังไม่ได้เปิดคอลัมน์ไหนเลย</div>' +
      '<div class="s">กดปุ่ม “คอลัมน์” แล้วติ๊กที่อยากเห็น</div>');

  mid.style.display = 'none'; wrap.style.display = 'block';
  const rs = viewRows();

  /* ── ชั้นที่ 1: แถบ band ── */
  let h = '<thead><tr class="band"><th class="idx"></th>';
  bandsOf(cols).forEach(b => {
    h += '<th colspan="' + b.span + '">' + esc(b.name || '\u00A0') + '</th>';
  });

  /* ── ชั้นที่ 2: ชื่อคอลัมน์ ── */
  h += '</tr><tr class="cols"><th class="idx"><div class="th-in num">#</div></th>';
  cols.forEach(c => {
    const ar  = S.sort.k === c.k ? (S.sort.dir === 1 ? '▲' : '▼') : '';
    const w = ''; // Fit header and data instead of restoring old fixed widths.
    const cls = NUMS.has(c.k) ? ' num' : '';
    /* ช่องที่ยังไม่มีข้อมูลไฮไลต์ส้มพร้อมบอกเหตุผลตอนชี้เมาส์
       ไม่ซ่อนทิ้ง เพราะจุดประสงค์คือให้เห็นว่าขาดอะไรบ้าง */
    const bad = S.miss[c.k];
    h += '<th' + w + ' class="' + (TICKS.has(c.k) ? 'tick-col ' : '') + (bad ? 'miss' : '') + '"' + (bad ? ' title="' + esc(bad) + '"' : '') +
         '><div class="th-in' + cls + '" data-act="sort" data-k="' + esc(c.k) + '">' +
         (bad ? '<span class="mw">!</span>' : '') +
         '<span>' + esc(lbl(c.k)) + '</span><span class="th-s">' + ar + '</span>' +
         '<span class="rz" data-act="rz" data-k="' + esc(c.k) + '"></span></div></th>';
  });

  /* ── ชั้นที่ 3: แถวกรอง ── */
  h += '</tr><tr class="flt"><th class="idx"></th>';
  cols.forEach(c => {
    if(TICKS.has(c.k)){
      h += '<th class="tick-col"><select class="state-filter" title="— ทั้งหมด · ☑ ติ๊กแล้ว · ☐ ยังไม่ติ๊ก" data-state-filter="' + esc(c.k) + '" aria-label="กรอง ' + esc(lbl(c.k)) + '">' +
        [['','—'],['1','☑'],['0','☐']].map(([value,label]) =>
          '<option value="' + value + '"' + ((S.filters[c.k] || '') === value ? ' selected' : '') + '>' + label + '</option>').join('') + '</select></th>';
    }else{
      h += '<th><div class="fbox"><span class="fi">▼</span>' +
           '<input type="text" data-fk="' + esc(c.k) + '" value="' + esc(S.filters[c.k] || '') + '"></div></th>';
    }
  });
  h += '</tr></thead><tbody>';

  rs.forEach((r, i) => {
    /* v3.5 ไม่ใส่คลาสให้แถวแล้ว · คลาส pk เดิมชนกับ .pk ของหน้าต่างเลือกลอต
       ซึ่งเป็น display:grid 4 คอลัมน์ แถวห่อจึงกลายเป็นกริดแล้วช่องกระจาย
       ตัวมันเองก็เป็นคลาสตายตั้งแต่ 2.3 ที่เอาสีจางของแถวห่อออกไปแล้ว */
    h += '<tr><td class="idx">' + (i + 1) + '</td>';
    cols.forEach(c => h += (S.miss[c.k] ? '<td class="miss"></td>' : cell(r, c.k)));
    h += '</tr>';
  });
  h += '</tbody>';
  const grid = $('grid');
  grid.innerHTML = h;
  /* v3.9 ตัดครบเมื่อไหร่ คอลัมน์ Part เขียวทั้งคอลัมน์ · สัญญาณเดียวกับระบบเก่า
     ต้องมีชิ้นที่ต้องตัดจริงก่อน ลอตที่มีแต่ห่ออุปกรณ์อย่างเดียวไม่นับว่าครบ */
  const cs = partStats();
  grid.classList.toggle('cut', cs.total > 0 && cs.done >= cs.total);
  pinStateColumns();
}

/* หนึ่งช่องในตาราง */
function cell(r, k){
  const v = valOf(r, k);

  if(TICKS.has(k)){
    let y = v === true || Number(v) === 1;
    /* v3.9 ช่อง Part เดินตามกฎเดียวกับที่ใช้นับยอด ไม่ใช่ค่าดิบ
       ไม่งั้นแถบล่างขึ้น 882/882 แต่ในตารางยังมีช่องว่างให้เห็น ขัดกันเอง
       ช่องอื่นไม่มีกฎอะไร อ่านค่าดิบตามเดิม
       ติ๊กที่มาจากกฎบอกไว้ใน title · หน้าตาเหมือนกันตามระบบเก่า
       แต่ยังหาเจอได้จากป้าย "ไม่ได้ยิงตัด" ที่แถบล่าง */
    let tip = y ? 'ติ๊กแล้ว' : 'ยังไม่ติ๊ก';
    if(k === 'st_part' && !y && isOrphan(r)){
      y = true;
      tip = 'ยิง Pack แล้วแต่ไม่ได้ยิงตัด · ระบบถือว่าตัดแล้ว';
    }
    return '<td class="st' + (k === 'st_part' ? ' p' : '') + '">' +
           '<span class="cbx' + (y ? '' : ' n') + '" title="' + tip + '">✔</span></td>';
  }
  if(k === 'rec_id') return '<td class="mono">' + esc(v == null ? '' : String(v)) + '</td>';
  if(DATES.has(k))       return '<td class="mono">' + esc(fmtTime(v)) + '</td>';
  if(k === 'duration_sec')
    return '<td class="num" title="' + esc(v == null ? '' : v) + ' วินาที">' + esc(hms(v)) + '</td>';
  if(k === 'finish_length' || k === 'finish_width'){
    const n = Number(v);
    return '<td class="num">' + (v == null || isNaN(n) ? '' : nf2.format(n)) + '</td>';
  }
  if(NUMS.has(k)){
    const n = Number(v);
    return '<td class="num">' + (v == null || isNaN(n) ? esc(v) : nf0.format(n)) + '</td>';
  }
  /* ข้อความไทยห้ามใช้ฟอนต์ mono · ฟอนต์ไม่มีตัวอักษรไทย จะตกบรรทัดเพี้ยน */
  const cls = isTh(v) ? '' : ' class="mono"';
  return '<td' + cls + ' title="' + esc(v) + '">' + esc(v) + '</td>';
}

/* ══════════════════════════════════════════════════════════════
   แถบเกจสถานะทางขวา
   วาด SVG เอง ไม่ดึงไลบรารีกราฟเข้ามาเพื่อเส้นโค้งไม่กี่เส้น
   ══════════════════════════════════════════════════════════════ */

/* ช่องสถานะทั้ง 6 ในแถบ State ของโปรแกรม เรียงตามลำดับที่โปรแกรมเรียง
   piece = นับเฉพาะชิ้นที่ต้องตัดหรือนับทุกแถว
     Part นับเฉพาะชิ้นที่มีขนาด เพราะห่อไม่ต้องเข้าเครื่องตัด
     ที่เหลือนับทุกแถว เพราะห่อก็ต้องถูกแพ็ก หยิบ เข้าคลัง และส่งเหมือนกัน
     ยืนยันจากไฟล์ export จริง: ลอตที่ปิดงานแล้ว Pack/Pick/Wh/Delivery
     เป็น True ครบทั้ง 432 แถว รวมแถว Fitting_Pack กับ Accessory_Pack ด้วย */
const GAUGES = [
  { k:'st_part',     label:'Part',     piece:true  },
  { k:'st_pack',     label:'Pack',     piece:false },
  { k:'st_pick',     label:'Pick',     piece:false },
  { k:'st_wh',       label:'Wh',       piece:false },
  { k:'st_delivery', label:'Delivery', piece:false },
  { k:'st_site',     label:'Site',     piece:false }
];

/* วาดครึ่งวงกลมหนึ่งอัน · rad 30 กว้าง 74 สูง 42 */
function arcSvg(pct, dim){
  const LEN = Math.PI * 30;
  const on  = (LEN * pct / 100).toFixed(1);
  const col = dim ? 'var(--line)' : 'var(--brand)';
  return '<svg viewBox="0 0 74 42">' +
    '<path d="M 8 36 A 29 29 0 0 1 66 36" fill="none" stroke="var(--line)" ' +
      'stroke-width="7" stroke-linecap="round"></path>' +
    (dim ? '' :
    '<path d="M 8 36 A 29 29 0 0 1 66 36" fill="none" stroke="' + col + '" ' +
      'stroke-width="7" stroke-linecap="round" ' +
      'stroke-dasharray="' + on + ' ' + LEN.toFixed(1) + '"></path>') +
    '<text class="gv" x="37" y="34" text-anchor="middle">' +
      (dim ? '—' : pct + '%') + '</text></svg>';
}

function renderSide(){
  const el = $('side');
  if(!S.lot || !S.rows.length){ el.innerHTML = ''; return; }

  const cols  = S.schema[S.table] || [];
  const piece = S.rows.filter(isPiece);
  const pack  = S.rows.length - piece.length;

  let h = '<div class="sh">สถานะ</div>';
  GAUGES.filter(g => showState(g.k)).forEach(g => {
    /* ใช้คอลัมน์จริงถ้ามี ไม่มีก็ลองคอลัมน์สำรอง ไม่มีอีกก็ปล่อยว่างไว้
       ปล่อยว่างดีกว่าซ่อน เพราะคนจะได้รู้ว่าช่องนั้นมีอยู่แต่ยังไม่มีข้อมูล */
    const key = cols.includes(g.k) ? g.k : '';
    if(!key){
      h += '<div class="g na">' + arcSvg(0, true) +
           '<div class="gi"><div class="gl">' + esc(g.label) + '</div>' +
           '<div class="gn">ไม่มีในตารางนี้</div></div></div>';
      return;
    }
    /* Part ใช้ยอดกลางจาก partStats เพราะตัวหารอาจต้องยืมจาก AX
       ช่องอื่นมีเฉพาะใน lot_part ซึ่งมีครบทุกแถวอยู่แล้ว นับตรง ๆ ได้
       v3.9 Part ต้องผ่าน isDone ไม่ใช่อ่าน r[key] ดิบ
       ของเดิมอ่านดิบ พอ 3.9 ใส่กฎ "ยิง Pack = ถือว่าตัดแล้ว" เข้าไป
       เกจจะขึ้น 881 ส่วนแถบล่างขึ้น 882 ขัดกันเองบนจอเดียวกัน */
    const base = g.piece ? piece : S.rows;
    const yes  = g.k === 'st_part'
               ? base.filter(isDone).length
               : base.filter(r => { const v = r[key]; return v === true || Number(v) === 1; }).length;
    const tot  = base.length;
    const no   = Math.max(0, tot - yes);
    const pct  = tot ? Math.round(yes / tot * 100) : 0;
    h += '<div class="g">' + arcSvg(pct, false) +
         '<div class="gi"><div class="gl">' + esc(g.label) + '</div>' +
         '<div class="gn"><b>' + nf0.format(yes) + '</b> / ' + nf0.format(tot) +
         (no ? ' · เหลือ <i>' + nf0.format(no) + '</i>' : '') + '</div></div></div>';
  });

  /* สรุปว่าช่องไหนยังไม่มีข้อมูล · จุดนี้คือคำตอบว่าต้องไปแก้ sync ตรงไหน */
  const mk = AXCOLS.filter(k => S.miss[k]);
  if(mk.length){
    h += '<div class="mbox"><div class="mt">! ยังไม่มีข้อมูล ' + mk.length + ' ช่อง</div>' +
         '<div class="ml">' + mk.map(k =>
            '<span title="' + esc(S.miss[k]) + '">' + esc(lbl(k)) + '</span>').join('') + '</div>' +
         '<div class="mn">ต้องแก้ฝั่ง StarSync ให้ดึงคอลัมน์เหล่านี้มาด้วย</div></div>';
  }

  h += '<div class="foot">Part นับเฉพาะชิ้นที่มีขนาด' +
       (pack ? ' (ไม่รวมห่อ ' + nf0.format(pack) + ' แถว)' : '') +
       '<br>ช่องอื่นนับทุกแถวรวมห่อ</div>';
  el.innerHTML = h;
}

/* แถบสถานะล่าง · ล้อมุมล่างของโปรแกรมที่ขึ้น Total
   นับแยก "ชิ้นที่ต้องตัด" กับ "ห่ออุปกรณ์" เพราะห่อไม่มีวันถูกตัด
   ถ้าเอามารวมกัน ลอตที่ตัดครบแล้วจะค้างที่ 98% ตลอดไป */
function renderStatus(){
  if(!S.lot){ $('status').innerHTML = ''; return; }
  const rs    = viewRows();
  const st    = partStats();
  const pack  = S.rows.length - S.rows.filter(isPiece).length;
  const todo  = Math.max(0, st.total - st.done);
  const pct   = st.total ? Math.round(st.done / st.total * 100) : 0;
  const nf    = Object.keys(S.filters).filter(k => S.filters[k]).length;

  /* กรอง "ยังไม่ตัด" ได้เฉพาะตารางที่มีแถวของชิ้นที่ยังไม่ตัดจริง
     ตารางบันทึกการยิงไม่มีแถวพวกนั้น กดแล้วจะได้จอเปล่า */
  const vb = (v, txt, n, cls, dead) =>
    '<button class="btn' + (S.view === v ? ' on' : '') + '"' +
    (dead ? ' disabled title="ตารางนี้ไม่มีแถวของชิ้นที่ยังไม่ตัด"'
          : ' data-act="view" data-v="' + v + '"') + '>' +
    esc(txt) + ' <span class="n' + (cls ? ' ' + cls : '') + '">' +
    (n === null ? '—' : nf0.format(n)) + '</span></button>';

  let h = vb('all', 'ทั้งหมด', S.rows.length, '', false) +
          vb('todo', 'ยังไม่ตัด', todo, 'bad', false) +
          (pack ? vb('pack', 'ห่ออุปกรณ์', pack, 'mu', false) : '');

  /* v3.9 เปลี่ยนความหมาย · ไม่ใช่ของผิดปกติที่ต้องตามแล้ว
     เป็นตัวบอกว่ามีกี่ชิ้นที่ติ๊กมาจากกฎ ไม่ได้ยิงจริงที่หน้าเลื่อย
     ยอดตัดไม่เปลี่ยนตามป้ายนี้ เพราะนับรวมเป็นตัดแล้วไปแล้ว
     โผล่เฉพาะลอตที่มี · ลอตปกติไม่เห็นอะไรเพิ่ม */
  const orph = orphanCount();
  if(orph) h += vb('orph', 'ไม่ได้ยิงตัด', orph, 'warn', false);

  h += '<span style="margin-left:6px">ต้องตัด <span class="n">' +
       nf0.format(st.total) + '</span> · ตัดแล้ว <span class="n">' +
       nf0.format(st.done) + '</span></span>' +
       '<div class="pbar"><i style="width:' + pct + '%"></i></div>' +
       '<span class="n">' + pct + '%</span>';

  if(nf) h += '<span>กรอง ' + nf + ' คอลัมน์ <button class="btn" data-act="fltclear">ล้าง</button></span>';

  h += '<span class="tot">' + (rs.length !== S.rows.length
        ? '<span>แสดง <span class="n">' + nf0.format(rs.length) + '</span></span>' : '') +
       '<span>Total <span class="n">' + nf0.format(S.rows.length) + '</span></span></span>';
  $('status').innerHTML = h;
}

/* ══════════════════════════════════════════════════════════════
   หน้าต่างเลือกลอต · แบ่งตามสถานะ 3 คอลัมน์ + ช่องค้นหาอีกหนึ่ง
   ของเดิมเป็นรายการเดียวยาว ๆ ใต้ช่องพิมพ์ ซึ่งตอบไม่ได้ว่า
   "ตอนนี้มีลอตไหนกำลังตัดอยู่บ้าง" ต้องรู้ชื่อมาก่อนถึงจะหาเจอ
   แยกตามสถานะแล้วเปิดมาเห็นเลยว่าอะไรค้างอยู่ตรงไหน
   ══════════════════════════════════════════════════════════════ */
function mark(text, q){
  const t = String(text || '');
  if(!q) return esc(t);
  const i = t.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return esc(t);
  return esc(t.slice(0,i)) + '<span class="hi">' + esc(t.slice(i, i+q.length)) + '</span>' +
         esc(t.slice(i+q.length));
}

/* จัดลอตเข้ากลุ่มตามความคืบหน้าการตัด · ใช้ยอดจาก AX ไม่ใช่จำนวนแถวที่โหลด
   total_parts = ชิ้นที่ต้องตัดจริง ไม่รวมห่อ จึงเทียบตรงได้เลย */
/* Verify empty summaries using the same Part flags shown in the table.
   Keep these corrections in memory; never write aggregate data to Supabase. */
const pickerStats = new Map();

/* v3.7 เปิดลอตแล้วของเก่ากว่านี้ (นาที) = สั่งดึงจาก AX ให้เอง
   5 นาทีเพราะ StarSync วิ่งทุก 1 นาที และหน่วงต่อลอต 15 นาทีอยู่แล้ว
   ตั้งสั้นกว่านี้ก็แค่ยิงคำขอที่ StarSync จะทำอยู่แล้วซ้ำเปล่า ๆ */
const AUTO_ASK_MIN = 5;
/* จำว่าเปิดหน้ารอบนี้ขอลอตไหนไปแล้ว · กันคนไล่กดดูสิบลอตแล้วยิง AX สิบคำขอ
   อยู่นอก S เพราะไม่ใช่สถานะที่มีผลกับหน้าจอ ไม่ต้องวาดใหม่เวลาเปลี่ยน
   ที่เดียวกับ pickerStats ด้านบน */
const AUTO_ASK_MS = AUTO_ASK_MIN * 60000;
const askedLots = new Set();
function rememberPickerStats(lot, rows){
  if(!rows.length || rows.length >= 30000) return;
  const pieces = rows.filter(isPiece);
  const counted = pieces.length ? pieces : rows;
  pickerStats.set(lot, {
    total: counted.length,
    done: counted.filter(isDone).length
  });
}
function pickerCounts(l){
  return pickerStats.get(l.lot) || {
    total: Number(l.total_parts) || 0,
    done: Number(l.checked_parts) || 0
  };
}
async function verifyEmptyLotSummaries(){
  const lots = S.lots;
  for(const l of lots){
    if(S.lots !== lots) return;
    if(Number(l.total_parts) > 0 || pickerStats.has(l.lot)) continue;
    try {
      const rows = await db.rowsOfLot('lot_part', l.lot);
      if(S.lots !== lots) return;
      rememberPickerStats(l.lot, rows);
    } catch(e){ /* Keep original summary when verification is unavailable. */ }
  }
  if($('ovLot').classList.contains('open')) renderPicker();
}
function bucketOf(l){
  const counts = pickerCounts(l), t = counts.total, c = counts.done;
  if(t > 0 && c >= t) return 'fin';
  if(c > 0)           return 'wip';
  return 'todo';
}
const pctOf = l => { const n = pickerCounts(l); return n.total > 0 ? Math.min(100, Math.round(n.done / n.total * 100)) : 0; };

const BUCKETS = [
  { id:'todo', label:'ยังไม่ตัด',   cls:'todo' },
  { id:'wip',  label:'กำลังตัด',    cls:'wip'  },
  { id:'fin',  label:'ตัดจบแล้ว',   cls:'fin'  }
];
const PK_FIRST = 30;   /* โชว์กี่รายการแรกก่อนกด "ดูทั้งหมด" */

function lotItem(l, q, cur){
  const pct = pctOf(l);
  return '<div class="pc-i' + (l.lot === cur ? ' cur' : '') + '" data-act="pick" data-lot="' +
    esc(l.lot) + '">' +
    '<div class="l">' + mark(l.lot, q) + '</div>' +
    (l.proj_name ? '<div class="p">' + mark(l.proj_name, q) + '</div>' : '') +
    '<div class="m"><span class="bar"><i style="width:' + pct + '%"></i></span>' +
    nf0.format(pickerCounts(l).done) + '/' + nf0.format(pickerCounts(l).total) + ' · ' + pct + '%</div></div>';
}

function renderPicker(){
  const cur = S.lot;
  let h = '';

  BUCKETS.forEach(b => {
    const all = S.lots.filter(l => bucketOf(l) === b.id);
    const open = S.pkOpen === b.id;
    const show = open ? all : all.slice(0, PK_FIRST);
    h += '<div class="pc ' + b.cls + '"><div class="pc-h">' + esc(b.label) +
         '<span class="cnt">' + nf0.format(all.length) + '</span></div>' +
         '<div class="pc-l">' +
         (show.length ? show.map(l => lotItem(l, '', cur)).join('')
                      : '<div class="pc-e">ไม่มีลอตในกลุ่มนี้</div>') +
         '</div>';
    if(all.length > PK_FIRST)
      h += '<div class="pc-f"><button class="btn" data-act="pkmore" data-b="' + b.id + '">' +
           (open ? 'ย่อกลับ' : 'ดูทั้งหมด ' + nf0.format(all.length)) + '</button></div>';
    h += '</div>';
  });

  /* คอลัมน์ที่สี่ · ค้นหาเอง ครอบทุกสถานะ */
  const q = S.pq.trim();
  let res = [];
  if(q){
    const lq = q.toLowerCase();
    res = S.lots.filter(l => String(l.lot||'').toLowerCase().includes(lq) ||
                             String(l.proj_name||'').toLowerCase().includes(lq)).slice(0, 200);
  }
  h += '<div class="pc find"><div class="pc-h">ค้นหาเอง' +
       (q ? '<span class="cnt">' + nf0.format(res.length) + '</span>' : '') + '</div>' +
       '<div class="pc-s"><input type="text" id="pq" autocomplete="off" spellcheck="false" ' +
       'placeholder="พิมพ์รหัส lot หรือชื่อโครงการ" value="' + esc(S.pq) + '"></div>' +
       '<div class="pc-l">' +
       (!q ? '<div class="pc-e">พิมพ์เพื่อค้นจากทั้งหมด ' + nf0.format(S.lots.length) + ' ลอต</div>'
           : (res.length ? res.map(l => lotItem(l, q, cur)).join('')
                         : '<div class="pc-e">ไม่พบลอตที่ตรง</div>')) +
       '</div></div>';

  $('pk').innerHTML = h;
}

/* ══════════════════════════════════════════════════════════════
   โหลดข้อมูล
   ══════════════════════════════════════════════════════════════ */
async function boot(){
  /* v5.3 คืนแท็บที่เปิดค้างไว้ · ต้องทำก่อน render ครั้งแรก
     ไม่งั้นจอจะกะพริบไปแท็บรายชิ้นก่อนแล้วค่อยเด้งกลับ
     ลอตใน URL ชนะเสมอ เพราะคนส่งลิงก์มาให้ดูรายชิ้นของลอตนั้นโดยเฉพาะ */
  try {
    const t = localStorage.getItem('lp_tab');
    if((t === 'parts' || t === 'dash') &&
       !new URLSearchParams(location.search).get('lot')) S.tab = t;
  } catch(e){}

  loadCfg();
  if(!S.url || !S.key){ render(); return; }

  S.busy = 'กำลังอ่านโครงตาราง'; S.err = ''; render();
  try { S.schema = await db.schema(); }
  catch(e){ S.err = e.message; render(); return; }

  if(!S.schema['lot_part']){
    S.err = 'ไม่พบตาราง lot_part บน Supabase · หน้านี้อ่านจากตารางนั้นอย่างเดียว';
    render(); return;
  }
  S.table = 'lot_part';
  buildCols();

  S.busy = 'กำลังอ่านรายชื่อลอต'; render();
  pickerStats.clear();
  try { S.lots = await db.lots(); } catch(e){ S.lots = []; }
  void verifyEmptyLotSummaries();

  S.busy = ''; render();

  /* เปิดมาให้เจอข้อมูลจริงเลย ไม่ใช่จอเปล่า
     ลำดับ: ลอตใน URL > ลอตที่เปิดไว้ล่าสุด > ลอตที่ StarSync เพิ่งดึงมา */
  let want = new URLSearchParams(location.search).get('lot') ||
             localStorage.getItem('lp_last_lot') || '';
  if(!want && S.schema['lot_part']){
    try { want = await db.latestPartsLot(); } catch(e){}
  }
  if(want) selectLot(want);

  /* v5.3 เปิดมาค้างที่แท็บ BI ต้องโหลดข้อมูลให้เอง
     selectLot ข้างบนยังต้องทำ เพราะกดกลับไปแท็บรายชิ้นแล้วต้องมีของให้ดูทันที
     ไม่ใช่จอเปล่าที่ต้องไปเลือกลอตใหม่ทั้งที่เพิ่งดูอยู่เมื่อกี้ */
  if(S.tab === 'dash') loadDash(false);
}

async function selectLot(lot){
  S.lot = lot;
  closePicker();
  try { localStorage.setItem('lp_last_lot', lot); } catch(e){}

  /* ชื่อแท็บและ URL เปลี่ยนตามลอต · เปิดหลายลอตพร้อมกันแล้วยังแยกออก
     replaceState ไม่ใช่ pushState ไม่งั้นทุกครั้งที่เปลี่ยนลอตจะกองในประวัติ
     จนกดปุ่ม back ออกจากหน้านี้ไม่ได้ */
  document.title = lot + ' · Ax Progress';
  try { history.replaceState(null, '', location.pathname + '?lot=' + encodeURIComponent(lot)); } catch(e){}

  S.prog = S.lots.find(l => l.lot === lot) || null;
  S.filters = {}; S.sort = { k:'', dir:0 }; S.view = 'all';
  S.busy = 'กำลังดึงรายชิ้นของลอต ' + lot; S.err = ''; S.rows = []; S.needReq = false;
  S.asking = false; S.askMsg = ''; S.synced = 0;
  render();

  try {
    /* v3.3 อ่าน lot_part อย่างเดียว ไม่มีทางถอยไป check_part แล้ว
       check_part เป็นบันทึกการยิง มีแต่ชิ้นที่ยิงแล้ว ไม่มีสถานะอีก 5 ช่อง
       ไม่มีห่อ และไม่มีชิ้นที่ยังไม่ตัด · แทนกันไม่ได้ตั้งแต่แรก
       ทางถอยที่ผมเก็บไว้เพราะกลัวจอว่าง กลายเป็นต้นเหตุของทุกอาการที่เจอมา */
    S.table = 'lot_part';
    buildCols();
    S.rows = S.schema['lot_part'] ? await db.rowsOfLot('lot_part', lot) : [];
    rememberPickerStats(lot, S.rows);
    S.synced = maxSynced(S.rows);          /* v3.6 ของที่ดูอยู่ลอกมาจาก AX เมื่อไหร่ */
    if(!S.rows.length) S.needReq = true;
  } catch(e){ S.err = e.message; }

  S.busy = '';
  scanMissing();
  render();
  if(S.needReq) askForLot();
  else if(shouldAutoAsk(lot)) askForLot(true);   /* v3.7 โหมดเบื้องหลัง */
}

/* v3.7 ควรสั่งดึงให้เองไหมตอนเพิ่งเปิดลอตนี้
   ไม่ขอเมื่อ: อ่านไม่สำเร็จ · ลอตนี้ขอไปแล้วในรอบเปิดหน้านี้
   ลอตที่จอว่างไม่ผ่านทางนี้ ไปทาง needReq ซึ่งขอแบบไม่เงียบอยู่แล้ว
   ไม่รู้อายุ (ไม่มี synced_at สักแถว) ถือว่าเก่า ขอไว้ก่อนดีกว่าเดา */
function shouldAutoAsk(lot){
  if(S.err || !S.rows.length) return false;
  if(askedLots.has(lot)) return false;
  if(!S.synced) return true;
  return (Date.now() - S.synced) > AUTO_ASK_MS;
}

/* ── สั่งให้ StarSync ดึงรายชิ้นของลอตนี้ก่อนคิวปกติ ────────────
   หย่อนคำขอไว้ในตาราง lot_part_request แล้ว StarSync เก็บไปทำในรอบถัดไป
   ลอตที่มีคนขอไม่ผ่านการหน่วง 15 นาที เพราะมีคนนั่งรอดูอยู่หน้าจอ

   v3.7 quiet = โหมดเบื้องหลัง · หน้าเรียกเองตอนเปิดลอต ไม่ใช่คนกด
   ต่างกันตรงเวลาล้มเหลวเท่านั้น · โหมดนี้ห้ามแตะ S.err เด็ดขาด
   เพราะ renderGrid เจอ S.err เมื่อไหร่จะแทนที่ทั้งตารางด้วยจอ error
   เน็ตสะดุดครั้งเดียว ตาราง 882 แถวที่คนกำลังอ่านอยู่จะหายไปทั้งจอ
   ทั้งที่เขาไม่ได้สั่งอะไรเลย · ของที่มีอยู่ต้องอยู่ต่อเสมอ */
async function askForLot(quiet){
  const lot = S.lot;
  if(!lot || S.asking) return;
  askedLots.add(lot);        /* จดก่อนเริ่ม · ล้มเหลวก็ไม่วนขอซ้ำในรอบเปิดหน้านี้ */

  /* v3.6 เส้นตัดว่า "ของใหม่มาถึงหรือยัง" · จดเวลาซิงก์ของเดิมไว้ก่อนส่งคำขอ
     ของเดิมใช้ "มีแถวใน lot_part ไหม" ซึ่งจริงเฉพาะลอตที่จอว่าง
     ลอตที่มีของค้าง 882 แถว รอบตรวจแรกจะเห็นแถวเดิมแล้วสรุปว่าเสร็จทันที
     ทั้งที่ StarSync ยังไม่ได้เริ่มทำ · ลอตที่ว่างจริงเส้นตัดเป็น 0
     ค่าอะไรก็มากกว่า พฤติกรรมเดิมจึงไม่เปลี่ยน
     เทียบเวลาจากฐานข้อมูลกับเวลาจากฐานข้อมูลด้วยกัน นาฬิกาเครื่องคนใช้
     จะเดินเพี้ยนแค่ไหนก็ไม่เกี่ยว */
  const before = S.synced;

  S.asking = true;
  S.askMsg = quiet ? 'อัปเดตเบื้องหลัง · ของที่เห็นอยู่ใช้ได้ตามปกติ'
                   : 'ส่งคำขอแล้ว รอ StarSync มาเก็บไปทำ';
  render();
  try { await db.request(lot); }
  catch(e){
    S.asking = false;
    S.askMsg = quiet ? 'อัปเดตเบื้องหลังไม่สำเร็จ · ข้อมูลที่เห็นเป็นของเดิม' : '';
    if(!quiet) S.err = 'ส่งคำขอไม่สำเร็จ · ' + e.message;
    render(); return;
  }

  /* StarSync วิ่งทุก 1-3 นาที · ให้เวลา 5 นาทีแล้วยอมแพ้
     ถามทุก 5 วินาที ไม่ถี่กว่านี้เพราะไม่มีอะไรเปลี่ยนเร็วกว่านั้นอยู่แล้ว */
  const t0 = Date.now();
  while(Date.now() - t0 < 300000){
    await new Promise(r => setTimeout(r, 5000));
    if(S.lot !== lot){ S.asking = false; return; }   /* เปลี่ยนลอตระหว่างรอ ก็เลิกรอ */
    const sec = Math.round((Date.now() - t0) / 1000);
    S.askMsg = quiet ? 'อัปเดตเบื้องหลัง · ' + sec + ' วินาที'
                     : 'กำลังรอ StarSync ดึงข้อมูล · ' + sec + ' วินาที';
    render();
    try {
      /* ดูที่ lot_part ก่อน · ลอตนี้อาจมาจากรอบเติมอัตโนมัติ ไม่ใช่จากคำขอเรา
         ถ้าดูแต่ done_at ของคำขอ จะนั่งรอครบห้านาทีทั้งที่ข้อมูลมาถึงแล้ว
         v3.6 ต้อง nullslast · Postgres เรียง desc แล้วเอา null ขึ้นก่อน
         ถ้าลอตนั้นมีสักแถวที่ synced_at ว่าง จะได้ null มาตลอดแล้วรอไม่จบ */
      const got = await db.get('lot_part?select=synced_at&lot=eq.' +
                               encodeURIComponent(lot) +
                               '&order=synced_at.desc.nullslast&limit=1');
      if(got.length && parseUtc(got[0].synced_at) > before){
        S.asking = false; S.askMsg = ''; await selectLot(lot); return;
      }

      const q = await db.requestState(lot);
      if(q && q.done_at){
        S.asking = false; S.askMsg = '';
        if(q.rows_synced > 0){ await selectLot(lot); return; }
        /* AX ไม่มีชิ้นของลอตนี้ · ลอตที่จอว่างต้องบอกให้ชัด
           แต่ลอตที่มีของอยู่ห้ามล้างจอทิ้ง แค่บอกว่าอัปเดตไม่ได้ */
        if(quiet || S.rows.length) S.askMsg = 'AX ไม่มีชิ้นของลอตนี้ · ข้อมูลที่เห็นเป็นของเดิม';
        else S.err = 'AX ไม่มีชิ้นของลอตนี้ · ' + (q.error || '');
        render(); return;
      }
    } catch(e){ /* อ่านไม่ได้ก็รอรอบหน้า ไม่ต้องล้มทั้งกระบวนการ */ }
  }
  S.asking = false;
  S.askMsg = quiet ? 'อัปเดตเบื้องหลังไม่สำเร็จใน 5 นาที · StarSync อาจไม่ได้รันอยู่'
                   : 'รอเกิน 5 นาทีแล้วยังไม่มา · StarSync อาจไม่ได้รันอยู่';
  render();
}

/* ══════════════════════════════════════════════════════════════
   กล่องจัดคอลัมน์
   ══════════════════════════════════════════════════════════════ */
function renderColList(){
  /* บอกตรง ๆ ว่าชุดคอลัมน์ที่กดไปได้ไม่ครบเพราะอะไร
     กด "เหมือน Ax Progress" บนตาราง check_part แล้วได้แค่ 7 จาก 20 ช่อง
     ไม่ใช่เพราะชุดผิด แต่เพราะตารางนั้นไม่มีคอลัมน์ที่เหลืออยู่จริง
     ถ้าไม่บอก คนกดจะสรุปว่าโปรแกรมพัง */
  const all  = S.schema[S.table] || [];
  const want = PRESETS['เหมือน Ax Progress'] || [];
  const miss = want.filter(k => !all.includes(k)).length;
  /* บรรทัดเดียวพอ · ไม่ต้องไล่ชื่อคอลัมน์ให้อ่าน
     หน้าสั่งดึงข้อมูลให้เองอยู่แล้ว รอสักครู่ก็ครบ */
  const warn = miss
    ? '<div style="background:var(--warnbg);border:1px solid var(--warnbd);border-radius:8px;' +
      'padding:8px 11px;margin-bottom:11px;color:var(--warn)">ลอตนี้ยังดึงรายชิ้นไม่เสร็จ ' +
      'จึงติ๊กได้ไม่ครบ ' + miss + ' ช่อง · รอสักครู่แล้วกด ReLoad</div>'
    : '';
  $('pre').innerHTML = warn + Object.keys(PRESETS).map(n =>
    '<button class="btn" data-act="preset" data-n="' + esc(n) + '">' + esc(n) + '</button>').join('') +
    '<button class="btn" data-act="preset" data-n="__all">ทั้งหมด</button>' +
    '<button class="btn" data-act="preset" data-n="__none">ไม่เอาเลย</button>';

  $('cl').innerHTML = S.cols.map((c, i) =>
    '<div class="cl-i' + (c.on ? '' : ' off') + '" draggable="true" data-i="' + i + '">' +
      '<span class="gp">⠿</span>' +
      '<input type="checkbox" data-act="coltog" data-i="' + i + '"' + (c.on ? ' checked' : '') + '>' +
      '<span class="cl-nm"><span class="a">' + esc(lbl(c.k)) + '</span> ' +
        '<span class="b">' + esc(c.k) + '</span></span>' +
      '<span class="mv"><button data-act="colup" data-i="' + i + '">▲</button>' +
      '<button data-act="coldn" data-i="' + i + '">▼</button></span></div>').join('');
}

function applyPreset(n){
  if(n === '__all')       S.cols.forEach(c => c.on = true);
  else if(n === '__none') S.cols.forEach(c => c.on = false);
  else {
    const want = PRESETS[n] || [];
    S.cols.forEach(c => c.on = want.includes(c.k));
    S.cols.sort((a,b) => {
      const ia = want.indexOf(a.k), ib = want.indexOf(b.k);
      if(ia < 0 && ib < 0) return 0;
      if(ia < 0) return 1;
      if(ib < 0) return -1;
      return ia - ib;
    });
  }
  saveCols(); renderColList(); render();
}

/* ══════════════════════════════════════════════════════════════
   ส่งออก CSV · ใส่ BOM ให้ Excel อ่านภาษาไทยออก
   ══════════════════════════════════════════════════════════════ */
function toCsv(){
  const cols = onCols();
  if(!cols.length) return;
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
  const lines = [cols.map(c => q(lbl(c.k))).join(',')];
  viewRows().forEach(r => lines.push(cols.map(c => {
    const v = valOf(r, c.k);
    if(DATES.has(c.k)) return q(fmtTime(v));
    /* ช่องติ๊กเขียน True/False ให้เหมือนไฟล์ export ของโปรแกรม
       จะได้เอาสองไฟล์มาวางเทียบกันได้ตรง ๆ */
    if(TICKS.has(c.k)) return q(v === true || Number(v) === 1 ? 'True' : 'False');
    return q(v);
  }).join(',')));
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'AxProgress_' + (S.lot || S.table).replace(/[^\w\-]/g,'_') + '_' +
               new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* ══════════════════════════════════════════════════════════════
   ปุ่มทุกตัวเดินผ่านจุดเดียว · ไม่ใส่ onclick กระจาย
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act;

  /* ── v4.0 แท็บภาพรวม ── */
  if(act === 'tab'){
    const to = t.dataset.t;
    if(to === S.tab) return;
    S.tab = to;
    /* v5.3 จำไว้ว่าเปิดแท็บไหนค้างอยู่ · กด F5 แล้วกลับมาที่เดิม
       หน้าไลน์รีเฟรชบ่อยเพื่อดูของสด เด้งกลับไปแท็บแรกทุกครั้งน่ารำคาญ */
    try { localStorage.setItem('lp_tab', to); } catch(e){}
    render();
    if(to === 'dash') loadDash(false);
    return;
  }
  if(act === 'dmon'){  S.dash.mon  = (S.dash.mon  === t.dataset.k ? '' : t.dataset.k); render(); return; }
  if(act === 'dpool'){ S.dash.pool = (S.dash.pool === t.dataset.k ? '' : t.dataset.k); render(); return; }
  if(act === 'dwk'){   S.dash.wk   = (S.dash.wk   === t.dataset.k ? '' : t.dataset.k); render(); return; }
  if(act === 'dclrmon'){ S.dash.mon = ''; render(); return; }
  if(act === 'dclrwk'){  S.dash.wk  = ''; render(); return; }
  /* v5.2 ทางลัด · กดซ้ำเพื่อยกเลิก จะได้ไม่ต้องหาปุ่มปิดอีกปุ่ม
     สัปดาห์นี้กับเลยกำหนดใช้ร่วมกันได้ ไม่ได้ล้างกันเอง
     เพราะ "สัปดาห์นี้ที่เลยกำหนดแล้ว" เป็นคำถามที่มีจริง */
  if(act === 'dthiswk'){
    const k = thisWeekKey();
    S.dash.wk = (S.dash.wk === k ? '' : k);
    S.dash.mon = '';           /* เดือนที่ค้างอยู่อาจไม่คลุมสัปดาห์นี้ แล้วจอจะว่าง */
    render(); return;
  }
  if(act === 'dlate'){ S.dash.late = !S.dash.late; render(); return; }
  if(act === 'dclrcol'){ S.dash.col = {}; render(); return; }   /* v5.4 */
  if(act === 'dreload'){ loadDash(true); return; }
  if(act === 'dlot'){
    /* กดแถวในตารางภาพรวม = กระโดดไปดูรายชิ้นของลอตนั้น
       selectLot สั่งดึงจาก AX ให้เองอยู่แล้วถ้ายังไม่มีรายชิ้น */
    S.tab = 'parts';
    try { localStorage.setItem('lp_tab', 'parts'); } catch(e){}   /* v5.3 */
    render(); selectLot(t.dataset.lot); return;
  }

  if(act === 'drop'){ openPicker(); return; }
  if(act === 'pkclose'){ closePicker(); return; }
  if(act === 'pkmore'){ S.pkOpen = (S.pkOpen === t.dataset.b ? '' : t.dataset.b); renderPicker(); return; }
  if(act === 'pick'){ selectLot(t.dataset.lot); return; }

  if(act === 'view'){ S.view = t.dataset.v; render(); return; }
  if(act === 'ask'){ askForLot(); return; }

  if(act === 'sort'){
    const k = t.dataset.k;
    if(S.sort.k !== k) S.sort = { k, dir:1 };
    else S.sort.dir = S.sort.dir === 1 ? -1 : (S.sort.dir === -1 ? 0 : 1);
    if(!S.sort.dir) S.sort.k = '';
    render(); return;
  }

  if(act === 'cols'){ renderColList(); $('ovCols').classList.add('open'); return; }
  if(act === 'rm'){ openRm(S.lot); return; }
  /* v4.4 กดจากตารางในแท็บ BI · ปุ่มอยู่ในแถวที่มี data-act="dlot"
     closest() คืนตัวในสุดเสมอ ปุ่มจึงชนะแถว ไม่ต้องดัก stopPropagation */
  if(act === 'rmlot'){ openRm(t.dataset.lot); return; }
  if(act === 'rmask'){ askRm(); return; }
  if(act === 'rmclose'){ $('ovRm').classList.remove('open'); return; }
  if(act === 'colclose'){ $('ovCols').classList.remove('open'); return; }
  if(act === 'preset'){ applyPreset(t.dataset.n); return; }
  if(act === 'coltog'){ const c = S.cols[+t.dataset.i];
    if(c){ c.on = !c.on; saveCols(); renderColList(); render(); } return; }
  if(act === 'colup' || act === 'coldn'){
    const i = +t.dataset.i, j = act === 'colup' ? i-1 : i+1;
    if(j < 0 || j >= S.cols.length) return;
    [S.cols[i], S.cols[j]] = [S.cols[j], S.cols[i]];
    saveCols(); renderColList(); render(); return;
  }
  if(act === 'colreset'){
    try { localStorage.removeItem(colKey()); } catch(e){}
    buildCols(); renderColList(); render(); return;
  }

  if(act === 'csv'){ if(S.tab === 'dash') toCsvDash(); else toCsv(); return; }
  if(act === 'reload'){
    if(S.tab === 'dash'){ loadDash(true); return; }
    if(S.lot) selectLot(S.lot); else boot(); return;
  }
  if(act === 'fltclear'){ S.filters = {}; render(); return; }

  if(act === 'cfg'){ $('cfgUrl').value = S.url; $('cfgKey').value = S.key;
    $('ovCfg').classList.add('open'); return; }
  if(act === 'cfgclose'){ $('ovCfg').classList.remove('open'); return; }
  if(act === 'cfgsave'){
    try {
      localStorage.setItem('lp_smart_url', $('cfgUrl').value.trim().replace(/\/+$/,''));
      localStorage.setItem('lp_smart_key', $('cfgKey').value.trim());
    } catch(e){}
    $('ovCfg').classList.remove('open'); boot(); return;
  }
});


/* ช่องกรองรายคอลัมน์
   หน่วงก่อนวาดใหม่ แล้วคืนโฟกัสกับตำแหน่งเคอร์เซอร์ให้หลังวาดเสร็จ
   ไม่งั้นช่องที่กำลังพิมพ์อยู่จะโดนลบทิ้งทุกตัวอักษร */
document.addEventListener('change', ev => {
  /* v4.0 ช่องเลือกของแท็บภาพรวม · เปลี่ยนปีหรือสายผลิตแล้วเดือนที่กรองค้างอยู่
     อาจไม่มีอยู่จริงในชุดใหม่ ล้างทิ้งด้วย ไม่งั้นจอจะว่างโดยไม่รู้สาเหตุ */
  /* v5.5 ลูกศรของช่องกรองรายคอลัมน์ · เลือกแล้ววาดใหม่ทันที ไม่ต้องหน่วง
     ไม่มีเคอร์เซอร์ให้คืน ต่างจากช่องพิมพ์ซึ่งไปจัดการที่ตัวจับ input */
  const dcol = ev.target.dataset && ev.target.dataset.dcol;
  if(dcol && ev.target.tagName === 'SELECT'){
    if(!S.dash.col) S.dash.col = {};
    S.dash.col[dcol] = ev.target.value;
    render();
    return;
  }

  const dk = ev.target.dataset && ev.target.dataset.dsel;
  if(dk){
    S.dash[dk] = ev.target.value;
    if(dk === 'year'){ S.dash.mon = ''; S.dash.wk = ''; }
    render();
    return;
  }

  const k=ev.target.dataset && ev.target.dataset.stateFilter;
  if(!k) return;
  S.filters[k]=ev.target.value;
  const wrap=$('wrap'), x=wrap.scrollLeft, y=wrap.scrollTop;
  render();
  wrap.scrollLeft=x;wrap.scrollTop=y;
  const el=document.querySelector('[data-state-filter="'+CSS.escape(k)+'"]');
  if(el) el.focus({preventScroll:true});
});
let fltTimer = null;
document.addEventListener('input', ev => {
  const el = ev.target;

  /* v4.0 ช่องค้นหาของแท็บภาพรวม · บทเรียนเดียวกับสองช่องข้างล่าง
     renderDash() เขียน innerHTML ทั้งก้อน ช่องที่กำลังพิมพ์จะหายไปทุกตัวอักษร
     ต้องจดตำแหน่งเคอร์เซอร์ไว้ก่อนวาด แล้วคืนให้หลังวาดเสร็จ
     ใครมาแก้ส่วนนี้ อย่าทำให้กลไกนี้หาย */
  if(el.dataset && el.dataset.dsrch){
    const pos = el.selectionStart;
    S.dash.q = el.value;
    clearTimeout(fltTimer);
    fltTimer = setTimeout(() => {
      render();
      const again = document.querySelector('[data-dsrch]');
      if(again){ again.focus(); try { again.setSelectionRange(pos, pos); } catch(e){} }
    }, 220);
    return;
  }

  /* v5.4 ช่องกรองรายคอลัมน์ของตารางรายการลอต
     กลไกเดียวกับช่องค้นหาข้างบนเป๊ะ · renderDash() เขียน innerHTML ทั้งก้อน
     ช่องที่กำลังพิมพ์จะหายไปทุกตัวอักษรถ้าไม่จดตำแหน่งเคอร์เซอร์ไว้
     ต้องหาช่องเดิมด้วย data-dcol ไม่ใช่หยิบช่องแรกที่เจอ ไม่งั้นโฟกัสจะกระโดดข้ามคอลัมน์ */
  if(el.dataset && el.dataset.dcol && el.tagName === 'INPUT'){
    const k = el.dataset.dcol, pos = el.selectionStart;
    if(!S.dash.col) S.dash.col = {};
    S.dash.col[k] = el.value;
    clearTimeout(fltTimer);
    fltTimer = setTimeout(() => {
      render();
      const again = document.querySelector('[data-dcol="' + CSS.escape(k) + '"]');
      if(again){ again.focus(); try { again.setSelectionRange(pos, pos); } catch(e){} }
    }, 220);
    return;
  }

  /* วาดใหม่แล้วช่องที่พิมพ์อยู่จะหายไป ต้องคืนโฟกัสกับตำแหน่งเคอร์เซอร์ให้ */
  if(el.id === 'pq'){
    const pos = el.selectionStart;
    S.pq = el.value;
    renderPicker();
    const again = $('pq');
    if(again){ again.focus(); try { again.setSelectionRange(pos, pos); } catch(e){} }
    return;
  }
  if(!el.dataset || !el.dataset.fk) return;
  const k = el.dataset.fk, pos = el.selectionStart;
  S.filters[k] = el.value;
  clearTimeout(fltTimer);
  fltTimer = setTimeout(() => {
    render();
    const again = document.querySelector('[data-fk="' + CSS.escape(k) + '"]');
    if(again){ again.focus(); try { again.setSelectionRange(pos, pos); } catch(e){} }
  }, 220);
});

document.addEventListener('keydown', ev => {
  if(ev.key === 'Enter' && ev.target.id === 'pq'){
    const first = $('pk').querySelector('.pc.find .pc-i[data-lot]');
    if(first){ ev.preventDefault(); selectLot(first.dataset.lot); }
    return;
  }
  if(ev.key === 'Escape') ['ovCols','ovCfg','ovLot'].forEach(id => $(id).classList.remove('open'));
});

/* ── ลากปรับความกว้างคอลัมน์ ────────────────────────────────── */
let rz = null;
document.addEventListener('mousedown', ev => {
  const h = ev.target.closest('[data-act="rz"]');
  if(!h) return;
  ev.preventDefault(); ev.stopPropagation();
  const th = h.closest('th');
  rz = { k:h.dataset.k, x:ev.clientX, w:th.getBoundingClientRect().width, th };
});
document.addEventListener('mousemove', ev => {
  if(!rz) return;
  rz.now = Math.max(40, Math.round(rz.w + ev.clientX - rz.x));
  rz.th.style.width = rz.now + 'px';
  pinStateColumns();
});
document.addEventListener('mouseup', () => {
  if(!rz) return;
  if(rz.now){ const c = S.cols.find(c => c.k === rz.k); if(c){ c.w = rz.now; saveCols(); } }
  rz = null;
});

/* ── ลากสลับลำดับในกล่องจัดคอลัมน์ ──────────────────────────── */
let dragI = -1;
$('cl').addEventListener('dragstart', ev => {
  const it = ev.target.closest('.cl-i'); if(!it) return;
  dragI = +it.dataset.i; it.classList.add('drag');
  ev.dataTransfer.effectAllowed = 'move';
});
$('cl').addEventListener('dragover', ev => {
  ev.preventDefault();
  const it = ev.target.closest('.cl-i'); if(!it) return;
  [...$('cl').children].forEach(n => n.classList.remove('over'));
  it.classList.add('over');
});
$('cl').addEventListener('drop', ev => {
  ev.preventDefault();
  const it = ev.target.closest('.cl-i'); if(!it || dragI < 0) return;
  const [m] = S.cols.splice(dragI, 1);
  S.cols.splice(+it.dataset.i, 0, m);
  dragI = -1; saveCols(); renderColList(); render();
});
$('cl').addEventListener('dragend', () => {
  dragI = -1;
  [...$('cl').children].forEach(n => n.classList.remove('drag','over'));
});

/* ══════════════════════════════════════════════════════════════
   เริ่มทำงาน · หน้านี้เป็นแท็บของตัวเอง อยู่ origin เดียวกับหน้าหลัก
   จึงอ่าน lp_smart_url / lp_smart_key จาก localStorage ได้ตรง ๆ
   ══════════════════════════════════════════════════════════════ */
boot();
</script>
