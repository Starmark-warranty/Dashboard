  5.5  2026-09-11  FEAT ตารางวัตถุดิบแยก "แผ่นที่ต้องตัด" ออกจาก "อุปกรณ์"
                   ที่มา: เจ้าของงานอยากรู้ว่าแผ่นพร้อมตัดหรือยัง ติดแค่อุปกรณ์
                   ของเดิมสองอย่างปนกัน 49 บรรทัด ต้องไล่อ่านรหัสทีละตัว
                   · หัวกลุ่มบอกจำนวนรายการ ยังเบิกไม่ครบกี่ตัว
                     และของในคลังไม่พอกี่ตัว แยกกันคนละกลุ่ม
                     เห็นทีเดียวว่า "แผ่นเบิกครบแล้ว · อุปกรณ์ไม่พอ 3"
                   · ไม่ได้ดูจากคลังต้นทางเป็นตัวตัดสิน ทั้งที่ดูเผิน ๆ
                     เหมือน RM01 คือแผ่น RM02 คืออุปกรณ์ · ตรวจแล้วไม่จริง
                     รหัส 81019000 อยู่ RM01 เหมือนกันแต่เป็นเอจ ABS ไม่ใช่แผ่น
                   · ใช้รูปรหัสแทน · สองตัวอักษร ตามด้วยสองตัวเลข ยาว 22 หรือ 25
                     ตรวจกับ lot_rm ทั้งตารางแล้ว เข้าเงื่อนไข 54 รหัส
                     เป็น ME PE PB MD PW MV FJ ทั้งหมดมาจาก RM01 กับ PD01
                     ไม่มีของจาก RM02 หลุดเข้ามาสักตัว
                   NOTE ถ้าวันหน้า AX เพิ่มรหัสแผ่นรูปแบบใหม่ที่ไม่เข้าเงื่อนไข
                   มันจะไปโผล่ฝั่งอุปกรณ์ ไม่ได้หายไปไหน · สังเกตเห็นได้ทันที
                   เพราะสองกลุ่มอยู่บนจอเดียวกัน · ตั้งใจให้พลาดแบบเห็นได้
                   ดีกว่าพลาดแบบเงียบ
                   · เรียงลำดับเดิมภายในกลุ่ม ไม่ได้จัดเรียงใหม่
                     คนที่ชินลำดับเดิมยังหาของเจอที่เดิมในกลุ่มของมัน
                   · แถวสร้างจากฟังก์ชันตัวเดียวเรียกสองครั้ง ไม่ได้ก๊อปโค้ดสองชุด
                   ยังไม่ได้ทดสอบบนเครื่องจริงหน้าไลน์

  5.4  2026-09-11  FEAT กรองรายคอลัมน์ในตารางรายการลอต
                   ช่องกรองอยู่ใต้หัวตาราง เจ็ดคอลัมน์
                   ลอต · กำหนดเสร็จ · สัปดาห์ · สายผลิต · ชั้น · หมายเหตุสองช่อง
                   · เป็นแบบ "มีข้อความนี้อยู่ข้างใน" ไม่ใช่ตรงเป๊ะ
                     เพราะหมายเหตุเป็นประโยคยาว ตรงเป๊ะจะไม่มีวันเจอ
                   · ทุกช่องที่กรอกต้องผ่านหมด ไม่ใช่ผ่านช่องใดช่องหนึ่ง
                   · เทียบกับสิ่งที่ตาเห็นบนจอ ไม่ใช่ค่าดิบในฐาน
                     พิมพ์ "ก.ย." ต้องเจอ ทั้งที่ในฐานเก็บเป็น 2026-09-16
                     ช่องกำหนดเสร็จรับทั้งสองแบบ คนที่ชินเลขดิบก็พิมพ์ได้
                   · ไม่ทำช่องกรองให้คอลัมน์ตัดกับมูลค่า สองอันนั้นเป็นตัวเลข
                     กรองด้วยข้อความไม่ได้ความ · อยากกรองความคืบหน้า
                     ให้ใช้ช่องสถานะข้างบนซึ่งตรงกว่า
                   · ปุ่มล้างโผล่บนแถบกรองข้างบนเมื่อมีการกรองค้างอยู่
                     เพราะช่องกรองอยู่ในตารางซึ่งต้องเลื่อนลงไปถึงจะเห็น
                     กรองค้างแล้วเลื่อนขึ้นมา จะงงว่าทำไมลอตหายไปหมด
                   · ตัวกรองอยู่ในเส้นทางเดียวกับ KPI กราฟ และ Export
                     กรองแล้วกด Export ได้เฉพาะที่กรอง ไม่ใช่ทั้งหมด
                   NOTE กลไกคืนตำแหน่งเคอร์เซอร์ · renderDash เขียน innerHTML
                   ทั้งก้อน ช่องที่กำลังพิมพ์จะหายไปทุกตัวอักษรถ้าไม่จดไว้ก่อน
                   และต้องหาช่องเดิมด้วย data-dcol ไม่ใช่หยิบช่องแรกที่เจอ
                   ไม่งั้นโฟกัสจะกระโดดข้ามคอลัมน์ · ใครมาแก้ อย่าทำให้กลไกนี้หาย
                   ยังไม่ได้ทดสอบบนเครื่องจริงหน้าไลน์

  5.3  2026-09-11  FEAT ป้ายสัปดาห์ปัจจุบันมุมขวาของแถบเครื่องมือ
                   เห็นจากทุกแท็บ · W37 ตัวใหญ่ ตามด้วยช่วงวันจันทร์ถึงอาทิตย์
                   หน้างานเรียกงานกันด้วยเลขสัปดาห์อยู่แล้ว แต่ต้องเปิดปฏิทิน
                   มาเทียบเองว่าตอนนี้สัปดาห์ที่เท่าไหร่
                   · วางไว้ท้ายสุดของแถบแล้วดันขวาด้วย margin-left:auto
                     ถ้าวางไว้กลางแถบ มันจะดันของที่อยู่หลังมันไปทางขวาทั้งพวง
                   · เขียนใหม่ทุกครั้งที่วาดจอ ไม่ใช่ครั้งเดียวตอนเปิด
                     เครื่องหน้าไลน์เปิดค้างข้ามคืน เขียนครั้งเดียวจะค้างสัปดาห์เก่า
                   · เลขสัปดาห์เป็น mono · ช่วงวันที่มีชื่อเดือนไทยจึงเป็น sans
                     จอแคบกว่า 640px ซ่อนช่วงวันที่ เหลือแต่เลขสัปดาห์
                   FEAT กด F5 แล้วค้างอยู่แท็บเดิม
                   หน้าไลน์รีเฟรชบ่อยเพื่อดูของสด ของเดิมเด้งกลับแท็บรายชิ้นทุกครั้ง
                   · จำที่ localStorage คีย์ lp_tab · คืนค่าก่อน render ครั้งแรก
                     ไม่งั้นจอจะกะพริบไปแท็บรายชิ้นก่อนแล้วค่อยเด้งกลับ
                   · ลอตใน URL ชนะเสมอ เพราะคนส่งลิงก์มาให้ดูรายชิ้นของลอตนั้น
                     โดยเฉพาะ การเด้งไปแท็บ BI แทนคือการไม่ทำตามที่เขาส่งมา

                     กดกลับไปแท็บรายชิ้นแล้วต้องมีของให้ดูทันที ไม่ใช่จอเปล่า
                   ยังไม่ได้ทดสอบบนเครื่องจริงหน้าไลน์

  5.2  2026-09-11  FEAT สรุปตามสัปดาห์ · ตอบว่าสัปดาห์นี้เหลือลอตไหนยังไม่จบ
                   ที่มา: เจ้าของงานถามตรง ๆ ว่าอยากรู้ว่าสัปดาห์นี้เหลืออะไร
                   และอะไรเลยกำหนดแล้ว · ของเดิมต้องไปไล่กดแท่งกราฟเอง

                     เหตุผลเดียวกับที่รายการในช่องกรองสร้างจาก all ไม่ใช่ rows

  5.1  2026-09-11  FEAT ตารางวัตถุดิบบอกได้แล้วว่าของในคลังพอไหม
                   เดิมบอกได้แค่ว่าลอตนี้ยังเบิกไม่ครบเท่าไหร่ แต่ไม่บอกว่า
                   ของที่ยังไม่ได้เบิกนั้น "มีให้เบิกหรือเปล่า" ซึ่งเป็นคำถาม
                   ที่หน้าไลน์ถามจริง · ต้องเดินไปดูของเองหรือโทรถามคลัง
                   · เพิ่มสามคอลัมน์ ในคลัง / ว่างอยู่ / พอไหม
                     อ่านจากตาราง fitting_onhand ของ StarNexus โปรเจกต์เดียว
                     กับที่อ่านชื่ออยู่แล้ว · ต่อด้วย item_number ตรง ๆ
                   · ยอดคงเหลือมาจาก AX INVENTSUM ผ่าน StarSync รอบละ 10 นาที
                     เวลาที่ยอดถูกเขียนล่าสุดขึ้นบนหัวตาราง จะได้รู้ว่าเก่าแค่ไหน
                   NOTE "ว่างอยู่" คือ AVAILPHYSICAL หักของที่ถูกจองแล้ว
                   ตรวจกับ AX แล้วว่าใบสั่งผลิตที่นี่ไม่ได้จองของ (ทั้งระบบมี
                   แค่ 3 แถว) ความต้องการของใบสั่งผลิตไปกองที่สถานะ 6
                   ซึ่งไม่ตัดยอดว่าง · ตัวเลขนี้จึงใช้กับลอตได้ตรง ๆ
                   ไม่ต้องบวกของที่จองไว้ให้ลอตนี้กลับเข้าไป
                   NOTE รหัสที่ไม่มีแถวใน fitting_onhand = ไม่มีของในคลัง
                   เพราะตารางนั้นเก็บเฉพาะรหัสที่เคยมีของ · แสดงเป็น 0 สีจาง
                   · ยอดไม่แคชข้ามลอต อ่านใหม่ทุกครั้งที่เปิด เพราะของขยับตลอด
                     ต่างจากชื่ออุปกรณ์ที่เก็บไว้ใช้ซ้ำได้เพราะไม่มีวันเปลี่ยน
                   FIX  "ดึงเมื่อ" ในหน้าต่างวัตถุดิบช้ากว่าเวลาจริง 7 ชั่วโมง
                   synced_at เป็น timestamptz ที่ PostgREST คืนมาเป็น UTC
                   แต่ fmtTime ตัดสตริงดิบ ไม่ได้แปลงโซน จอจึงขึ้น 02:17
                   ทั้งที่ StarSync เขียนตอน 09:17 · เห็นชัดขึ้นเพราะ 5.1
                   เอาเวลายอดคลังมาวางข้าง ๆ ถ้าอันหนึ่งเป็นไทยอันหนึ่งเป็น UTC
                   คนดูจะสรุปว่าข้อมูลค้างมาครึ่งวัน แล้วเลิกเชื่อทั้งหน้าต่าง
                   · เปลี่ยนเฉพาะจุดนี้จุดเดียว ไม่ได้แก้ตัวแสดงผลกลางของตาราง
                     ที่รวม part_date ไว้ด้วย เพราะ part_date เป็นเวลาท้องถิ่น
                     อยู่แล้ว (ตามที่ 3.6 เขียนไว้) แปลงซ้ำจะบวกไปอีก 7 ชั่วโมง
                   NOTE ตรวจกับฐานจริงแล้ว lot_rm มีคอลัมน์ item_name กับ
                   reserved อยู่ แต่ item_name ว่างทั้ง 578 แถว จึงยังต้อง
                   อ่านชื่อจากคลังอุปกรณ์เหมือนเดิม · reserved เป็น false
                   ทั้ง 578 แถว ตรงกับที่ตรวจฝั่ง AX ว่าใบสั่งผลิตไม่จองของ
                   ยังไม่ได้ทดสอบบนเครื่องจริงหน้าไลน์

<style>
/* ── ชุดสีธีม TailAdmin ─ ห้ามใส่ค่าสีดิบนอกบล็อกนี้ ────────────── */
:root{
  --pg:#f9fafb;            /* พื้นหลังหน้า */
  --card:#ffffff;
  --line:#e4e7ec;          /* เส้นขอบ */
  --line2:#f2f4f7;         /* เส้นตารางบาง */
  --hd:#f9fafb;            /* หัวตาราง */
  --band:#f2f4f7;          /* แถบ band */
  --flt:#fcfcfd;           /* แถวกรอง */
  --row:#ffffff;
  --row2:#fcfcfd;
  --hov:#f4f6ff;
  --stbg:#ecfdf3;          /* พื้นคอลัมน์ State */
  --stbg2:#e2f8ec;
  --tx:#101828;
  --mu:#667085;
  --mu2:#98a2b3;
  --brand:#465fff;
  --brand2:#3641f5;
  --brandbg:#ecf3ff;
  --ok:#12b76a;
  --bad:#f04438;
  --warn:#b54708;
  --warnbg:#fffaeb;
  --warnbd:#fedf89;
  --sh:0 1px 2px rgba(16,24,40,.05);
  --sh2:0 8px 24px rgba(16,24,40,.12);
  --r:12px;
  --mono:'IBM Plex Mono','Consolas','Courier New',monospace;
  --sans:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--pg);color:var(--tx);font-size:13px;
  overflow:hidden;-webkit-font-smoothing:antialiased}
#app{height:100%;display:flex;flex-direction:column;padding:8px;gap:8px}

/* พื้นที่หลัก · ตารางซ้าย แถบเกจขวา เต็มความสูงทั้งคู่ */
/* v3.5 ใช้ grid ไม่ใช้ flex สำหรับพื้นที่หลัก
   flex item มี min-width:auto เป็นค่าเริ่มต้น = ไม่ยอมแคบกว่าเนื้อหา
   ตารางกว้าง 34 คอลัมน์จึงดันการ์ดทะลุจอ · 3.4 ปะด้วย min-width:0 แล้วยังไม่หาย
   grid ที่ตั้ง minmax(0,1fr) การันตีว่าคอลัมน์ซ้ายแคบลงได้เสมอ
   ไม่ต้องพึ่ง min-width:0 ให้พลาดอีก */
.main{flex:1 1 auto;min-height:0;display:grid;
  grid-template-columns:minmax(0,1fr) 200px;gap:8px}

/* ── แถบเครื่องมือ · เตี้ยลงจากเดิม ตารางจะได้พื้นที่มากขึ้น ────── */
.ribbon{flex:0 0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--sh);padding:7px 12px;
  display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.fld{display:flex;align-items:center;gap:5px}
.fld > label{color:var(--mu);white-space:nowrap;font-size:11.5px;font-weight:500}
.ro{background:var(--pg);border:1px solid var(--line);border-radius:7px;padding:4px 9px;
  min-height:28px;display:flex;align-items:center;color:var(--tx);font-size:12px;
  max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ro.empty{color:var(--mu2)}
/* v3.7 ป้ายอายุข้อมูลเป็นปุ่มแล้ว · ปุ่มไม่รับ font ของ body เอง ต้องสั่งเอง */
button.ro{font-family:inherit;font-size:12px;cursor:pointer;gap:5px}
button.ro:hover:not(:disabled){border-color:var(--brand);background:var(--brandbg);color:var(--brand)}
button.ro:disabled{cursor:default;color:var(--mu)}

.btn{padding:5px 11px;min-height:28px;border:1px solid var(--line);border-radius:7px;
  background:var(--card);color:var(--tx);cursor:pointer;font-size:12.5px;font-weight:500;
  font-family:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:var(--pg);border-color:var(--mu2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.on .n{color:#fff}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand2)}

/* ปุ่มเปิดหน้าต่างเลือกลอต · แทนช่องพิมพ์แบบเดิม */
.lotbtn{display:inline-flex;align-items:center;gap:8px;min-height:28px;
  width:min(260px,34vw);background:var(--card);border:1px solid var(--line);
  border-radius:7px;padding:4px 9px;cursor:pointer;font-family:var(--mono);
  font-size:11.5px;color:var(--tx);text-align:left}
.lotbtn:hover{border-color:var(--brand);background:var(--brandbg)}
.lotbtn #qtx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lotbtn.empty #qtx{color:var(--mu2);font-family:var(--sans)}
.lotbtn .ar{color:var(--mu2);font-size:9px;flex:0 0 auto}

/* หน้าต่างเลือกลอต */
.lotmodal{width:min(1180px,97vw)}
.pkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:980px){.pkgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.pkgrid{grid-template-columns:1fr}}
.pc{border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;
  overflow:hidden;min-height:0}
.pc-h{padding:8px 11px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:7px;font-size:12px;font-weight:600}
.pc-h .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mu);font-weight:400}
.pc.todo .pc-h{background:#fef3f2;color:#b42318}
.pc.wip  .pc-h{background:#fffaeb;color:#b54708}
.pc.fin  .pc-h{background:#ecfdf3;color:#027a48}
.pc.find .pc-h{background:var(--brandbg);color:var(--brand)}
.pc-l{overflow-y:auto;max-height:46vh;flex:1}
.pc-i{padding:7px 11px;border-bottom:1px solid var(--line2);cursor:pointer;min-height:46px;
  display:flex;flex-direction:column;justify-content:center;gap:2px}
.pc-i:last-child{border-bottom:0}
.pc-i:hover,.pc-i.a{background:var(--brandbg)}
.pc-i.cur{background:var(--pg);box-shadow:inset 3px 0 0 var(--brand)}
.pc-i .l{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--tx);

.pc-i .p{font-size:11px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pc-i .m .bar>i{display:block;height:100%;background:var(--ok)}
.pc-f{padding:6px 9px;border-top:1px solid var(--line2);background:var(--pg)}
.pc-f button{width:100%;justify-content:center}
.pc-s{padding:8px}
.pc-s input{width:100%;min-height:34px;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;font-size:12px;font-family:var(--mono);color:var(--tx)}
.pc-s input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brandbg)}
.pc-e{padding:14px 11px;color:var(--mu2);font-size:11.5px;text-align:center}
.hi{background:#fef0c7;border-radius:3px}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

/* ── แถบเกจสถานะทางขวา · ครบทั้ง 6 ช่องในแถบ State ─────────────── */
.side{min-width:0;min-height:0;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--sh);padding:10px;overflow-y:auto;
  display:flex;flex-direction:column;gap:6px}
.side .sh{font-size:11px;color:var(--mu);font-weight:600;text-transform:uppercase;
  letter-spacing:.4px;padding:0 2px 2px}
.g{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:9px;
  border:1px solid var(--line2)}
.g.na{opacity:.45}
.g svg{width:74px;height:42px;flex:0 0 auto}
.g .gv{font-family:var(--mono);font-size:14px;font-weight:700;fill:var(--tx)}
.g.na .gv{fill:var(--mu2)}

.g .gn b{color:var(--ok)}
.g .gn i{font-style:normal;color:var(--bad)}
.side .mbox{border:1px solid var(--warnbd);background:var(--warnbg);border-radius:9px;
  padding:7px 8px;margin-top:4px}
.side .mt{font-size:11.5px;font-weight:700;color:var(--warn);margin-bottom:4px}
.side .ml{display:flex;flex-wrap:wrap;gap:3px}
.side .ml span{background:var(--card);border:1px solid var(--warnbd);border-radius:5px;
  padding:1px 5px;font-size:10px;color:var(--warn);white-space:nowrap}
.side .mn{font-size:10px;color:var(--warn);margin-top:5px;line-height:1.4;opacity:.85}
.side .foot{margin-top:auto;padding-top:6px;border-top:1px solid var(--line2);
  font-size:10.5px;color:var(--mu2);line-height:1.5}

/* ── แถบเตือน ─────────────────────────────────────────────────── */
.note{background:var(--warnbg);border:1px solid var(--warnbd);border-radius:var(--r);
  color:var(--warn);padding:9px 14px;flex:0 0 auto;display:flex;gap:9px;align-items:center;font-size:12.5px}

/* ── การ์ดตาราง ──────────────────────────────────────────────── */
/* min-width:0 สำคัญมาก · flex item มีค่าเริ่มต้น min-width:auto
   แปลว่ามันจะไม่ยอมแคบกว่าเนื้อหาข้างใน · ตารางกว้าง 34 คอลัมน์ที่ตั้ง nowrap
   จึงดันการ์ดให้กว้างทะลุจอ แล้ว overflow ของ .wrap ไม่ทำงาน
   ผลคือหัวตารางกับตัวตารางหลุดจากกัน ช่องเลื่อนไปคนละที่
   บั๊กคลาสสิกของ flexbox · เจอตอนคอลัมน์เยอะพอเท่านั้น ตอนทดสอบ 7 คอลัมน์ไม่เจอ */
.tcard{min-width:0;min-height:0;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden}
/* ตัวเลื่อนตารางอยู่ที่นี่ที่เดียว */
.wrap{flex:1 1 auto;min-width:0;min-height:0;overflow:auto}
/* ตัด min-width:100% ออก · คู่กับ width:max-content มันอ้างอิงวนกันเอง
   ความกว้างของตารางขึ้นกับกล่อง กล่องขึ้นกับตาราง เบราว์เซอร์เลยคำนวณเพี้ยน */
table{border-collapse:separate;border-spacing:0;table-layout:auto;width:max-content}

thead th{background:var(--hd);border-bottom:1px solid var(--line);
  border-right:1px solid var(--line2);color:var(--mu);font-weight:600;font-size:11px;
  text-align:left;padding:0;white-space:nowrap;user-select:none}
thead tr.band th{background:var(--band);text-align:center;color:var(--tx);
  position:sticky;top:0;z-index:32;height:26px;letter-spacing:.4px;text-transform:uppercase}
thead tr.cols th{position:sticky;top:26px;z-index:31}
thead tr.flt  th{position:sticky;top:60px;z-index:30;background:var(--flt);
  padding:4px 5px;border-bottom:1px solid var(--line)}
.th-in{display:flex;align-items:center;gap:5px;padding:9px 10px;cursor:pointer;
  position:relative;height:34px;text-transform:uppercase;letter-spacing:.3px}
.th-in:hover{color:var(--brand)}
.th-in.num{justify-content:flex-end}
.th-s{font-size:9px;color:var(--brand)}
.rz{position:absolute;right:-3px;top:0;width:7px;height:100%;cursor:col-resize;z-index:5}
.rz:hover{background:var(--brand)}
.fbox{display:flex;align-items:center;gap:4px;background:var(--card);
  border:1px solid var(--line);border-radius:7px;padding:3px 7px}
.fbox:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandbg)}
.fbox .fi{color:var(--mu2);font-size:9px;flex:0 0 auto}
.fbox input{width:100%;min-width:40px;border:0;outline:0;font-size:11.5px;
  font-family:var(--mono);background:transparent;color:var(--tx);padding:2px 0}

tbody td{padding:8px 10px;border-bottom:1px solid var(--line2);
  border-right:1px solid var(--line2);font-size:12.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
tbody tr{background:var(--row)}
tbody tr:nth-child(even){background:var(--row2)}
tbody tr:hover td{background:var(--hov)}
td.mono{font-family:var(--mono)}
td.num{font-family:var(--mono);text-align:right}

td.idx,thead th.idx{position:sticky;left:0;z-index:20}
thead th.idx{z-index:35;background:var(--hd)}
thead tr.band th.idx{background:var(--band)}
td.idx{background:var(--hd);font-family:var(--mono);color:var(--mu2);text-align:right;
  border-right:1px solid var(--line)}
tbody tr:hover td.idx{background:var(--hov)}

/* ช่องติ๊กในแถบ State */
/* v3.9 เขียวคือสัญญาณว่าคอลัมน์ Part ตัดครบแล้ว ไม่ใช่สีประจำกลุ่ม State
   ของเดิมทาเขียวทุกช่องตลอดเวลา สีจึงไม่ได้บอกอะไรเลย
   ช่อง State เป็นเทาจาง ๆ พอให้อ่านออกว่าเป็นกลุ่มเดียวกัน */
td.st{background:var(--flt);text-align:center}
tbody tr:nth-child(even) td.st{background:var(--band)}
tbody tr:hover td.st{background:var(--band)}
/* ตัดครบทุกชิ้นเมื่อไหร่ คอลัมน์ Part เขียวทั้งคอลัมน์ */
#grid.cut td.st.p{background:var(--stbg)}

#grid.cut tbody tr:hover td.st.p{background:var(--stbg2)}
.cbx{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;

.cbx.n{background:transparent;border:1.5px solid var(--mu2);color:transparent}

/* คอลัมน์ที่ยังไม่มีข้อมูล · ไฮไลต์ไว้ให้เห็นว่าต้องไปแก้ฝั่ง sync */
thead th.miss{background:var(--warnbg)}
thead th.miss .th-in{color:var(--warn)}
.mw{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;
  border-radius:4px;background:var(--warn);color:#fff;font-size:9px;font-weight:700;flex:0 0 auto}
tbody td.miss{background:repeating-linear-gradient(45deg,transparent,transparent 5px,
  var(--warnbg) 5px,var(--warnbg) 10px)}

/* แถวห่ออุปกรณ์ (Accessory_Pack / Fitting_Pack) แสดงเหมือนแถวอื่นทุกประการ

   แต่ของจริงในโปรแกรมมันเหมือนกันหมด และเป้าหมายคือให้เหมือน จึงเอาออก
   ยังแยกตอนนับอยู่ ไม่งั้นลอตที่ตัดครบจะค้างที่ 98% ตลอด
   คลาส pk ยังติดไว้เผื่อวันไหนอยากทำเครื่องหมายอีก */

/* ── แถบสถานะล่าง ────────────────────────────────────────────── */
.status{flex:0 0 auto;background:var(--hd);border-top:1px solid var(--line);
  padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  font-size:12px;color:var(--mu)}
.status .n{font-family:var(--mono);color:var(--tx);font-weight:600}
.status .n.bad{color:var(--bad)}
.status .n.mu{color:var(--mu2)}
.status .n.warn{color:var(--warn)}   /* v3.8 ห่อแล้วไม่ได้ยิง */
.status .btn{padding:4px 10px;min-height:28px;font-size:11.5px}
.status .tot{margin-left:auto;display:flex;align-items:center;gap:10px}
.pbar{width:120px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}

/* ── สถานะกลางจอ ─────────────────────────────────────────────── */
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;

.mid .big{font-size:34px;opacity:.25}

.spin.sm{display:inline-block;width:12px;height:12px;border-width:2px;vertical-align:-1px}

/* ── กล่องซ้อน ───────────────────────────────────────────────── */
.ov{display:none;position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:400;
  justify-content:center;align-items:flex-start;padding:28px 12px;overflow-y:auto}
.ov.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);

.modal .bd{padding:18px}
.modal .sub{color:var(--mu);line-height:1.65;margin-bottom:12px;font-size:12.5px}
.pre{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.cl{max-height:48vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.cl-i{display:flex;align-items:center;gap:10px;padding:6px 11px;min-height:44px;
  border-bottom:1px solid var(--line2);cursor:grab}
.cl-i:last-child{border-bottom:0}
.cl-i:hover{background:var(--pg)}
.cl-i.drag{opacity:.35}
.cl-i.over{border-top:2px solid var(--brand)}
.cl-i .gp{color:var(--mu2);cursor:grab}
.cl-i input[type=checkbox]{width:16px;height:16px;cursor:pointer;flex:0 0 auto;accent-color:var(--brand)}
.cl-nm{flex:1;min-width:0}
.cl-nm .a{color:var(--tx);font-weight:500}
.cl-nm .b{font-family:var(--mono);font-size:10.5px;color:var(--mu2)}
.cl-i.off .cl-nm .a{color:var(--mu2)}
.cl-i .mv{display:flex;gap:4px}
.cl-i .mv button{background:var(--card);border:1px solid var(--line);border-radius:7px;
  width:30px;height:30px;cursor:pointer;font-size:9px;color:var(--mu)}
.cl-i .mv button:hover{background:var(--pg);color:var(--tx)}
.br{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.f2{margin-bottom:11px}
.f2 label{display:block;color:var(--mu);margin-bottom:4px;font-size:12px;font-weight:500}
.f2 input{width:100%;min-height:38px;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:8px 11px;font-size:12.5px;font-family:var(--mono);color:var(--tx)}
.f2 input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brandbg)}
select.sel{background:var(--card);border:1px solid var(--line);border-radius:7px;
  padding:5px 8px;min-height:28px;font-size:11.5px;font-family:inherit;cursor:pointer;color:var(--tx)}
/* Expanded lot picker and compact parts table */
#ovLot{padding:12px}
.modal.lotmodal{width:100%;height:calc(100vh - 24px);height:calc(100dvh - 24px);
  margin:0;display:flex;flex-direction:column;min-height:0}
.lotmodal h3{display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;padding:10px 14px}
.lotmodal .bd{flex:1;min-height:0;padding:12px;overflow:auto;display:flex}
.lotmodal .pkgrid{flex:1;min-width:0;min-height:0;grid-template-columns:repeat(4,minmax(0,1fr))}
.lotmodal .pc{min-width:0}
.lotmodal .pc-l{min-height:0;max-height:none}
.lotmodal .pc-h,.lotmodal .pc-s,.lotmodal .pc-f{flex-shrink:0}
.lotmodal .pc-i .l{white-space:normal;overflow-wrap:anywhere}
thead tr.band th{height:22px}
thead tr.cols th{top:22px}
thead tr.flt th{top:50px;padding:2px 3px}
.th-in{height:28px;padding:5px 7px;font-size:10px;gap:3px}
.fbox{padding:1px 4px;border-radius:4px;gap:2px}
.fbox input{font-size:10.5px;padding:1px 0;min-width:28px}
tbody td{padding:4px 7px;font-size:11.5px;line-height:16px}
td.st{padding:3px 4px}
.cbx{width:14px;height:14px;font-size:9px;border-radius:4px}
thead th.tick-col .th-in{padding:4px;gap:2px;justify-content:center;letter-spacing:0}
thead th.tick-col .fbox{padding:1px 2px}
thead th.tick-col input{width:18px;min-width:0}
thead th.tick-col .th-s:empty{display:none}
@media(max-width:980px){
  .lotmodal .pkgrid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
}
@media(max-width:620px){
  #ovLot{padding:6px}
  .modal.lotmodal{height:calc(100vh - 12px);height:calc(100dvh - 12px)}
  .lotmodal .bd{padding:8px}
  .lotmodal .pkgrid{grid-template-columns:minmax(0,1fr);grid-template-rows:none}
  .lotmodal .pc{min-height:260px;max-height:400px}
}
/* Let real header and cell text determine each column's intrinsic width.
   Filter controls are out of intrinsic layout, so they cannot stretch columns. */
#grid{table-layout:auto;width:max-content}
#grid tbody td{max-width:none;white-space:nowrap;text-overflow:clip}
#grid .th-in{white-space:nowrap;width:max-content;min-width:100%;box-sizing:border-box}
#grid thead tr.flt th{height:29px;box-sizing:border-box;padding:0}
#grid thead tr.flt th .fbox{position:absolute;left:3px;right:3px;top:3px;height:22px;box-sizing:border-box}
#grid .fbox input{width:100%;min-width:0;box-sizing:border-box}
#grid td.st{min-width:34px}
#grid td.state-fixed{position:sticky;z-index:21;background:var(--flt)}
#grid tbody tr:nth-child(even) td.state-fixed,#grid tbody tr:hover td.state-fixed{background:var(--band)}
/* v3.9 คอลัมน์ที่ตรึงไว้มีกฎสีของตัวเอง ต้องเติมให้ตรงกับที่ไม่ได้ตรึง
   ไม่งั้น Part ที่ตรึงอยู่จะเป็นเทาตลอด ทั้งที่ตัวที่เลื่อนได้เป็นเขียว */
#grid.cut td.state-fixed.p{background:var(--stbg)}
#grid.cut tbody tr:nth-child(even) td.state-fixed.p,
#grid.cut tbody tr:hover td.state-fixed.p{background:var(--stbg2)}
#grid thead tr.cols th.state-fixed{z-index:41;background:var(--hd)}
#grid thead tr.flt th.state-fixed{z-index:40;background:var(--flt)}
#grid thead tr.band th.state-fixed{z-index:42;background:var(--band)}
#grid thead th.idx{z-index:45}
.state-filter{position:absolute;left:2px;top:3px;box-sizing:border-box;width:calc(100% - 4px);min-width:0;height:23px;padding:0;font:16px "Segoe UI Symbol","Segoe UI",sans-serif;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:4px;cursor:pointer}
.state-filter:focus{outline:2px solid var(--brand)}

/* v5.5 หัวกลุ่มในตารางวัตถุดิบ · แผ่นที่ต้องตัด กับ อุปกรณ์
   ไม่ใช่แถวข้อมูล กดไม่ได้ ทำให้ต่างจากแถวปกติชัด ๆ ด้วยพื้นกับเส้นหนา */
tr.rmgrp td{background:var(--band);border-top:2px solid var(--line);
  border-bottom:1px solid var(--line);font-weight:700;font-size:12px;color:var(--tx);
  padding:7px 9px !important}
tr.rmgrp .n{font-family:var(--mono);font-weight:600;font-size:11.5px;color:var(--mu);margin-left:6px}
tr.rmgrp .s{font-family:var(--sans);font-weight:400;font-size:11.5px;color:var(--mu);margin-left:8px}

/* v5.4 แถวช่องกรองใต้หัวตารางรายการลอต · ใช้สีแถวกรองชุดเดียวกับตารางรายชิ้น */
.dtab thead tr.dflt th{background:var(--flt);padding:3px 4px;position:sticky;top:28px;z-index:19}
/* 28px = ความสูงของแถวหัวตาราง (ตัวอักษร 10.5px + padding 7px บนล่าง + เส้น 1px)
   ถ้าไปแก้ padding หรือขนาดตัวอักษรของ table.dtab th ต้องมาแก้เลขนี้ด้วย
   ไม่งั้นแถวกรองจะทับหัวตารางหรือลอยห่างออกมาเวลาเลื่อน */
.dcf{width:100%;box-sizing:border-box;min-width:56px;
  border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--tx);
  font-family:var(--sans);font-size:11.5px;font-weight:400;padding:3px 6px}
.dcs{width:100%;box-sizing:border-box;min-width:64px;max-width:200px;
  border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--tx);
  font-family:var(--sans);font-size:11.5px;font-weight:400;padding:2px 4px;cursor:pointer}
.dcs:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.dcf::placeholder{color:var(--mu2);font-weight:400}
.dcf:focus{outline:2px solid var(--brand);border-color:var(--brand)}
@media(max-width:640px){ .dcf{min-height:32px;font-size:12px} }

/* v5.3 ป้ายสัปดาห์ปัจจุบัน · ดันไปขวาสุดของแถบด้วย margin-left:auto
   ตัวเลขสัปดาห์เป็น mono · ช่วงวันที่มีชื่อเดือนไทยจึงต้องเป็น sans
   ฟอนต์ mono ไม่มีตัวอักษรไทย ใส่แล้วบรรทัดจะเพี้ยน */
.wkb{margin-left:auto;display:flex;align-items:center;gap:7px;white-space:nowrap;
  background:var(--brandbg);border:1px solid var(--line);border-radius:7px;padding:4px 10px}
.wkb .w{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--brand);letter-spacing:.01em}
.wkb .d{font-family:var(--sans);font-size:11px;color:var(--mu)}
@media(max-width:640px){ .wkb .d{display:none} }

/* ══ v4.0 แท็บภาพรวม ══════════════════════════════════════════════
   ใช้ตัวแปรสีชุดเดิมทั้งหมด ไม่มีค่าสีดิบสักตัว
   ตัวเลขทุกที่เป็น mono · ข้อความไทยเป็น sans เสมอ ห้ามสลับ */
.tabs{display:flex;gap:4px;margin-right:4px}
.tabs .tb{padding:5px 13px;min-height:28px;border:1px solid var(--line);border-radius:7px;
  background:var(--card);color:var(--mu);cursor:pointer;font-size:12.5px;font-weight:600;
  font-family:inherit;white-space:nowrap;transition:background .12s,color .12s,border-color .12s}
.tabs .tb:hover{background:var(--pg);color:var(--tx)}
.tabs .tb.on{background:var(--brand);border-color:var(--brand);color:#fff}
/* ของที่เป็นของหน้ารายชิ้นล้วน ๆ · ซ่อนตอนดูภาพรวม ไม่ได้ย้ายตำแหน่ง */
#app[data-tab="dash"] .po{display:none}

.dash{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.dash .blk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:10px 12px}
.dash h4{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;
  letter-spacing:.03em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.dash h4 .sub2{font-size:10.5px;font-weight:500;color:var(--mu2);text-transform:none;letter-spacing:0}

/* แถวตัวกรอง */
.dfl{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.dfl label{color:var(--mu);font-size:11.5px;font-weight:500;white-space:nowrap}
.dsel,.dsrch{border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--tx);
  font-family:inherit;font-size:12px;padding:4px 8px;min-height:28px;cursor:pointer}
.dsel:focus,.dsrch:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.dsrch{cursor:text;min-width:180px}

/* v5.2 ตารางสรุปรายสัปดาห์ · แถวกดได้ทั้งแถว ปุ่มไม่ต่ำกว่า 44px บนมือถือ */
.wkhead{font-size:12px;font-weight:600;color:var(--tx);margin-bottom:6px}
.wkfoot{font-size:11px;color:var(--mu);margin-top:6px;line-height:1.6}
.wktab tbody tr{cursor:pointer}
.wktab tbody tr:hover{background:var(--hov)}
.wktab tbody tr.wknow{background:var(--brandbg)}
.wktab tbody tr.wkon{background:var(--stbg);box-shadow:inset 3px 0 0 var(--ok)}
.wktag{font-family:var(--sans);font-size:10px;font-weight:600;color:var(--brand);
  background:var(--brandbg);border-radius:5px;padding:1px 5px;margin-left:4px}
@media(max-width:640px){ .wktab tbody td{padding-top:12px;padding-bottom:12px} }

/* การ์ดตัวเลขสรุป */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:10px 12px}
.kpi .k{font-size:10.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:600;color:var(--tx);
  line-height:1.25;margin-top:3px}
.kpi .v .u{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--mu);margin-left:3px}
.kpi .s{font-size:11px;color:var(--mu2);margin-top:2px}
.kpi.hi{border-color:var(--brand)}
.kpi.hi .v{color:var(--brand)}

/* กราฟแท่ง · ทำด้วย div ล้วน ไม่มี library */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:62px minmax(0,1fr) 74px;gap:8px;align-items:center;
  cursor:pointer;border-radius:6px;padding:2px 3px;min-height:26px}
.bar:hover{background:var(--hov)}
.bar.on{background:var(--brandbg)}
.bar .t{font-size:11.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t.mono{font-family:var(--mono);font-size:11px}
.bar .g{height:15px;background:var(--band);border-radius:5px;overflow:hidden}
.bar .g i{display:block;height:100%;background:var(--brand);border-radius:5px;
  transition:width .2s}
.bar.on .g i{background:var(--ok)}
.bar .v{font-family:var(--mono);font-size:11px;color:var(--tx);text-align:right;white-space:nowrap}
.bars .none{font-size:11.5px;color:var(--mu2);padding:6px 2px}

/* v5.0 กราฟแท่งตั้ง · ล้อหน้าตารายงาน PdControlRm ที่หน้างานดูอยู่ทุกวัน
   คนที่เปิดมาต้องรู้ทันทีว่าเป็นรายงานตัวเดียวกัน แค่ของใหม่ที่ต่อ AX ตรง
   ยังใช้ตัวแปรสีชุดเดิมทั้งหมด ไม่มีค่าสีดิบ */
.vwrap{overflow-x:auto;padding-bottom:2px}
.vbars{display:flex;align-items:flex-end;gap:6px;height:196px;min-width:100%}
.vbar{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;height:100%;cursor:pointer;border-radius:6px 6px 0 0;padding:0 1px}
.vbar:hover{background:var(--hov)}
.vbar.plain{cursor:default}
.vbar.plain:hover{background:transparent}
.vbar .vv{font-family:var(--mono);font-size:10.5px;color:var(--tx);white-space:nowrap;
  margin-bottom:3px;line-height:1}
.vbar .vg{width:100%;max-width:64px;background:var(--brand);border-radius:4px 4px 0 0;
  min-height:2px;transition:height .2s}
.vbar.on .vg{background:var(--ok)}
.vbar.on .vv{color:var(--ok);font-weight:600}
.vbar .vt{font-size:10px;color:var(--mu);margin-top:5px;white-space:nowrap;
  line-height:1.2;text-align:center}
.vbar.slim{min-width:22px}
.vbar.wide{min-width:44px}

/* หัวแท็บ · บอกให้ชัดว่านี่คือรายงานตัวไหน ข้อมูลมาจากไหน สดแค่ไหน */
.bihead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bihead .t1{font-size:15px;font-weight:700;color:var(--tx)}
.bihead .t2{font-size:11.5px;color:var(--mu)}
.bihead .t3{font-size:11px;color:var(--mu2);margin-left:auto;font-family:var(--mono)}

/* ปุ่มวัตถุดิบในตาราง · ลอตที่มีของแล้วกับยังไม่มี ต้องดูออกจากระยะไกล */
.rmbtn{padding:3px 8px;min-height:26px;border-radius:6px;border:1px solid var(--line);
  background:var(--card);color:var(--mu2);font-family:inherit;font-size:11.5px;
  cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.rmbtn:hover{border-color:var(--brand);color:var(--brand);background:var(--brandbg)}
.rmbtn.has{border-color:var(--ok);color:var(--ok);background:var(--stbg);font-weight:600}
.rmbtn .rn{font-family:var(--mono);font-size:11px}

/* ตารางลอต */
.dwrap{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:9px}
/* v4.2 ตารางวัตถุดิบอยู่ในหน้าต่าง กดแถวไม่ได้ อย่าให้เคอร์เซอร์หลอก */
.rmtab table.dtab tbody tr{cursor:default}

/* v4.7 หน้าต่างวัตถุดิบกินเกือบเต็มจอ · ชื่ออุปกรณ์ยาวมากจนตัดแล้วอ่านไม่รู้เรื่อง
   ov จัดกลางด้วย flex อยู่แล้ว modal จึงแค่บอกความกว้างกับความสูงสูงสุด
   หัวกับปุ่มล่างอยู่กับที่ ให้ตารางตรงกลางเป็นตัวเลื่อน ไม่ใช่เลื่อนทั้งหน้าต่าง
   ไม่งั้นกดปุ่มปิดต้องเลื่อนขึ้นไปหาทุกครั้ง */
.modal.rmmodal{width:min(1600px,97vw);max-height:94vh;display:flex;flex-direction:column}
.modal.rmmodal > h3{flex:0 0 auto}
.modal.rmmodal > .bd{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:14px 18px}
.modal.rmmodal #rmBody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.modal.rmmodal .dwrap{flex:1 1 auto;max-height:none}

/* ชื่ออุปกรณ์ต้องเห็นเต็ม · ตัดคำแล้วขึ้นบรรทัดใหม่แทนการตัดท้ายทิ้ง */
table.dtab td.nm{white-space:normal;word-break:break-word;line-height:1.5;min-width:280px}
@media (max-width:760px){ table.dtab td.nm{min-width:0} }
table.dtab{width:100%;border-collapse:separate;border-spacing:0;table-layout:auto}
table.dtab th{position:sticky;top:0;z-index:2;background:var(--hd);color:var(--mu);
  font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;
  text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dtab td{padding:6px 9px;border-bottom:1px solid var(--line2);font-size:12px;
  color:var(--tx);vertical-align:middle}
table.dtab tbody tr{cursor:pointer}
table.dtab tbody tr:nth-child(even) td{background:var(--row2)}
table.dtab tbody tr:hover td{background:var(--hov)}
table.dtab td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
table.dtab td.mono{font-family:var(--mono);font-size:11.5px;white-space:nowrap}
table.dtab td.rm{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.dtab td.pd{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--warn)}

/* แถบความคืบหน้าในตาราง */
.pgw{display:flex;align-items:center;gap:6px;min-width:96px}
.pgw .pb{flex:1 1 auto;height:6px;background:var(--band);border-radius:4px;overflow:hidden}
.pgw .pb i{display:block;height:100%;background:var(--brand);border-radius:4px}
.pgw.done .pb i{background:var(--ok)}
.pgw .pn{font-family:var(--mono);font-size:10.5px;color:var(--mu);white-space:nowrap}

/* ป้ายความแม่นของตัวเลขเงิน */
.lvp{display:inline-block;font-size:9.5px;font-weight:600;border-radius:4px;
  padding:1px 5px;border:1px solid var(--line);color:var(--mu);background:var(--pg);
  white-space:nowrap;vertical-align:middle}
.lvp.room{color:var(--ok);border-color:var(--ok);background:var(--stbg)}

const $ = id => document.getElementById(id);

/* ค่าที่มาจากผู้ใช้หรือฐานข้อมูลต้องผ่านตัวนี้ก่อนต่อเป็นสตริง HTML */
function esc(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* มีอักษรไทยไหม · ฟอนต์ mono ไม่มีตัวอักษรไทย ฝืนใช้แล้วตกบรรทัดเพี้ยน */
const RE_TH = /[\u0E00-\u0E7F]/;
const isTh  = v => RE_TH.test(String(v == null ? '' : v));

/* เวลา · ตัดสตริงตรง ๆ ไม่ผ่าน new Date()
   StarSync เขียนเวลาท้องถิ่นลงไปดิบ ๆ ถ้าแปลง timezone อีกทีจะไม่ตรงกับหน้าหลัก */
const fmtTime = v => String(v || '').replace('T',' ').slice(0,19);

/* v5.1 เวลาแบบแปลงเป็นเวลาเครื่อง ไม่ใช่ตัดสตริงดิบแบบ fmtTime
   ใช้กับ fitting_onhand.updated_at ซึ่งเป็น timestamptz คืนมาเป็น UTC
   ถ้าตัดสตริงเฉย ๆ จะขึ้น 02:27 ทั้งที่เขียนตอน 09:27 ตามเวลาไทย
   ซึ่งชวนให้เข้าใจผิดว่ายอดเก่าค้างมาเจ็ดชั่วโมง */
function fmtLocal(v){
  const t = parseUtc(v);
  if(!t) return '—';
  const d = new Date(t), p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) +
         ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* v3.6 synced_at เป็นข้อยกเว้นของกฎด้านบน · StarSync เขียนตัวนี้ด้วย
   ToUniversalTime() จึงเป็น UTC เสมอ ไม่ใช่เวลาท้องถิ่นแบบ part_date
   แต่ PostgREST อาจคืนมาโดยไม่มี Z ต่อท้าย แล้วแต่ชนิดคอลัมน์
   ปล่อยให้ JS เดาเอง มันจะอ่านเป็นเวลาท้องถิ่น เพี้ยนไป 7 ชั่วโมงทันที
   จึงเติม Z ให้เองเมื่อไม่มีตัวบอกโซนติดมา */
function parseUtc(v){
  const s = String(v || '').trim();
  if(!s) return 0;
  const t = Date.parse(/[Zz]$|[+-]\d{2}:?\d{2}$/.test(s) ? s : s + 'Z');
  return isNaN(t) ? 0 : t;
}
/* บอกว่านานแค่ไหนแล้ว · ไม่ต้องแม่นระดับวินาที แค่ให้รู้ว่าสดหรือค้าง */
function agoTx(ms){
  if(!ms) return '';
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if(s < 60)    return s + ' วินาทีที่แล้ว';
  if(s < 3600)  return Math.round(s / 60) + ' นาทีที่แล้ว';
  if(s < 86400) return Math.round(s / 3600) + ' ชม.ที่แล้ว';
  return Math.round(s / 86400) + ' วันที่แล้ว';
}
/* เวลาซิงก์ล่าสุดของชุดแถวที่โหลดมา · คิดครั้งเดียวตอนโหลด ไม่คิดใหม่ทุกครั้งที่วาด
   ลอตใหญ่สามพันแถว ถ้าไล่ทุกรอบ render จะหน่วงโดยไม่จำเป็น */
function maxSynced(rows){
  let m = 0;
  for(const r of rows){ const t = parseUtc(r && r.synced_at); if(t > m) m = t; }
  return m;
}
const nf2 = new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat('en-US');

function hms(s){
  s = Math.max(0, parseInt(s,10) || 0);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h + ':' + String(m).padStart(2,'0') + ':' + String(x).padStart(2,'0');
}

   ถอดลำดับมาจากนิยามกริดในตัว AxProgress.exe · แถบ State มาก่อน แล้วข้อมูลชิ้น

   ของเดิมถ้าตารางไหนไม่มีคอลัมน์ มันจะหายไปเงียบ ๆ คนดูไม่มีทางรู้ว่าขาดอะไร
   ตอนนี้ขึ้นครบทุกช่องเสมอ ช่องที่ยังไม่มีข้อมูลจะไฮไลต์ส้มไว้
   จะได้เห็นทันทีว่าต้องไปแก้ฝั่ง sync ให้ดึงคอลัมน์ไหนเพิ่ม */
const AXCOLS = [
  'st_part','st_pack','st_pick','st_wh','st_delivery','st_site','st_wh_rec','st_wh_issue',
  'rec_id','lot','proj_id','proj_name','order_number','build','floor','room','room_category',
  'shelf_no','product_article','product_name','item_fg','item_part','part_name',
  'code_pack','code_part','material_code','finish_length','finish_width',
  'part_seq_total','product_seq_total','pack_seq_total','item_id','barcode','delay_no'
];

/* v3.3 ตารางที่หน้านี้ใช้ · lot_part สำหรับรายชิ้น · lot_progress สำหรับรายการลอต
   ไม่มี check_part แล้ว เพราะเอามาแสดงแทนกันไม่ได้ตั้งแต่แรก */
const NEED_TABLES = ['lot_part','lot_progress'];
/* คอลัมน์สำรอง · ใช้ตอนตารางมีอยู่จริงแต่ยังไม่มีข้อมูลสักแถว
   จึงอ่านชื่อคอลัมน์จากแถวตัวอย่างไม่ได้ */
const FALLBACK_COLS = { lot_part: AXCOLS.concat(['synced_at']) };

/* คอลัมน์นี้อ่านค่าจากชื่อไหนในตารางที่กำลังดูอยู่ · ไม่มีเลยคืนค่าว่าง */
function srcKey(k){ return (S.schema[S.table] || []).includes(k) ? k : ''; }
function valOf(r, k){ const sk = srcKey(k); return sk ? r[sk] : undefined; }

/* คอลัมน์นี้มีข้อมูลจริงไหมในลอตที่เปิดอยู่
   ไม่มีคอลัมน์ในตาราง หรือมีแต่ทุกแถวว่างหมด ก็ถือว่าไม่มี
   เก็บผลไว้ใน S.miss ตอนโหลดเสร็จ ไม่ได้คิดใหม่ทุกครั้งที่วาด
   ลอตใหญ่ ๆ สองพันแถวคูณสามสิบคอลัมน์ ถ้าคิดใหม่ทุกครั้งจะหน่วง */
function scanMissing(){ S.miss = {}; }

const DATES = new Set(['part_date','imported_at','synced_at','updated_at']);
const NUMS  = new Set(['finish_length','finish_width','duration_sec','id','rec_id',
  'total_parts','checked_parts','total_all','checked_all','delay_no']);
/* ช่องติ๊กในแถบ State · โปรแกรมโชว์ 6 ช่องแรก อีกสองซ่อนไว้ */
const TICKS = new Set(['st_part','st_pack','st_pick','st_wh','st_delivery','st_site',
                       'st_wh_rec','st_wh_issue']);

const stKey = () => srcKey('st_part');

/* ค่าดิบจาก AX · ยิงบาร์โค้ดที่หน้าเลื่อยจริงหรือเปล่า
   แยกไว้เพราะยังต้องใช้ตอบคำถามว่าชิ้นไหนไม่ได้ยิง */
const isCutScanned = r => { const v = valOf(r, 'st_part');
                            return v === true || Number(v) === 1; };
const isPacked     = r => { const v = valOf(r, 'st_pack');
                            return v === true || Number(v) === 1; };

/* v3.9 ตัดแล้วหรือยัง ในความหมายที่ระบบเก่าใช้
   ยิง Pack แล้วแต่ไม่ได้ยิง Part = ถือว่าตัดแล้ว
   เหตุผลคือของที่ห่อไปแล้วย่อมผ่านเลื่อยมาแล้วแน่นอน ที่ขาดคือ
   คนตัดไม่ได้ยิงบาร์โค้ดเข้าระบบ ไม่ใช่ชิ้นงานไม่ได้ถูกตัด
   ติ๊กเฉพาะตอนแสดงผล ไม่ได้ไปแก้ค่าใน lot_part หรือ AX
   ทุกที่ที่นับยอดต้องเรียกตัวนี้ ห้ามอ่าน st_part ดิบเอง
   ไม่งั้นเกจกับแถบล่างจะขึ้นเลขไม่ตรงกันบนจอเดียว */
const isDone = r => isCutScanned(r) || (isPiece(r) && isPacked(r));
/* ตารางที่ดูอยู่มีครบทุกชิ้นในลอตไหม (ไม่ใช่แค่ชิ้นที่ยิงแล้ว) */
const hasFull = () => (S.schema[S.table] || []).includes('st_part');

/* แถวนี้เป็น "ชิ้นที่ต้องตัด" หรือเป็น "ห่อ"
   แถวที่ไม่มีขนาด (Finish Length หรือ Finish Width เป็น 0) คือห่ออุปกรณ์
   ตรวจกับของจริงแล้ว แถวพวกนั้นคือ Accessory_Pack กับ Fitting_Pack ล้วน ๆ
   มันไม่เคยถูกตัด ช่อง Part จึงไม่มีวันติ๊ก ถ้านับรวมเป็น "ยังไม่ตัด"
   ลอตที่ตัดครบแล้วจะค้างอยู่ที่ 98% ตลอดกาล ซึ่งอ่านแล้วเข้าใจผิด
   StarSync กับหน้า Cutting Center แยกสองอย่างนี้อยู่แล้ว (total_parts กับ total_all)
   หน้านี้ต้องนับให้ตรงกัน ไม่งั้นสองหน้าจะขึ้นตัวเลขไม่เท่ากัน */
/* ยอดตัดของลอตนี้ · ใช้ที่เดียวกันทั้งแถบล่างและเกจ
   ตารางที่มีครบทุกชิ้น (lot_part) ใช้จำนวนแถวเป็นตัวหารได้ตรง ๆ
   ห่อไม่ต้องเข้าเครื่องตัด จึงไม่นับเป็นตัวหาร */
function partStats(){
  const piece = S.rows.filter(isPiece);
  return { done: piece.filter(isDone).length, total: piece.length };
}

function isPiece(r){
  const L = valOf(r, 'finish_length'), W = valOf(r, 'finish_width');
  if(L === undefined && W === undefined) return true;
  return Number(L) > 0 && Number(W) > 0;
}

/* v3.8 ชิ้นที่ต้องตัด · AX ไม่ได้ติ๊ก Part แต่ติ๊ก Pack ไปแล้ว
   v3.9 ต้องดูค่าดิบด้วย isCutScanned ไม่ใช่ isDone
   เพราะ isDone รวมกฎนี้เข้าไปแล้ว ถ้าเรียก isDone จะไม่เจอสักแถว
   ความหมายเปลี่ยนไปจาก 3.8 · ไม่ใช่ของผิดปกติที่ต้องตามแล้ว
   เป็นตัวบอกว่าลอตนี้มีกี่ชิ้นที่ติ๊กมาจากกฎ ไม่ได้ยิงจริง
   ยอดตัดไม่เปลี่ยนตามตัวนี้ เพราะนับรวมไปแล้ว */
function isOrphan(r){
  if(!isPiece(r) || isCutScanned(r)) return false;
  return isPacked(r);
}
const orphanCount = () => S.rows.filter(isOrphan).length;

const PRESETS = {
  'เหมือน Ax Progress':[
    'st_part','st_pack','st_pick','st_wh','st_delivery','st_site',
    'shelf_no','product_article','product_name','item_fg','part_name','code_pack',
    'material_code','finish_length','finish_width','product_seq_total','pack_seq_total',
    'item_id','delay_no'],
  'ทุกช่องในกริด':AXCOLS.slice(),
  'ที่ตั้ง':['st_part','build','floor','room','room_category','shelf_no','part_name',
            'finish_length','finish_width'],
  'ย่อสั้น':['st_part','shelf_no','part_name','finish_length','finish_width']
};
/* ค่าเริ่มต้น = เปิดทุกช่องที่กริดของ Ax Progress มี
   จะได้เห็นครบตั้งแต่เปิดหน้าแรก และเห็นด้วยว่าช่องไหนยังไม่มีข้อมูล */
const DEF_ON = new Set(AXCOLS);

/* ══════════════════════════════════════════════════════════════
   ชั้นคุยกับฐานข้อมูล · ที่อื่นห้ามเรียก fetch ตรง
   ══════════════════════════════════════════════════════════════ */
const db = {
  head(){ return S.key.startsWith('sb_publishable_') ? { apikey:S.key } : { apikey:S.key, Authorization:'Bearer ' + S.key }; },
  base(){ return S.url.replace(/\/+$/,'') + '/rest/v1/'; },

  async get(path){
    const r = await fetch(this.base() + path, { headers:this.head() });
    if(!r.ok){
      const t = await r.text().catch(()=> '');
      throw new Error('HTTP ' + r.status + ' · ' + t.slice(0,240));
    }
    return r.json();
  },

  /* ถามโครงตาราง · สามชั้น กันพลาด
     v3.2 ของเดิมพึ่ง OpenAPI ที่ราก /rest/v1/ อย่างเดียว
     ถ้ารอบนั้นล้มเหลว (เน็ตสะดุด สิทธิ์ ตัวแคชของ PostgREST)
     หน้าจะไม่รู้ว่ามีตาราง lot_part อยู่ แล้วถอยไปอ่าน check_part
     ทั้งที่ข้อมูลครบอยู่แล้ว · แล้วยังไปสั่งดึงซ้ำอีก
     อาการที่เห็นคือ dropdown เหลือ check_part ตัวเดียว
     ตอนนี้ยิงถามแต่ละตารางตรง ๆ ยืนยันอีกชั้น ไม่ปล่อยให้พลาดเงียบ ๆ */
  async schema(){
    const out = {};
    try {
      const r = await fetch(this.base(), { headers:this.head() });
      if(r.ok){
        const j = await r.json();
        const defs = j.definitions || (j.components && j.components.schemas) || {};
        for(const t in defs){ const p = defs[t] && defs[t].properties; if(p) out[t] = Object.keys(p); }
      }
    } catch(e){ /* ไปต่อด้วยการยิงถามทีละตาราง */ }

    for(const t of NEED_TABLES){
      if(out[t] && out[t].length) continue;
      try {
        const one = await this.get(t + '?select=*&limit=1');
        if(one.length) out[t] = Object.keys(one[0]);
        else if(FALLBACK_COLS[t]) out[t] = FALLBACK_COLS[t].slice();   /* ตารางมีอยู่แต่ยังว่าง */
      } catch(e){ /* ตารางนี้ไม่มีจริง ๆ ก็ข้ามไป */ }
    }
    if(!Object.keys(out).length) throw new Error('อ่านโครงตารางไม่ได้เลยสักตาราง');
    return out;
  },

  lots(){
    /* เรียงตามเวลาที่อัปเดตล่าสุด ลอตที่เพิ่งขยับจะอยู่บนสุดของทุกคอลัมน์
       เรียงตามรหัสลอตแบบเดิมทำให้ของเก่าปี 2024 ลอยขึ้นมาก่อน */
    return this.get('lot_progress?select=lot,proj_name,proj_id,total_parts,' +
                    'checked_parts,total_all,checked_all,updated_at' +
                    '&order=updated_at.desc.nullslast&limit=8000');
  },

  /* v4.0 ข้อมูลของแท็บภาพรวม · lot_progress ตารางเดียวจบ
     ขอเฉพาะคอลัมน์ที่ตารางมีจริง ถ้าขอคอลัมน์ที่ยังไม่มี PostgREST ตอบ 400
     แล้วทั้งแท็บจะจอเปล่าโดยไม่บอกว่าเพราะอะไร · เครื่องที่ยังไม่ได้อัป
     StarSync จะเห็นแท็บนี้แบบไม่มีเงินกับกำหนดเสร็จ ซึ่งดีกว่าไม่เห็นอะไรเลย */
  dashRows(){
    const want = ['lot','proj_name','prod_pool','end_date','shelf','lot_remark','pd_remark',
                  'amount','amount_lv','amount_lines','amount_skip','lot_status',
                  'total_parts','checked_parts','total_all','checked_all',
                  'checked_pack','checked_pick','checked_wh','updated_at','head_at'];
    const have = S.schema['lot_progress'] || [];
    const cols = want.filter(c => have.includes(c));
    if(!cols.includes('lot')) cols.unshift('lot');
    return this.get('lot_progress?select=' + cols.join(',') +
                    '&order=updated_at.desc.nullslast&limit=8000');
  },

  /* ── v4.3 วัตถุดิบ ─────────────────────────────────────────────
     lot_rm มีเฉพาะลอตที่เคยมีคนกดดู · ไม่มีแถวไม่ได้แปลว่าไม่มีวัตถุดิบ
     แปลว่ายังไม่เคยดึง ซึ่งเป็นคนละเรื่องกัน หน้าจอต้องแยกให้ออก */
  rmRows(lot){
    return this.get('lot_rm?select=*&lot=eq.' + encodeURIComponent(lot) +
                    '&order=item_id.asc&limit=2000');
  },
  /* คีย์ของตารางคำขอคือชื่อลอต · merge-duplicates เพื่อให้ขอซ้ำได้
     ไม่งั้นลอตที่เคยขอแล้วจะขอใหม่ไม่ได้ตลอดกาล เพราะแถวชนคีย์ */
  async rmRequest(lot){
    const r = await fetch(S.url + '/rest/v1/lot_rm_request?on_conflict=lot', {
      method:'POST',
      headers:{ apikey:S.key, 'Content-Type':'application/json',
                Prefer:'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify([{ lot, requested_at:new Date().toISOString(),
                              done_at:null, rows_synced:null, error:null,
                              requested_by:'lot-parts' }])
    });
    if(!r.ok) throw new Error('HTTP ' + r.status + ' · ' + (await r.text()).slice(0,200));
  },
  /* ลอตไหนมีวัตถุดิบอยู่ในฐานแล้วบ้าง · แถวเดียวต่อลอต ไม่ได้ลากทั้งตารางมา */
  rmHave(){ return this.get('lot_rm_count?select=lot,n&limit=8000'); },

  rmReqState(lot){
    return this.get('lot_rm_request?select=done_at,rows_synced,error&lot=eq.' +
                    encodeURIComponent(lot) + '&limit=1');
  },

  /* ชื่อกับหน่วยของวัตถุดิบ · อ่านจากคลังอุปกรณ์ซึ่งอยู่คนละโปรเจกต์
     ยิงทีละก้อนไม่เกิน 100 รหัส ไม่งั้น URL ยาวเกินจนบางพร็อกซีตัดทิ้ง */
  async fitNames(ids){
    const cfg = fitCfg(), out = {};
    for(let i = 0; i < ids.length; i += 100){
      const part = ids.slice(i, i + 100).map(encodeURIComponent).join(',');
      const r = await fetch(cfg.u + '/rest/v1/fitting_global' +
                            '?select=item_number,product_name,unit&item_number=in.(' + part + ')',
                            { headers:{ apikey:cfg.k, Authorization:'Bearer ' + cfg.k } });
      if(!r.ok) throw new Error('HTTP ' + r.status);
      (await r.json()).forEach(x => { out[x.item_number] = x; });
    }
    return out;
  },

  /* ยอดคงเหลือจริง · ตาราง fitting_onhand โปรเจกต์เดียวกับชื่ออุปกรณ์
     StarSync เขียนจาก AX INVENTSUM รอบละ 10 นาที
     ตารางเก็บเฉพาะรหัสที่เคยมีของ · รหัสที่ไม่มีแถว = ไม่มีของในคลัง
     ยิงทีละก้อนไม่เกิน 100 รหัสด้วยเหตุผลเดียวกับ fitNames */
  async fitOnhand(ids){
    const cfg = fitCfg(), out = {};
    for(let i = 0; i < ids.length; i += 100){
      const part = ids.slice(i, i + 100).map(encodeURIComponent).join(',');
      const r = await fetch(cfg.u + '/rest/v1/fitting_onhand' +
                            '?select=item_number,qty,qty_avail,updated_at&item_number=in.(' + part + ')',
                            { headers:{ apikey:cfg.k, Authorization:'Bearer ' + cfg.k } });
      if(!r.ok) throw new Error('HTTP ' + r.status);
      (await r.json()).forEach(x => { out[x.item_number] = x; });
    }
    return out;
  },

  /* ลอตที่ StarSync เพิ่งดึงรายชิ้นมาล่าสุด · ใช้เป็นลอตเริ่มต้นตอนเปิดหน้า */
  async latestPartsLot(){
    const j = await this.get('lot_part?select=lot&order=synced_at.desc&limit=1');
    return j[0] ? j[0].lot : '';
  },

  /* แถวของลอตหนึ่ง · PostgREST คืนสูงสุด 1000 แถวต่อครั้ง ต้องไล่หน้า
     ต้องสั่ง order ทุกครั้ง ไม่งั้นการไล่หน้าไม่รับประกันว่าแถวจะไม่ซ้ำหรือหาย */
  async rowsOfLot(table, lot){
    const cols = S.schema[table] || [];
    const ord  = cols.includes('shelf_no')  ? 'shelf_no.asc,code_pack.asc,code_part.asc'
               : cols.includes('part_date') ? 'part_date.asc'
               : cols.includes('rec_id')    ? 'rec_id.asc' : 'lot.asc';
    const out = [], PAGE = 1000;
    for(let off = 0; off < 30000; off += PAGE){
      const page = await this.get(table + '?select=*&lot=eq.' + encodeURIComponent(lot) +
                                  '&order=' + ord + '&limit=' + PAGE + '&offset=' + off);
      out.push(...page);
      if(page.length < PAGE) break;
    }
    return out;
  },

  peek(table){ return this.get(table + '?select=*&limit=1000'); },

  /* หย่อนคำขอให้ StarSync ไปดึงรายชิ้นของลอตนี้จาก AX ก่อนคิวปกติ
     merge-duplicates เพราะขอลอตเดิมซ้ำได้ · ล้าง done_at ให้นับเป็นคำขอใหม่ */
  async request(lot){
    const r = await fetch(this.base() + 'lot_part_request?on_conflict=lot', {
      method:'POST',
      headers: Object.assign({}, this.head(), {
        'Content-Type':'application/json',
        'Prefer':'resolution=merge-duplicates,return=minimal'
      }),
      body: JSON.stringify([{ lot, requested_at:new Date().toISOString(),
                              requested_by:'lot-parts.html',
                              done_at:null, rows_synced:null, error:null }])
    });
    if(!r.ok) throw new Error('HTTP ' + r.status + ' · ' + (await r.text().catch(()=> '')).slice(0,200));
  },

  async requestState(lot){
    const j = await this.get('lot_part_request?select=done_at,rows_synced,error&lot=eq.' +
                             encodeURIComponent(lot) + '&limit=1');
    return j[0] || null;
  }
};

/* ══════════════════════════════════════════════════════════════
   คอลัมน์ · จำการจัดไว้แยกตามตาราง
   ══════════════════════════════════════════════════════════════ */
const colKey = () => 'lp_cols_' + S.table;
/* บวกเลขนี้ทุกครั้งที่แก้ DEF_ON หรือ PRESETS
   ถ้าไม่บวก คนที่เคยจัดคอลัมน์เองไว้จะไม่มีวันเห็นคอลัมน์ที่เพิ่มใหม่ */
const COLS_VER = 7;

function buildCols(){
  const all = S.schema[S.table] || [];
  /* คอลัมน์มาตรฐานของ Ax Progress มาก่อนเสมอ ไม่ว่าตารางนี้จะมีจริงหรือไม่
     ตามด้วยคอลัมน์อื่นที่ตารางมีแต่กริดของโปรแกรมไม่มี (เวลาที่ยิง เครื่อง ฯลฯ) */
  const extra = all.filter(k => !AXCOLS.includes(k));
  const universe = AXCOLS.concat(extra);

  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(colKey()) || 'null'); } catch(e){}
  if(saved && saved.v !== COLS_VER) saved = null;
  const list = (saved && Array.isArray(saved.c)) ? saved.c : null;

  const seen = new Set(), out = [];
  if(list){
    list.forEach(c => {
      if(c && c.k && universe.includes(c.k) && !seen.has(c.k)){
        seen.add(c.k); out.push({ k:c.k, on:!!c.on, w:c.w || 0 });
      }
    });
  }
  universe.forEach(k => { if(!seen.has(k)) out.push({ k, on: list ? false : DEF_ON.has(k), w:0 }); });
  S.cols = out;
}
function saveCols(){
  try { localStorage.setItem(colKey(), JSON.stringify({ v:COLS_VER, c:S.cols })); } catch(e){}
}
const OPTIONAL_STATE = new Set(['st_site','st_wh_rec','st_wh_issue']);
function showState(k){return !OPTIONAL_STATE.has(k) || S.rows.some(r => {const v=valOf(r,k);return v===true || Number(v)===1;});}
const onCols = () => {
  const visible=S.cols.filter(c=>c.on && showState(c.k));
  return visible.filter(c=>TICKS.has(c.k)).concat(visible.filter(c=>!TICKS.has(c.k)));
};
function pinStateColumns(){
  const grid=$('grid'), heads=grid.querySelectorAll('thead tr.cols th');
  if(!heads.length) return;
  const count=onCols().filter(c=>TICKS.has(c.k)).length;
  let left=heads[0].getBoundingClientRect().width;
  const rows=grid.querySelectorAll('thead tr.cols,thead tr.flt,tbody tr');
  for(let i=1;i<=count;i++){
    for(const row of rows){const cell=row.children[i];if(cell){cell.classList.add('state-fixed');cell.style.left=left+'px';}}
    left+=heads[i].getBoundingClientRect().width;
  }
  const band=grid.querySelector('thead tr.band th:nth-child(2)');
  if(count && band){band.classList.add('state-fixed');band.style.left=heads[0].getBoundingClientRect().width+'px';}
}
window.addEventListener('resize',()=>requestAnimationFrame(pinStateColumns));

/* ══════════════════════════════════════════════════════════════
   กรอง + เรียง (ฝั่งหน้าจอ · ลอตหนึ่งไม่เกินไม่กี่พันแถว พอไหว)
   ══════════════════════════════════════════════════════════════ */
function viewRows(){
  let rs = S.rows;
  /* กรองหยาบก่อน ตัดแถวออกได้เยอะสุด */
  if(S.view === 'todo')      rs = rs.filter(r => isPiece(r) && !isDone(r));
  else if(S.view === 'pack') rs = rs.filter(r => !isPiece(r));
  else if(S.view === 'orph') rs = rs.filter(isOrphan);   /* v3.8 */
  const fk = Object.keys(S.filters).filter(k => S.filters[k]);
  if(fk.length){
    rs = rs.filter(r => fk.every(k => {
      const raw = valOf(r, k);
      /* v3.9 กรองช่อง Part ต้องเดินตามกฎเดียวกับที่ตารางแสดง
         ไม่งั้นแถวที่เห็นเป็นติ๊ก พอกรอง "ติ๊กแล้ว" กลับหายไป */
      if(k === 'st_part') return isDone(r) === (S.filters[k] === '1');
      if(TICKS.has(k)) return (raw === true || Number(raw) === 1) === (S.filters[k] === '1');
      /* ช่องติ๊กพิมพ์กรองเป็นตัวเลขหรือคำก็ได้ · เทียบกับ True/False เหมือนไฟล์ export */
      const txt = TICKS.has(k) ? (raw === true || Number(raw) === 1 ? 'true 1' : 'false 0')
                               : String(raw == null ? '' : raw);
      return txt.toLowerCase().includes(S.filters[k].toLowerCase());
    }));
  }
  if(S.sort.k && S.sort.dir){
    const k = S.sort.k, d = S.sort.dir;
    rs = rs.slice().sort((a,b) => {
      const x = valOf(a, k), y = valOf(b, k);
      if(x == null && y == null) return 0;
      if(x == null) return 1;      /* ค่าว่างไปท้ายเสมอ ไม่ว่าจะเรียงทางไหน */
      if(y == null) return -1;
      const nx = Number(x), ny = Number(y);
      if(!isNaN(nx) && !isNaN(ny) && x !== '' && y !== '') return (nx - ny) * d;
      return String(x).localeCompare(String(y), 'th') * d;
    });
  }
  return rs;
}

/* ══════════════════════════════════════════════════════════════
   v4.0 แท็บภาพรวม

/* เดือนไทยแบบย่อ · ใช้กับป้ายกราฟและตาราง
   ข้อความไทยทั้งหมดในแท็บนี้เป็น sans ห้ามใส่ mono ฟอนต์ไม่มีตัวอักษรไทย */
const THM = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.',
             'ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

/* AX เก็บกำหนดเสร็จเป็น ค.ศ. · หน้างานอ่านเป็น พ.ศ. กันทั้งโรงงาน
   แปลงตอนแสดงผลอย่างเดียว ในฐานยังเป็น ค.ศ. เหมือนเดิม */
function beYear(y){ return (parseInt(y,10) || 0) + 543; }
function dayTh(s){
  const p = String(s || '').slice(0,10).split('-');
  if(p.length !== 3) return '';
  return parseInt(p[2],10) + ' ' + (THM[parseInt(p[1],10)-1] || '') + ' ' +
         String(beYear(p[0])).slice(2);
}
function monTh(key){          /* key = YYYY-MM */
  const p = String(key || '').split('-');
  if(p.length < 2) return '';
  return (THM[parseInt(p[1],10)-1] || '') + ' ' + String(beYear(p[0])).slice(2);
}
/* v4.6 เลขสัปดาห์แบบ ISO 8601 · มาตรฐานเดียวกับที่ AX และ Excel ใช้
   กติกา: สัปดาห์เริ่มวันจันทร์ · สัปดาห์ที่ 1 คือสัปดาห์ที่มีวันพฤหัสแรกของปี
   จึงมีบางปีที่ต้นเดือนมกราคมยังนับเป็นสัปดาห์ท้ายของปีก่อน และมีปีที่มี 53 สัปดาห์
   เขียนเองไม่ได้เดา เพราะ JS ไม่มีให้ในตัว · ตรวจกับวันที่รู้คำตอบแล้วหลายจุด */
function isoWeek(v){
  const t = Date.parse(String(v || '').slice(0,10) + 'T00:00:00');
  if(isNaN(t)) return null;
  const d = new Date(t);
  d.setHours(0,0,0,0);
  /* เลื่อนไปวันพฤหัสของสัปดาห์เดียวกัน · ปีของวันพฤหัสคือปีของสัปดาห์นั้นเสมอ */
  d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const y = d.getFullYear();
  const jan4 = new Date(y, 0, 4);
  const w = 1 + Math.round(((d - jan4) / 86400000 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
  return { y, w };
}
const weekTx = v => { const k = isoWeek(v); return k ? ('W' + k.w) : ''; };

/* วันจันทร์ของสัปดาห์ที่วันนั้นอยู่ · ใช้เป็นคีย์ของกราฟรายสัปดาห์ */
function weekKey(s){
  const t = Date.parse(String(s || '').slice(0,10) + 'T00:00:00');
  if(isNaN(t)) return '';
  const d = new Date(t);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' +
         String(d.getDate()).padStart(2,'0');
}

/* v5.2 วันนี้ตามเวลาเครื่อง · ห้ามใช้ toISOString เพราะนั่นเป็น UTC
   ไทยเร็วกว่า UTC 7 ชั่วโมง ก่อนเจ็ดโมงเช้าจะได้วันของเมื่อวาน
   แล้วลอตที่ครบกำหนดวันนี้จะถูกนับว่าเลยกำหนดไปทั้งวัน */
function todayKey(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
/* วันจันทร์ของสัปดาห์นี้ · คีย์เดียวกับที่ d.wk ใช้ */
const thisWeekKey = () => weekKey(todayKey());

/* v5.3 ช่วงวันของสัปดาห์ที่ขึ้นต้นด้วยวันจันทร์นั้น · จันทร์ถึงอาทิตย์
   คิดวันเองไม่ผ่าน toISOString ด้วยเหตุผลเดียวกับ todayKey */
function weekSpanTh(mon){
  const t = Date.parse(String(mon || '') + 'T00:00:00');
  if(isNaN(t)) return '';
  const e = new Date(t + 6 * 86400000), p = n => String(n).padStart(2,'0');
  const endKey = e.getFullYear() + '-' + p(e.getMonth()+1) + '-' + p(e.getDate());
  return dayTh(mon) + ' – ' + dayTh(endKey);
}

/* เลยกำหนดแล้วยังไม่จบ · ที่เดียวที่นิยามคำนี้ ใช้ทั้ง KPI ตัวกรอง และตาราง
   ลอตที่ไม่มีกำหนดเสร็จไม่นับ ไม่ใช่เพราะไม่สำคัญ แต่เพราะบอกไม่ได้ว่าเลยหรือยัง */
function isLate(r, today){
  const ed = String(r.end_date || '');
  if(!ed) return false;
  return ed < (today || todayKey()) && statOf(r) !== ST_DONE;
}

/* เงิน · ยอดรวมอ่านเป็นล้าน ยอดรายลอตอ่านเป็นบาทเต็ม */
const nfM = new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function baht(v){ return v == null ? '' : nf0.format(Math.round(Number(v) || 0)); }
function mBaht(v){ return nfM.format((Number(v) || 0) / 1e6); }

/* BU ไม่มีเป็นคอลัมน์ใน AX · หมายเหตุลอตขึ้นต้นด้วย BUx.x เป็นแบบแผนอยู่แล้ว
   แกะจากตรงนั้น ลอตที่ไม่ได้ขึ้นต้นแบบนั้นไปกอง "ไม่ระบุ" ไม่ใช่หายไปเฉย ๆ */
function buOf(r){
  const m = /BU\s*(\d+(?:\.\d+)?)/i.exec(String(r.lot_remark || ''));
  return m ? ('BU' + m[1]) : '';
}
/* ยอดที่ถือว่าตัดแล้วของลอตหนึ่ง
   v3.9 ตั้งกฎไว้ว่า "ห่อแล้วแต่ไม่ได้ยิงตัด ถือว่าตัดแล้ว" ซึ่งเป็นกฎของระบบเก่า
   หน้ารายชิ้นนับกฎนั้นทีละแถวได้เพราะมีข้อมูลรายชิ้นอยู่ในมือ
   แท็บนี้มีแต่ยอดรวม จึงบอกไม่ได้ว่าชิ้นที่ห่อกับชิ้นที่ตัดซ้อนกันแค่ไหน
   ใช้ค่าที่มากกว่าเป็นตัวแทน · ไม่ตรงเป๊ะทุกกรณี แต่ใกล้กว่าการนับ
   เฉพาะช่องตัด ซึ่งจะทำให้ลอตที่ห่อครบแล้วขึ้นว่ายังไม่เสร็จ
   ขัดกับตัวเลขบนหน้ารายชิ้นของลอตเดียวกัน */
function cutOf(r){
  const t = Number(r.total_all) || 0;
  const c = Math.max(Number(r.checked_all) || 0, Number(r.checked_pack) || 0);
  return Math.min(c, t);
}
/* สถานะจากยอดที่มีอยู่แล้ว ไม่ได้ไปตีความ lot_status ของ AX
   ซึ่งยังไม่รู้ว่าเลขไหนแปลว่าอะไร · เก็บค่าดิบไว้ในฐานรอดูสถิติต่อ
   (ตรวจแล้วทั้งฐาน 4,238 ลอตที่มีค่า เป็นเลข 0 หมด มี 1 อยู่ใบเดียว ใช้ไม่ได้)

   v5.2 "จบ" = ผ่านถึงเข้าคลัง ไม่ใช่ตัดครบ ตามที่เจ้าของงานสั่ง
   ตัดครบแต่ยังไม่เข้าคลังจึงต้องเป็นสถานะของตัวเอง ไม่ใช่เอาไปรวมกับจบ
   และไม่ใช่เอาไปรวมกับกำลังทำ เพราะหน้าไลน์ทำงานเสร็จแล้ว ปัญหาอยู่ปลายทาง
   คนที่ต้องไปตามเป็นคนละคนกัน จอที่รวมสองอันนี้เข้าด้วยกันจะชี้ผิดคน */
function statOf(r){
  const t = Number(r.total_all) || 0;
  if(!t) return 'ไม่มีรายชิ้น';
  if((Number(r.checked_wh) || 0) >= t) return 'เข้าคลังครบ';
  const c = cutOf(r);
  if(c >= t) return 'ตัดครบ รอเข้าคลัง';
  if(c > 0)  return 'กำลังตัด';
  return 'ยังไม่เริ่ม';
}
/* เรียงตามลำดับงานจริง ซ้ายไปขวา ไม่ได้เรียงตามตัวอักษร */
const DASH_ST = ['ยังไม่เริ่ม','กำลังตัด','ตัดครบ รอเข้าคลัง','เข้าคลังครบ','ไม่มีรายชิ้น'];
const ST_DONE = 'เข้าคลังครบ';   /* ที่เดียวที่นิยามคำว่า "จบ" · จะเปลี่ยนก็เปลี่ยนตรงนี้ */

/* ── v5.4 ตัวกรองรายคอลัมน์ของตารางรายการลอต ────────────────────
   v5.5 แยกสองแบบตามลักษณะของข้อมูล ไม่ได้เลือกตามความชอบ
     ลูกศร  ใช้กับคอลัมน์ที่ค่าเป็นชุดจำกัด เลือกแล้วเทียบตรงตัว
            สัปดาห์ 47 ค่า · สายผลิต 19 ค่า · กำหนดเสร็จ 229 ค่า · ชั้น 1,467 ค่า
            ชั้นเยอะจริง แต่พอเลือกสายผลิตหรือสัปดาห์ก่อน รายการจะสั้นลงมาก
            เพราะตัวเลือกสร้างจากของที่เหลืออยู่จริง ไม่ใช่จากทั้งตาราง
     พิมพ์  ใช้กับคอลัมน์ที่ค่าเกือบไม่ซ้ำกันเลย ทำลูกศรแล้วเลื่อนหาไม่ไหว
            ลอต 4,857 ค่า · หมายเหตุลอต 4,140 ค่า · หมายเหตุวางแผน 2,381 ค่า
            เทียบแบบมีข้อความอยู่ข้างใน เพราะหมายเหตุเป็นประโยคยาว */
const DCOL_SEL = ['end','wk','pool','shelf'];
const DCOL_TXT = ['lot','rm','pd'];
const DCOLS    = ['lot','end','wk','pool','shelf','rm','pd'];   /* ลำดับบนจอ */

/* ป้ายที่ตาเห็นในคอลัมน์นั้น · ใช้ทั้งเป็นตัวเลือกในลูกศรและเป็นตัวเทียบ
   สองอย่างนี้ต้องมาจากฟังก์ชันเดียวกัน ไม่งั้นเลือกแล้วไม่เจอสักแถว */
function dColLabel(r, k){
  switch(k){
    case 'lot':   return String(r.lot || '');
    case 'end':   return dayTh(r.end_date);
    case 'wk':    return weekTx(r.end_date);
    case 'pool':  return String(r.prod_pool || '');
    case 'shelf': return String(r.shelf || '');
    case 'rm':    return String(r.lot_remark || '');
    case 'pd':    return String(r.pd_remark || '');
    default:      return '';
  }
}
/* ค่าที่ใช้เรียงตัวเลือกในลูกศร · ป้ายเรียงตามตัวอักษรแล้วผิดลำดับเวลา
   W1 W10 W11 W2 ไม่ใช่ลำดับสัปดาห์ · วันที่ไทยก็เรียงตามตัวอักษรไม่ได้ */
function dColSort(r, k){
  if(k === 'end') return String(r.end_date || '');
  if(k === 'wk')  return weekKey(r.end_date);
  return dColLabel(r, k);
}

/* กรองตามตัวเลือกบนจอ · ตัวเดียวที่ตัดสินว่าอะไรถูกนับบ้าง
   ทั้ง KPI กราฟ และตาราง อ่านจากผลของฟังก์ชันนี้ชุดเดียวกัน
   จะได้ไม่มีทางที่ตัวเลขบนจอเดียวกันจะขัดกันเอง */
function dashFiltered(skipCol){
  const d = S.dash;
  const q = d.q.trim().toLowerCase();
  return d.rows.filter(r => {
    const ed = String(r.end_date || '');
    if(d.year && ed.slice(0,4) !== d.year) return false;
    if(d.mon  && ed.slice(0,7) !== d.mon)  return false;
    if(d.wk   && weekKey(ed) !== d.wk)     return false;
    if(d.pool && String(r.prod_pool || '') !== d.pool) return false;
    if(d.bu   && (buOf(r) || 'ไม่ระบุ') !== d.bu) return false;
    if(d.st   && statOf(r) !== d.st) return false;
    if(d.late && !isLate(r)) return false;   /* v5.2 */
    /* v5.4 ตัวกรองรายคอลัมน์ · ทุกช่องที่กรอกต้องผ่านหมด ไม่ใช่ผ่านช่องใดช่องหนึ่ง
       v5.5 ช่องลูกศรเทียบตรงตัว ช่องพิมพ์เทียบแบบมีข้อความอยู่ข้างใน
       ช่องลูกศรต้องตรงตัว ไม่งั้นเลือก W1 แล้วจะติด W10 W11 W12 มาด้วย

       skipCol = ข้ามคอลัมน์นั้นตอนสร้างรายการตัวเลือกของมันเอง
       ถ้าไม่ข้าม พอเลือกค่าหนึ่งแล้วรายการจะเหลือค่าเดียว กลับไปเลือกอย่างอื่นไม่ได้
       บทเรียนเดียวกับที่ตัวเลือกของช่องกรองข้างบนสร้างจาก all ไม่ใช่ rows */
    for(const ck of DCOLS){
      if(ck === skipCol) continue;
      const cv = String((d.col && d.col[ck]) || '').trim();
      if(!cv) continue;
      if(DCOL_SEL.indexOf(ck) >= 0){
        if(dColLabel(r, ck) !== cv) return false;
      } else {
        if(!dColLabel(r, ck).toLowerCase().includes(cv.toLowerCase())) return false;
      }
    }
    if(q){
      const hay = (r.lot + ' ' + (r.lot_remark || '') + ' ' + (r.pd_remark || '') + ' ' +
                   (r.proj_name || '')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/* รวมยอดตามคีย์ · คืนเป็น [{k,label,amt,n}] เรียงตามที่สั่ง */
function sumBy(rows, keyFn, labelFn){
  const m = new Map();
  rows.forEach(r => {
    const k = keyFn(r);
    if(k === '' || k == null) return;
    const o = m.get(k) || { k, label:labelFn(k), amt:0, n:0 };
    o.amt += Number(r.amount) || 0;
    o.n++;
    m.set(k, o);
  });
  return [...m.values()];
}

/* กราฟแท่ง · div ล้วน ไม่มี library ไม่มี canvas
   sel = คีย์ที่กรองอยู่ · act ว่างไว้ = แท่งกดไม่ได้ */
function barsHtml(items, sel, act, opt){
  const o = opt || {};
  if(!items.length) return '<div class="none">ไม่มีข้อมูลในเงื่อนไขนี้</div>';
  const max = Math.max(...items.map(i => i.amt), 1);
  return '<div class="bars">' + items.map(i => {
    const w = Math.max(1, Math.round(i.amt / max * 100));
    const on = sel && sel === i.k;
    return '<div class="' + (on ? 'bar on' : 'bar') + (act ? '' : ' plain') + '"' +
           (act ? ' data-act="' + act + '" data-k="' + esc(i.k) + '"' : '') +
           ' title="' + esc(i.label + (i.label2 ? ' · เริ่ม ' + i.label2 : '') +
                              ' · ' + baht(i.amt) + ' บาท · ' + i.n + ' ลอต') + '">' +
           '<div class="t' + (o.mono ? ' mono' : '') + '">' + esc(i.label) + '</div>' +
           '<div class="g"><i style="width:' + w + '%"></i></div>' +
           '<div class="v">' + mBaht(i.amt) + '</div></div>';
  }).join('') + '</div>';
}

/* v5.0 แท่งตั้ง · ป้ายตัวเลขอยู่เหนือแท่ง ชื่ออยู่ใต้แท่ง เหมือนรายงานเดิม
   ตัวเลขบนหัวแท่งเป็นล้านบาทเสมอ ล้อของเดิมที่เขียน "94ล้าน"
   แท่งที่ยอดเป็นศูนย์ยังต้องเห็น ไม่งั้นเดือนที่ไม่มีงานจะหายไปจากแกน
   แล้วคนอ่านจะนึกว่าไม่มีเดือนนั้น ไม่ใช่ว่าเดือนนั้นยอดศูนย์ */
function vbarsHtml(items, sel, act, opt){
  const o = opt || {};
  if(!items.length) return '<div class="bars"><div class="none">ไม่มีข้อมูลในเงื่อนไขนี้</div></div>';
  const max = Math.max(...items.map(i => i.amt), 1);
  return '<div class="vwrap"><div class="vbars">' + items.map(i => {
    const pc = Math.max(0.6, i.amt / max * 100);
    const on = sel && sel === i.k;
    return '<div class="vbar' + (on ? ' on' : '') + (act ? '' : ' plain') +
             (o.slim ? ' slim' : ' wide') + '"' +
           (act ? ' data-act="' + act + '" data-k="' + esc(i.k) + '"' : '') +
           ' title="' + esc(i.label + (i.label2 ? ' · เริ่ม ' + i.label2 : '') +
                            ' · ' + baht(i.amt) + ' บาท · ' + i.n + ' ลอต') + '">' +
           '<div class="vv">' + (i.amt >= 1e4 ? mBaht(i.amt) : '0') + '</div>' +
           '<div class="vg" style="height:' + pc.toFixed(1) + '%"></div>' +
           '<div class="vt">' + esc(i.label) + '</div>' +
         '</div>';
  }).join('') + '</div></div>';
}

function optHtml(list, cur, anyLabel){
  return '<option value="">' + esc(anyLabel) + '</option>' +
         list.map(v => '<option value="' + esc(v) + '"' +
                       (String(cur) === String(v) ? ' selected' : '') + '>' +
                       esc(v) + '</option>').join('');
}

function renderDash(){
  const box = $('viewDash'), d = S.dash;

  if(d.busy){ box.innerHTML = '<div class="blk"><span class="spin"></span> ' + esc(d.busy) + '</div>'; return; }
  if(d.err){  box.innerHTML = '<div class="blk dwarn"><span>⚠</span><span>' + esc(d.err) + '</span></div>'; return; }
  if(!d.loaded){ box.innerHTML = '<div class="blk">ยังไม่ได้โหลดข้อมูล</div>'; return; }

  const rows = dashFiltered();
  const amt  = rows.reduce((a,r) => a + (Number(r.amount) || 0), 0);
  const withAmt = rows.filter(r => r.amount != null).length;
  const tAll = rows.reduce((a,r) => a + (Number(r.total_all)   || 0), 0);
  const cAll = rows.reduce((a,r) => a + cutOf(r), 0);
  const today = todayKey();
  const late = rows.filter(r => isLate(r, today));
  const lateAmt = late.reduce((a,r) => a + (Number(r.amount) || 0), 0);
  /* ลอตที่จับใบขายได้ แต่ยันไม่ได้ว่าใบไหนเป็นของลอตนี้ · ต้องนับให้เห็น
     ไม่ใช่ปล่อยให้เงียบไปกับช่องว่าง คนดูจะได้รู้ว่ายอดรวมยังไม่ครบแค่ไหน */
  const amb  = rows.filter(r => r.amount_lv === 'ambiguous').length;
  const skip = rows.reduce((a,r) => a + (Number(r.amount_skip) || 0), 0);

  /* รายการตัวเลือกของช่องกรอง · สร้างจากข้อมูลทั้งหมด ไม่ใช่จากที่กรองแล้ว
     ไม่งั้นพอเลือกอันหนึ่งแล้ว ตัวเลือกอื่นจะหายไปจนกลับไปเลือกใหม่ไม่ได้ */
  const all   = d.rows;
  const years = [...new Set(all.map(r => String(r.end_date || '').slice(0,4)).filter(Boolean))].sort();
  const pools = [...new Set(all.map(r => r.prod_pool).filter(Boolean))].sort();
  const bus   = [...new Set(all.map(r => buOf(r) || 'ไม่ระบุ'))].sort();

  let byMon = sumBy(rows, r => String(r.end_date || '').slice(0,7), monTh)
                .sort((a,b) => a.k < b.k ? -1 : 1);
  /* เติมเดือนที่ยอดเป็นศูนย์ให้ครบช่วง · แกนขาดเดือนแล้วอ่านผิดว่าไม่มีเดือนนั้น
     ทำเฉพาะตอนเลือกปีเดียว ไม่งั้นช่วงข้ามปีจะยาวจนไม่มีประโยชน์ */
  if(d.year && byMon.length){
    const full = [];
    for(let m = 1; m <= 12; m++){
      const k = d.year + '-' + String(m).padStart(2,'0');
      full.push(byMon.find(x => x.k === k) || { k, label:monTh(k), amt:0, n:0 });
    }
    byMon = full;
  }
  const byPool = sumBy(rows, r => r.prod_pool || '', k => k)
                   .sort((a,b) => b.amt - a.amt).slice(0,12);
  /* ป้ายเป็นเลขสัปดาห์ · วันจันทร์ของสัปดาห์นั้นไปอยู่ใน tooltip ของแท่ง
     ปีติดไว้ด้วยเมื่อคร่อมปี ไม่งั้น W01 ของสองปีจะดูเหมือนอันเดียวกัน */
  const byWeek = sumBy(rows, r => weekKey(r.end_date),
                       k => { const x = isoWeek(k); return x ? ('W' + x.w) : ''; })
                   .sort((a,b) => a.k < b.k ? -1 : 1).slice(-12);
  byWeek.forEach(x => { x.label2 = dayTh(x.k); });

  /* v5.2 สรุปรายสัปดาห์แยกตามสถานะ · คิดจาก d.rows ทั้งชุด ไม่ใช่ rows ที่กรองแล้ว
     ยกเว้นตัวกรองที่ไม่ใช่เวลา (สายผลิต BU ค้นหา) ซึ่งยังต้องมีผล
     ไม่งั้นพอกดเลือกสัปดาห์หนึ่งแล้ว สัปดาห์อื่นจะหายไปจนกลับไปเลือกไม่ได้
     เหตุผลเดียวกับที่รายการตัวเลือกของช่องกรองสร้างจาก all ไม่ใช่ rows */
  const qWk = d.q.trim().toLowerCase();
  const wkBase = d.rows.filter(r => {
    if(d.pool && String(r.prod_pool || '') !== d.pool) return false;
    if(d.bu   && (buOf(r) || 'ไม่ระบุ') !== d.bu) return false;
    if(qWk){
      const hay = (r.lot + ' ' + (r.lot_remark || '') + ' ' + (r.pd_remark || '') + ' ' +
                   (r.proj_name || '')).toLowerCase();
      if(!hay.includes(qWk)) return false;
    }
    return true;
  });
  /* สัปดาห์นี้ถอยหลังหนึ่ง ไปข้างหน้าสี่ · ของเก่ากว่านั้นดูที่ปุ่มเลยกำหนดแทน
     ซึ่งตอบตรงกว่า เพราะคนถามว่า "ค้างอะไรอยู่" ไม่ได้ถามว่า "สัปดาห์ที่ 12 เป็นไง" */
  const wkNow = thisWeekKey();
  /* วันจันทร์ของสัปดาห์ที่แล้ว · คิดเองไม่ผ่าน toISOString ซึ่งเป็น UTC
     ถ้าใช้ตัวนั้น ช่วงหัวค่ำถึงเที่ยงคืนจะได้วันที่เลื่อนไปหนึ่งวัน */
  const wkPrev = (() => {
    const t = Date.parse(wkNow + 'T00:00:00');
    if(isNaN(t)) return wkNow;
    const x = new Date(t - 7 * 86400000), p = n => String(n).padStart(2,'0');
    return x.getFullYear() + '-' + p(x.getMonth()+1) + '-' + p(x.getDate());
  })();
  const wkMap = new Map();
  wkBase.forEach(r => {
    const k = weekKey(r.end_date);
    if(!k) return;
    if(!wkMap.has(k)) wkMap.set(k, { k, n:0, st:{} });
    const o = wkMap.get(k);

    const s = statOf(r);
    o.st[s] = (o.st[s] || 0) + 1;

  const wkList = [...wkMap.values()]
    .filter(x => x.k >= wkPrev)
    .sort((a,b) => a.k < b.k ? -1 : 1)
    .slice(0, 6);
  const lateAll = wkBase.filter(r => isLate(r, today)).length;
  /* v5.4 กรองคอลัมน์อยู่กี่ช่อง · ใช้ตัดสินว่าจะโชว์ปุ่มล้างไหม */

  /* ตาราง · จำกัดจำนวนแถวไว้ ไม่งั้นสี่พันแถวจะหน่วงตอนวาด
     คนที่อยากได้ครบกด Export เอา ซึ่งไม่ได้ตัดที่ 300 */
  const CAP = 300;
  const sorted = rows.slice().sort((a,b) => {
    if(d.sort === 'end')  return String(a.end_date || '9999') < String(b.end_date || '9999') ? -1 : 1;
    if(d.sort === 'lot')  return String(a.lot).localeCompare(String(b.lot), 'th');
    return (Number(b.amount) || 0) - (Number(a.amount) || 0);
  });
  const shown = sorted.slice(0, CAP);

  const kpi = (k, v, u, s, hi) =>
    '<div class="kpi' + (hi ? ' hi' : '') + '"><div class="k">' + esc(k) + '</div>' +
    '<div class="v">' + esc(v) + (u ? '<span class="u">' + esc(u) + '</span>' : '') + '</div>' +
    (s ? '<div class="s">' + esc(s) + '</div>' : '') + '</div>';

  const pct = tAll ? Math.round(cAll / tAll * 100) : 0;

  /* ข้อมูลสดแค่ไหน · เอาเวลาซิงก์ล่าสุดที่มีในชุดนี้มาโชว์ ไม่ใช่เวลาเครื่องคนดู */
  const fresh = all.reduce((m,r) => Math.max(m, parseUtc(r.head_at), parseUtc(r.updated_at)), 0);

  box.innerHTML =

      '<span class="t1">Lot BI · ความคืบหน้าและมูลค่างาน</span>' +
      '<span class="t2">ข้อมูลจาก AX Progress ผ่าน StarSync · วัตถุดิบดูได้ที่ปุ่มท้ายแถว</span>' +
      '<span class="t3">' + (fresh ? 'อัปเดต ' + esc(agoTx(fresh)) : '') + '</span>' +

      '<label>เรียงตาม</label><select class="dsel" data-dsel="sort">' +

        '<span class="sub2">ล้านบาท · กดแท่งเพื่อกรอง</span></h4>' +
        vbarsHtml(byMon, d.mon, 'dmon', {}) + '</div>' +
      '<div class="blk"><h4>ยอดรวมตามสายผลิต ' +
        '<span class="sub2">ล้านบาท · กดแท่งเพื่อกรอง</span></h4>' +
        vbarsHtml(byPool, d.pool, 'dpool', {}) + '</div>' +
    '</div>' +
    '<div class="blk"><h4>ยอดรวมตามสัปดาห์ ' +
      '<span class="sub2">ล้านบาท · 12 สัปดาห์ล่าสุดในเงื่อนไขนี้ · กดแท่งเพื่อกรอง</span></h4>' +
      vbarsHtml(byWeek, d.wk, 'dwk', { slim:true }) + '</div>' +

    /* ── ตาราง ── */
    '<div class="blk"><h4>รายการลอต ' +
      '<span class="sub2">' + (rows.length > CAP ? 'แสดง ' + CAP + ' จาก ' + nf0.format(rows.length) +
        ' · กด Export เพื่อเอาครบ' : nf0.format(rows.length) + ' ลอต') +
      ' · กดแถวเพื่อไปดูรายชิ้น · กดปุ่มท้ายแถวเพื่อดูวัตถุดิบ</span></h4>' +
      '<div class="dwrap"><table class="dtab"><thead><tr>' +
        '<th>ลอต</th><th>กำหนดเสร็จ</th><th>สัปดาห์</th><th>สายผลิต</th><th>ชั้น</th>' +
        '<th>หมายเหตุลอต</th><th>หมายเหตุวางแผน</th><th>ตัด</th><th style="text-align:right">มูลค่า</th>' +
        '<th></th>' +
      '</tr>' +
      /* v5.4 แถวช่องกรองรายคอลัมน์ · เว้นสามช่องท้ายไว้
         ตัดเป็นเปอร์เซ็นต์ มูลค่าเป็นตัวเลข สองอันนั้นกรองด้วยข้อความไม่ได้ความ
         ใครอยากกรองตามความคืบหน้าให้ใช้ช่องสถานะข้างบน ซึ่งตรงกว่า
         v5.5 ช่องลูกศรสี่ช่อง ช่องพิมพ์สามช่อง · ดู DCOL_SEL / DCOL_TXT */
      '<tr class="dflt">' +
        DCOLS.map(k => {
          const cur = (d.col && d.col[k]) || '';
          if(DCOL_TXT.indexOf(k) >= 0){
