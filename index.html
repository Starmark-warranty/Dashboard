<style>
:root{
  --bg:#f4f5f8; --bg2:#ffffff;
  --card:#ffffff; --line:#e3e6ec; --line2:#d3d8e2;
  --ink:#1b1c20; --dim:#5f636e; --faint:#8b909c;
  --navy:#1F3864; --orange:#E8901F;
  --cut:#2563eb; --cut-bg:#eaf1fe;
  --plan:#0d9488; --plan-bg:#e6f6f4;
  --radius:16px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 12px 28px -12px rgba(16,24,40,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100dvh; background:var(--bg); color:var(--ink);
  font-family:"Sarabun",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:28px 18px calc(28px + env(safe-area-inset-bottom));
  /* ไล่สีอ่อน ๆ กันจอดูแบนเกินไป ไม่ได้ใช้ภาพพื้นหลังเพื่อให้โหลดเร็ว */
  background-image:radial-gradient(1100px 520px at 50% -10%, #ffffff 0%, var(--bg) 62%);
}
.wrap{width:100%; max-width:560px; text-align:center}

.logo{
  width:min(260px,62vw); height:auto; margin:0 auto 26px; display:block;
  /* โลโก้ฝังมาในไฟล์ ไม่ได้ลิงก์ออกไปข้างนอก */
}
h1{font-size:26px; font-weight:700; margin:0 0 8px; letter-spacing:-.3px}
.sub{font-size:14px; color:var(--dim); line-height:1.75; margin:0 0 30px}

.cards{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media (max-width:520px){ .cards{grid-template-columns:1fr} }

.card{
  display:flex; flex-direction:column; align-items:center; gap:2px;
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:26px 18px 22px; text-decoration:none; color:inherit;
  box-shadow:var(--shadow); transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
  min-height:168px; justify-content:center;
}
.card:hover{transform:translateY(-2px); border-color:var(--line2);
  box-shadow:0 2px 4px rgba(16,24,40,.06), 0 18px 36px -14px rgba(16,24,40,.24)}
.card:active{transform:translateY(0)}
.card:focus-visible{outline:3px solid var(--navy); outline-offset:3px}

.ic{width:56px; height:56px; border-radius:15px; display:grid; place-items:center; margin-bottom:13px}
.ic svg{width:27px; height:27px; stroke-width:1.9; fill:none; stroke-linecap:round; stroke-linejoin:round}
.c-cut  .ic{background:var(--cut-bg)}   .c-cut  .ic svg{stroke:var(--cut)}
.c-plan .ic{background:var(--plan-bg)}  .c-plan .ic svg{stroke:var(--plan)}
.nm{font-size:17px; font-weight:600}
.c-cut  .nm{color:var(--cut)}
.c-plan .nm{color:var(--plan)}
.ds{font-size:12.5px; color:var(--faint); line-height:1.65; margin-top:5px}

/* นาฬิกามุมขวาบน · fixed เพื่อให้อยู่มุมจอเสมอ ไม่ขยับตามเนื้อหาที่จัดกลาง */
.clock{
  position:fixed; top:calc(14px + env(safe-area-inset-top)); right:14px; z-index:5;
  background:var(--navy); color:#fff; border-radius:12px; padding:10px 16px;
  text-align:right; box-shadow:var(--shadow); line-height:1.35;
}
.clk-t{font-size:22px; font-weight:700; letter-spacing:.5px;
  font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums}
.clk-d{font-size:12px; color:rgba(255,255,255,.88); margin-top:1px}
.clk-w{font-size:11px; color:rgba(255,255,255,.62)}
@media (max-width:520px){
  .clock{top:auto; bottom:calc(12px + env(safe-area-inset-bottom)); right:12px; left:12px;
    display:flex; align-items:baseline; justify-content:center; gap:10px;
    text-align:center; padding:8px 14px; flex-wrap:wrap}
  .clk-t{font-size:18px}
  .clk-w{display:none}
}
.foot{margin-top:26px; font-size:11.5px; color:var(--faint); line-height:1.9}
.foot b{color:var(--dim); font-weight:600}
</style>
</head>

<script>
(function(){
  var DAY = ['วันอาทิตย์','วันจันทร์','วันอังคาร','วันพุธ','วันพฤหัสบดี','วันศุกร์','วันเสาร์'];
  var MON = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
             'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

  /* เลขสัปดาห์แบบ ISO · สัปดาห์เริ่มวันจันทร์ และสัปดาห์ที่ 1 คือสัปดาห์ที่มี 4 ม.ค.
     ต้องใช้กติกาเดียวกับหน้าแผนผลิต ไม่งั้นคนจะเห็น W37 ที่หนึ่ง W38 อีกที่หนึ่ง
     แล้วไม่รู้ว่าจะเชื่ออันไหน · คิดบน UTC เพื่อเลี่ยงปัญหาเวลาออมแสง */
  function isoWeek(d){
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = (t.getUTCDay() + 6) % 7;              // จันทร์ = 0
    t.setUTCDate(t.getUTCDate() - day + 3);         // เลื่อนไปวันพฤหัสของสัปดาห์นั้น
    var first = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
    var fd = (first.getUTCDay() + 6) % 7;
    first.setUTCDate(first.getUTCDate() - fd + 3);
    return 1 + Math.round((t - first) / 604800000);
  }

  var p2 = function(n){ return n < 10 ? '0' + n : '' + n; };
  var lastDay = '';

  function tick(){
    var d = new Date();
    var el = document.getElementById('clkT');
    if(el) el.textContent = p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());

    /* วาดวันที่ใหม่เฉพาะตอนข้ามวัน · เขียนทุกวินาทีเปลืองเปล่า
       และทำให้โปรแกรมอ่านหน้าจอพูดซ้ำทั้งบรรทัดทุกวินาที */
    var key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
    if(key !== lastDay){
      lastDay = key;
      var dd = document.getElementById('clkD'), dw = document.getElementById('clkW');
      if(dd) dd.textContent = DAY[d.getDay()] + ' ' + d.getDate() + ' ' +
                              MON[d.getMonth()] + ' ' + (d.getFullYear() + 543);
      if(dw) dw.textContent = 'สัปดาห์ที่ ' + isoWeek(d) + ' ของปี';
    }
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
